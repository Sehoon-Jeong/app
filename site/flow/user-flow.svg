  <path class="line-ai" d="M1640 1260H1710"/>

  <rect class="node ai" x="930" y="1145" width="290" height="230" rx="22"/>
  <text class="node-title" x="1075" y="1208" text-anchor="middle">원하는 변화</text>
  <text class="node-copy" x="1075" y="1252" text-anchor="middle">자연어로 말하기</text>
  <text class="small" x="1075" y="1300" text-anchor="middle">예: 가볍지만 덜 당김</text>

  <rect class="node ai" x="1290" y="1130" width="350" height="260" rx="22"/>
