      <path d="M1 1L9 5.5L1 10" stroke="#6756BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Pretendard, Inter, Arial, sans-serif; fill: #17201C; }
      .title { font-size: 54px; font-weight: 800; letter-spacing: -1.5px; }
      .subtitle { font-size: 23px; font-weight: 500; fill: #5D6761; }
      .section-no { font-size: 18px; font-weight: 800; fill: #23705E; letter-spacing: 1px; }
      .section-title { font-size: 31px; font-weight: 800; }
      .section-copy { font-size: 18px; font-weight: 500; fill: #6B746E; }
