  <text class="node-copy" x="1830" y="758" text-anchor="middle">살 이유</text>
  <text class="node-copy" x="1830" y="796" text-anchor="middle">망설일 이유</text>
  <text class="node-copy" x="1830" y="834" text-anchor="middle">모르는 것</text>
  <text class="small" x="1830" y="875" text-anchor="middle">적합 보장 아님</text>

