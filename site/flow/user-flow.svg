  <text class="small" x="2530" y="1600" text-anchor="middle">적용 후에도 사용자가 수정</text>

  <rect class="node good" x="2200" y="1720" width="660" height="220" rx="22"/>
  <text class="node-title" x="2530" y="1782" text-anchor="middle">현재 루틴 · DAY 1</text>
  <text class="node-copy" x="2530" y="1828" text-anchor="middle">새 버전으로 저장</text>
  <text class="small" x="2530" y="1876" text-anchor="middle">7일 동안 평소처럼 사용</text>

  <rect class="node warn" x="2200" y="2000" width="660" height="150" rx="22"/>
  <text class="node-title" x="2530" y="2060" text-anchor="middle">7일 전에 바꾸면</text>
  <text class="small" x="2530" y="2104" text-anchor="middle">짧은 결과를 남기고 새 DAY 1</text>

