      .panel { fill: #F8F9F7; stroke: #DCE1DD; stroke-width: 2; }
      .node { fill: white; stroke: #AEB7B1; stroke-width: 2.2; filter: url(#shadow); }
      .ai { fill: #F4F1FF; stroke: #7868D0; }
      .data { fill: #F0F5F2; stroke: #698A77; }
      .good { fill: #ECF8F2; stroke: #2B8769; }
      .warn { fill: #FFF8E8; stroke: #B7892F; }
      .danger { fill: #FFF1EF; stroke: #B85B51; }
      .decision { fill: white; stroke: #8B958E; stroke-width: 2.2; filter: url(#shadow); }
      .line { fill: none; stroke: #69736D; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .line-ai { fill: none; stroke: #6756BA; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-ai); }
      .line-dashed { fill: none; stroke: #7D8780; stroke-width: 2.5; stroke-dasharray: 9 9; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
