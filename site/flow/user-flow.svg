  <text class="small" x="440" y="1202" text-anchor="middle">이거 사볼까?</text>
  <text class="small" x="670" y="1202" text-anchor="end">→ 02</text>

  <rect x="180" y="1246" width="520" height="68" rx="17" fill="#F4F1FF" stroke="#7868D0"/>
  <text class="small" x="220" y="1288" fill="#5647A5">B</text>
  <text class="small" x="440" y="1288" text-anchor="middle">제품 추천받기</text>
  <text class="small" x="670" y="1288" text-anchor="end">→ 02</text>

  <rect x="180" y="1332" width="520" height="68" rx="17" fill="white" stroke="#AEB7B1"/>
  <text class="small" x="220" y="1374">C</text>
  <text class="small" x="440" y="1374" text-anchor="middle">새 화장품 추가</text>
  <text class="small" x="670" y="1374" text-anchor="end">→ 03</text>

  <rect x="180" y="1418" width="520" height="68" rx="17" fill="#FFF1EF" stroke="#B85B51"/>
  <text class="small" x="220" y="1460" fill="#963E36">D</text>
  <text class="small" x="440" y="1460" text-anchor="middle" fill="#963E36">불편함이 생겼어요</text>
  <text class="small" x="670" y="1460" text-anchor="end" fill="#963E36">→ 04</text>

