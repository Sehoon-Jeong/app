  <rect class="node" x="2130" y="1145" width="800" height="230" rx="22"/>
  <text class="node-title" x="2530" y="1205" text-anchor="middle">루틴 만들기·수정</text>
  <text class="node-copy" x="2530" y="1252" text-anchor="middle">아침/저녁 · 순서 · 빈도 · 클렌징</text>
  <text class="small" x="2530" y="1304" text-anchor="middle">목록에 없으면 새 화장품 추가 후 돌아옴</text>
