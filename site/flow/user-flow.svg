  <text class="section-no" x="120" y="432">01 · START</text>
  <text class="section-title" x="120" y="478">시작과 홈</text>
  <text class="section-copy" x="120" y="514">필요한 순간을 고른다</text>

  <text class="section-no" x="930" y="432">02 · BEFORE BUYING</text>
  <text class="section-title" x="930" y="478">AI 제품 탐색</text>
  <text class="section-copy" x="930" y="514">한 제품을 따져보거나 후보를 찾는다</text>

  <text class="section-no" x="2100" y="432">03 · USING</text>
  <text class="section-title" x="2100" y="478">내 화장품과 루틴</text>
  <text class="section-copy" x="2100" y="514">구매를 실제 사용 조건과 연결한다</text>

  <text class="section-no" x="3110" y="432">04 · LEARNING</text>
  <text class="section-title" x="3110" y="478">7일 결과와 AI Rescue</text>
  <text class="section-copy" x="3110" y="514">결과를 남기고 다음 행동을 정한다</text>

