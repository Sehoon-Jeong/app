  <text class="node-copy" x="1465" y="1240" text-anchor="middle">현재 루틴 · 제외 조건</text>
  <text class="small" x="1465" y="1294" text-anchor="middle">정해진 피부 enum에 가두지 않음</text>
  <text class="small" x="1465" y="1334" text-anchor="middle">모르는 정보는 그대로 표시</text>

  <rect class="node ai" x="1710" y="1145" width="240" height="230" rx="22"/>
  <text class="node-title" x="1830" y="1208" text-anchor="middle">후보 0~5개</text>
