  <text class="node-copy" x="2530" y="700" text-anchor="middle">제품명 검색 또는 영수증 OCR</text>
  <text class="small" x="2530" y="750" text-anchor="middle">먼저 내 화장품에 넣음</text>
  <text class="small" x="2530" y="792" text-anchor="middle">현재 루틴은 자동 변경하지 않음</text>

  <rect class="node" x="2170" y="910" width="720" height="160" rx="22"/>
