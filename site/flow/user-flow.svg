<svg width="1800" height="1050" viewBox="0 0 1800 1050" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1A211B" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" stroke="#697068" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Pretendard,Inter,Arial,sans-serif;fill:#171A17}.title{font-size:48px;font-weight:800;letter-spacing:-1.8px}.sub{font-size:20px;font-weight:500;fill:#697068}.step{font-size:15px;font-weight:800;fill:#617165;letter-spacing:1.2px}.nodeTitle{font-size:25px;font-weight:800}.copy{font-size:17px;font-weight:500;fill:#697068}.small{font-size:14px;font-weight:650;fill:#798078}.node{fill:#fff;stroke:#DDE2DB;stroke-width:2;filter:url(#shadow)}.core{fill:#F2F6EE;stroke:#758A70}.ai{fill:#F3F2EE;stroke:#30362E}.line{fill:none;stroke:#697068;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1050" fill="#F4F6F2"/>
  <rect x="70" y="58" width="58" height="58" rx="18" fill="#222721"/><text x="99" y="95" text-anchor="middle" font-size="18" font-weight="850" fill="white">SKN</text>
  <text class="title" x="150" y="94">사용 경험이 다음 탐색으로 돌아오는 한 바퀴</text>
  <text class="sub" x="150" y="130">AI가 나를 판정하는 것이 아니라, 내가 남긴 경험을 찾아 연결한다.</text>

  <path class="line" d="M350 380H470"/><path class="line" d="M740 380H860"/><path class="line" d="M1130 380H1250"/>
  <path class="line" d="M1390 505C1390 760 1130 865 900 865C650 865 395 760 395 530"/>

  <g transform="translate(90 270)"><rect class="node" width="260" height="220" rx="28"/><text class="step" x="28" y="42">01 · DISCOVER</text><text class="nodeTitle" x="28" y="84">제품을 탐색한다</text><text class="copy" x="28" y="124">궁금한 제품을 가져오거나</text><text class="copy" x="28" y="152">지난 경험을 기준으로</text><text class="copy" x="28" y="180">다음 후보를 찾는다.</text></g>
  <g transform="translate(470 270)"><rect class="node" width="270" height="220" rx="28"/><text class="step" x="28" y="42">02 · EXPERIENCE</text><text class="nodeTitle" x="28" y="84">실제로 써본다</text><text class="copy" x="28" y="124">제품·아침/저녁·순서·빈도를</text><text class="copy" x="28" y="152">당시 사용 맥락으로</text><text class="copy" x="28" y="180">함께 보존한다.</text></g>
  <g transform="translate(860 270)"><rect class="node core" width="270" height="220" rx="28"/><text class="step" x="28" y="42">03 · RECORD</text><text class="nodeTitle" x="28" y="84">경험을 남긴다</text><text class="copy" x="28" y="124">만족·아쉬움·사용감·조합과</text><text class="copy" x="28" y="152">피부 반응을 내 말로 남긴다.</text><text class="small" x="28" y="188">사용 중 언제든 · 7일은 기본 회고</text></g>
  <g transform="translate(1250 270)"><rect class="node ai" width="370" height="235" rx="28"/><text class="step" x="28" y="42">04 · CONNECT &amp; PATTERN</text><text class="nodeTitle" x="28" y="84">AI가 과거와 연결한다</text><text class="copy" x="28" y="124">반복된 표현과 반대 기록을 찾아</text><text class="copy" x="28" y="152">근거 원문이 보이는 내 패턴으로 만든다.</text><rect x="28" y="180" width="314" height="34" rx="17" fill="#222721"/><text x="185" y="202" text-anchor="middle" font-size="13" font-weight="750" fill="white">다음 제품 탐색에서 다시 사용</text></g>

  <g transform="translate(560 665)"><rect class="node" width="680" height="165" rx="28"/><text class="step" x="28" y="42">불편함이 기록된 경우 · AI RESCUE</text><text class="nodeTitle" x="28" y="82">같은 AI 채팅에서 변경점과 다음 루틴을 정리한다</text><text class="copy" x="28" y="120">원인이나 범인을 확정하지 않고, 비교 기준 이후 변화와 과거 경험을 근거로 사용자가 다음 행동을 고른다.</text></g>
  <path class="line" d="M995 490V630"/><text class="small" x="1012" y="575">불편 경험만 분기</text>

  <rect x="90" y="925" width="1530" height="66" rx="18" fill="#E6EBE3"/>
  <text x="855" y="953" text-anchor="middle" font-size="16" font-weight="780">제품의 핵심</text>
  <text x="855" y="978" text-anchor="middle" font-size="15" font-weight="560" fill="#626A61">내가 계속 경험한다 → SKN이 잃지 않게 연결한다 → 내가 나의 기준을 발견한다</text>
</svg>
