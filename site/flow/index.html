<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>SkinCause 사용자 흐름</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #161817;
      --muted: #686d69;
      --line: #dedfdb;
      --panel: rgba(255,255,255,.94);
      --brand: #1f6e5d;
      --brand-hover: #18594c;
      --canvas: #e9ebe8;
      --shadow: 0 14px 34px rgba(18, 27, 23, .12);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--canvas); color: var(--ink); }
    button, input { font: inherit; }
    button { border: 0; }
    .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    .toolbar {
      position: relative; z-index: 5; display: flex; align-items: center; gap: 12px;
      min-height: 72px; padding: 12px 18px; background: var(--panel);
      border-bottom: 1px solid var(--line); backdrop-filter: blur(18px);
    }
    .identity { display: flex; align-items: center; gap: 12px; min-width: 240px; }
    .back {
      display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 auto;
      border: 1px solid var(--line); border-radius: 11px; color: inherit; text-decoration: none; background: white;
    }
    .back:hover { border-color: #a5aaa6; }
    h1 { margin: 0; font-size: 15px; line-height: 1.25; letter-spacing: -.02em; }
    .meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .controls { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .group { display: flex; align-items: center; gap: 4px; padding: 4px; background: #f2f3f0; border-radius: 12px; }
    .tool {
      height: 36px; padding: 0 12px; border-radius: 9px; background: transparent; color: #414642;
      font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .tool:hover { background: white; }
    .tool.icon { width: 36px; padding: 0; font-size: 18px; }
    .zoom-value { min-width: 54px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
    .primary { background: var(--brand); color: white; }
    .primary:hover { background: var(--brand-hover); }
    .secondary { border: 1px solid var(--line); background: white; }
    .canvas-wrap { position: relative; min-height: 0; }
    .canvas {
      position: absolute; inset: 0; overflow: auto; padding: 56px; cursor: grab;
      background-color: var(--canvas);
      background-image: radial-gradient(#c9cdc9 1px, transparent 1px);
      background-size: 20px 20px;
      overscroll-behavior: contain;
    }
    .canvas.dragging { cursor: grabbing; user-select: none; }
    .artboard {
      width: max-content; min-width: 100%; min-height: 100%; display: grid; place-items: start center;
    }
    #flowImage {
      display: block; width: 6800px; height: auto; max-width: none; background: white;
      box-shadow: 0 18px 55px rgba(25, 32, 28, .16); transform-origin: top center;
    }
    .toast {
      position: fixed; z-index: 10; left: 50%; bottom: 28px; transform: translate(-50%, 16px);
      display: flex; align-items: center; gap: 9px; max-width: calc(100% - 32px); padding: 12px 16px;
      border-radius: 12px; background: #171a18; color: white; box-shadow: var(--shadow);
      font-size: 13px; font-weight: 650; opacity: 0; pointer-events: none; transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: #8d342f; }
    .shortcut { color: #a8aea9; font-size: 11px; font-weight: 500; }
    .loading {
      position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px;
      pointer-events: none;
    }
    .loading.hidden { display: none; }
    @media (max-width: 820px) {
      .toolbar { align-items: flex-start; flex-wrap: wrap; padding: 10px 12px; }
      .identity { min-width: 0; flex: 1; }
      .controls { width: 100%; margin: 0; overflow-x: auto; padding-bottom: 2px; }
      .canvas { padding: 24px; }
      .secondary .wide { display: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="identity">
        <a class="back" href="../" aria-label="Pages 홈으로">←</a>
        <div>
          <h1>SkinCause 사용자 흐름</h1>
          <div class="meta">6,800 × 3,600 · SVG 벡터</div>
        </div>
      </div>
      <div class="controls" aria-label="도면 도구">
        <div class="group">
          <button class="tool icon" id="zoomOut" aria-label="축소">−</button>
          <span class="zoom-value" id="zoomValue">맞춤</span>
          <button class="tool icon" id="zoomIn" aria-label="확대">＋</button>
          <button class="tool" id="fit">화면 맞춤</button>
          <button class="tool" id="actual">100%</button>
        </div>
        <button class="tool secondary" id="download"><span class="wide">SVG </span>다운로드</button>
        <button class="tool primary" id="copyFigma">Figma로 복사</button>
      </div>
    </header>
    <section class="canvas-wrap">
      <div class="canvas" id="canvas" tabindex="0" aria-label="사용자 흐름 도면. 드래그해 이동할 수 있습니다.">
        <div class="artboard"><img id="flowImage" src="./user-flow.svg" alt="SkinCause 디자인 사용자 흐름 전체 도면"></div>
      </div>
      <div class="loading" id="loading">도면을 불러오는 중…</div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const SOURCE = './user-flow.svg';
    const SVG_WIDTH = 6800;
    const SVG_HEIGHT = 3600;
    const canvas = document.querySelector('#canvas');
    const image = document.querySelector('#flowImage');
    const zoomValue = document.querySelector('#zoomValue');
    const toast = document.querySelector('#toast');
    let scale = 1;
    let fitMode = true;
    let toastTimer;
    let svgTextPromise;

    function notify(message, error = false) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = `toast show${error ? ' error' : ''}`;
      toastTimer = setTimeout(() => toast.className = 'toast', 3200);
    }

    function setScale(next, keepCenter = true) {
      const oldWidth = SVG_WIDTH * scale;
      const centerX = canvas.scrollLeft + canvas.clientWidth / 2;
      const centerY = canvas.scrollTop + canvas.clientHeight / 2;
      const xRatio = oldWidth ? centerX / oldWidth : .5;
      const oldHeight = SVG_HEIGHT * scale;
      const yRatio = oldHeight ? centerY / oldHeight : .5;
      scale = Math.min(2, Math.max(.025, next));
      image.style.width = `${SVG_WIDTH * scale}px`;
      zoomValue.textContent = `${Math.round(scale * 100)}%`;
      if (keepCenter) requestAnimationFrame(() => {
        canvas.scrollLeft = SVG_WIDTH * scale * xRatio - canvas.clientWidth / 2;
        canvas.scrollTop = SVG_HEIGHT * scale * yRatio - canvas.clientHeight / 2;
      });
    }

    function fit() {
      fitMode = true;
      const available = Math.max(320, canvas.clientWidth - 112);
      setScale(available / SVG_WIDTH, false);
      zoomValue.textContent = '맞춤';
      requestAnimationFrame(() => { canvas.scrollLeft = 0; canvas.scrollTop = 0; });
    }

    function zoomBy(factor) {
      fitMode = false;
      setScale(scale * factor);
    }

    image.addEventListener('load', () => {
      document.querySelector('#loading').classList.add('hidden');
      fit();
    });
    image.addEventListener('error', () => {
      document.querySelector('#loading').textContent = '도면을 불러오지 못했습니다.';
      notify('SVG 파일을 불러오지 못했습니다.', true);
    });
    document.querySelector('#zoomIn').addEventListener('click', () => zoomBy(1.2));
    document.querySelector('#zoomOut').addEventListener('click', () => zoomBy(1 / 1.2));
    document.querySelector('#fit').addEventListener('click', fit);
    document.querySelector('#actual').addEventListener('click', () => { fitMode = false; setScale(1); });
    window.addEventListener('resize', () => { if (fitMode) fit(); });

    let drag = null;
    canvas.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      drag = { x: event.clientX, y: event.clientY, left: canvas.scrollLeft, top: canvas.scrollTop };
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', event => {
      if (!drag) return;
      canvas.scrollLeft = drag.left - (event.clientX - drag.x);
      canvas.scrollTop = drag.top - (event.clientY - drag.y);
    });
    canvas.addEventListener('pointerup', () => { drag = null; canvas.classList.remove('dragging'); });
    canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('dragging'); });
    canvas.addEventListener('wheel', event => {
      if (!event.ctrlKey && !event.metaKey) return;
      event.preventDefault();
      zoomBy(event.deltaY < 0 ? 1.12 : 1 / 1.12);
    }, { passive: false });

    function getSvgText() {
      if (!svgTextPromise) svgTextPromise = fetch(SOURCE, { cache: 'force-cache' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(text => {
          const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
          if (doc.querySelector('parsererror') || doc.documentElement.tagName.toLowerCase() !== 'svg') {
            throw new Error('Invalid SVG');
          }
          const root = doc.documentElement;
          root.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          root.setAttribute('width', root.getAttribute('width') || '6800');
          root.setAttribute('height', root.getAttribute('height') || '3600');
          root.setAttribute('viewBox', root.getAttribute('viewBox') || '0 0 6800 3600');
          return new XMLSerializer().serializeToString(root);
        });
      return svgTextPromise;
    }

    async function copyForFigma() {
      const button = document.querySelector('#copyFigma');
      const original = button.textContent;
      button.disabled = true;
      button.textContent = '복사 중…';
      try {
        const text = await getSvgText();
        let copied = false;

        if (window.ClipboardItem && navigator.clipboard?.write) {
          try {
            const item = new ClipboardItem({
              'image/svg+xml': new Blob([text], { type: 'image/svg+xml' }),
              'text/html': new Blob([text], { type: 'text/html' }),
              'text/plain': new Blob([text], { type: 'text/plain' })
            });
            await navigator.clipboard.write([item]);
            copied = true;
          } catch (_) {
            copied = false;
          }
        }

        if (!copied) {
          const onCopy = event => {
            event.preventDefault();
            event.clipboardData.setData('text/plain', text);
            event.clipboardData.setData('text/html', text);
            try { event.clipboardData.setData('image/svg+xml', text); } catch (_) {}
          };
          document.addEventListener('copy', onCopy, { once: true });
          copied = document.execCommand('copy');
        }

        if (!copied) throw new Error('Clipboard unavailable');
        button.textContent = '복사됨';
        notify('복사했습니다. Figma 캔버스에서 바로 붙여넣으세요.');
      } catch (error) {
        console.error(error);
        button.textContent = '복사 실패';
        notify('복사하지 못했습니다. SVG 다운로드 후 Figma로 가져오세요.', true);
      } finally {
        setTimeout(() => { button.disabled = false; button.textContent = original; }, 1800);
      }
    }

    document.querySelector('#copyFigma').addEventListener('click', copyForFigma);
    document.querySelector('#download').addEventListener('click', async () => {
      try {
        const text = await getSvgText();
        const url = URL.createObjectURL(new Blob([text], { type: 'image/svg+xml' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'skincause-user-flow.svg';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        notify('SVG 파일을 내려받았습니다.');
      } catch (_) {
        notify('SVG 파일을 내려받지 못했습니다.', true);
      }
    });
    document.addEventListener('keydown', event => {
      if (event.target.matches('input, textarea')) return;
      if (event.key === '+' || event.key === '=') zoomBy(1.2);
      if (event.key === '-') zoomBy(1 / 1.2);
      if (event.key === '0') fit();
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'c') {
        event.preventDefault(); copyForFigma();
      }
    });
  </script>
</body>
</html>
