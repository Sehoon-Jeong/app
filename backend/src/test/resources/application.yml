spring:
  datasource:
    url: jdbc:sqlite:file:skn-test?mode=memory&cache=shared&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  test-harness:
    enabled: true
  openai:
    api-key: ""
    model: gpt-5.6-luna
    reasoning-effort: low
    connect-timeout: 1s
    read-timeout: 1s
    max-output-tokens: 1800
    web-search-enabled: false
    web-search-context-size: low
