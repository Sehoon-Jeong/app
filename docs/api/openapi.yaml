openapi: 3.1.0
info:
  title: SKN API
  version: 0.3.0
  description: |
    개인 스킨케어 경험을 제품·루틴과 연결하고, 원본 기반 패턴을 다음 탐색과 Rescue에 재사용하는 계약이다.
    AI 문장은 사용자 원문이나 시스템 상태의 권위가 아니다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: Auth, description: 계정과 세션 }
  - { name: Catalog, description: 제품 카탈로그 }
  - { name: Collection, description: 내 화장품 }
  - { name: Routines, description: 실제 사용 맥락 }
  - { name: Experiences, description: 경험 원문과 회고 }
  - { name: Patterns, description: 원본 기반 개인 패턴 }
  - { name: Exploration, description: AI 제품 탐색 }
  - { name: Conversations, description: 공통 AI 채팅 }
  - { name: Rescue, description: 불편 경험의 AI 모드 }
  - { name: Jobs, description: 비동기 AI 실행 }
paths:
  /auth/sign-up:
    post:
      summary: 이메일로 가입한다
      security: []
      tags: [Auth]
      operationId: signUp
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '201': { description: 가입됨, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/login:
    post:
      summary: 이메일로 로그인한다
      security: []
      tags: [Auth]
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '200': { description: 로그인됨, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      summary: 내 계정을 조회한다
      tags: [Auth]
      operationId: getMe
      responses:
        '200': { description: 내 계정, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
    delete:
      summary: 계정과 개인 데이터를 삭제한다
      tags: [Auth]
      operationId: deleteMe
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { description: 삭제 시작, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
  /me/home:
    get:
      summary: 경험 중심 홈을 조회한다
      tags: [Experiences, Patterns]
      operationId: getHome
      responses:
        '200': { description: 경험 중심 홈, content: { application/json: { schema: { $ref: '#/components/schemas/Home' } } } }
  /products:
    get:
      summary: 제품명으로 카탈로그를 검색한다
      tags: [Catalog]
      operationId: searchProducts
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        '200': { description: 제품 검색 결과, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } } } } }
  /products/{productVersionId}:
    get:
      summary: 확인된 제품 버전을 조회한다
      tags: [Catalog]
      operationId: getProduct
      parameters: [ { $ref: '#/components/parameters/ProductVersionId' } ]
      responses:
        '200': { description: 확인된 제품 상세, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/products:
    get:
      summary: 내 화장품을 조회한다
      tags: [Collection]
      operationId: listMyProducts
      parameters:
        - { name: relation, in: query, schema: { type: string, enum: [ALL, CURRENT_ROUTINE, UNUSED] } }
      responses:
        '200': { description: 내 화장품, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MyProduct' } } } } }
    post:
      summary: 내 화장품에 제품을 추가한다
      tags: [Collection]
      operationId: createMyProduct
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [productVersionId], properties: { productVersionId: { type: integer } } }
                - { type: object, required: [enteredName], properties: { enteredName: { type: string, minLength: 1, maxLength: 150 } } }
      responses:
        '201': { description: 추가됨, content: { application/json: { schema: { $ref: '#/components/schemas/MyProduct' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/products/{myProductId}:
    get:
      summary: 제품과 연결된 경험을 조회한다
      tags: [Collection]
      operationId: getMyProduct
      parameters: [ { $ref: '#/components/parameters/MyProductId' } ]
      responses:
        '200': { description: 제품과 연결된 경험, content: { application/json: { schema: { $ref: '#/components/schemas/MyProductDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/routines/current:
    get:
      summary: 현재 실제 사용 루틴을 조회한다
      tags: [Routines]
      operationId: getCurrentRoutine
      responses:
        '200': { description: 현재 실제 사용 루틴, content: { application/json: { schema: { $ref: '#/components/schemas/Routine' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/routines:
    post:
      summary: 새 루틴 버전을 시작한다
      tags: [Routines]
      operationId: createRoutine
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoutineWrite' } } } }
      responses:
        '201': { description: 새 사용 맥락 시작, content: { application/json: { schema: { $ref: '#/components/schemas/Routine' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/routines/{routineId}:
    get:
      summary: 루틴 버전을 조회한다
      tags: [Routines]
      operationId: getRoutine
      parameters: [ { $ref: '#/components/parameters/RoutineId' } ]
      responses:
        '200': { description: 루틴 버전, content: { application/json: { schema: { $ref: '#/components/schemas/Routine' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/experiences:
    get:
      summary: 경험 원문 이력을 조회한다
      tags: [Experiences]
      operationId: listExperiences
      parameters:
        - { name: myProductId, in: query, schema: { type: integer } }
        - { name: routineId, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: 경험 원문 이력, content: { application/json: { schema: { $ref: '#/components/schemas/ExperiencePage' } } } }
    post:
      summary: 제품 또는 루틴 경험을 기록한다
      tags: [Experiences]
      operationId: createExperience
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExperienceWrite' } } } }
      responses:
        '201': { description: 원문 저장됨, content: { application/json: { schema: { $ref: '#/components/schemas/ExperienceRecord' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /me/experiences/{experienceId}:
    get:
      summary: 경험 원문과 구조화 관찰을 조회한다
      tags: [Experiences]
      operationId: getExperience
      parameters: [ { $ref: '#/components/parameters/ExperienceId' } ]
      responses:
        '200': { description: 원문·구조화 관찰·맥락, content: { application/json: { schema: { $ref: '#/components/schemas/ExperienceRecord' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/experience-reviews/{scheduleId}:
    get:
      summary: 기본 회고 시점과 상태를 조회한다
      tags: [Experiences]
      operationId: getExperienceReview
      parameters: [ { name: scheduleId, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: 7일 기본 회고 상태, content: { application/json: { schema: { $ref: '#/components/schemas/ExperienceReviewState' } } } }
  /me/patterns:
    get:
      summary: 현재 개인 패턴을 조회한다
      tags: [Patterns]
      operationId: listPatterns
      responses:
        '200': { description: 현재 패턴 후보와 근거 수, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PersonalPattern' } } } } }
  /me/patterns/{patternId}:
    get:
      summary: 패턴과 원본 근거를 조회한다
      tags: [Patterns]
      operationId: getPattern
      parameters: [ { $ref: '#/components/parameters/PatternId' } ]
      responses:
        '200': { description: 패턴과 원본 근거, content: { application/json: { schema: { $ref: '#/components/schemas/PersonalPatternDetail' } } } }
  /me/patterns/{patternId}/feedback:
    put:
      summary: 패턴 관련성 피드백을 저장한다
      tags: [Patterns]
      operationId: putPatternFeedback
      parameters: [ { $ref: '#/components/parameters/PatternId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [feedback], properties: { feedback: { type: string, enum: [RELEVANT, NOT_RELEVANT, UNSURE] } } } } } }
      responses:
        '204': { description: 저장됨 }
  /explorations:
    post:
      summary: 제품과 개인 경험 비교를 시작한다
      tags: [Exploration]
      operationId: createExploration
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExplorationWrite' } } } }
      responses:
        '202': { description: 제품과 개인 경험 비교 시작, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
  /explorations/{explorationId}:
    get:
      summary: 제품 탐색 결과를 조회한다
      tags: [Exploration]
      operationId: getExploration
      parameters: [ { name: explorationId, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: 비교 결과, content: { application/json: { schema: { $ref: '#/components/schemas/Exploration' } } } }
  /conversations:
    post:
      summary: 공통 AI 대화를 시작한다
      tags: [Conversations]
      operationId: createConversation
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationWrite' } } } }
      responses:
        '201': { description: 공통 AI 대화 시작, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
  /conversations/{conversationId}/messages:
    post:
      summary: 공통 AI 대화에 메시지를 보낸다
      tags: [Conversations]
      operationId: createConversationMessage
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string, minLength: 1, maxLength: 3000 } } } } } }
      responses:
        '202': { description: 사용자 메시지 저장·답변 생성 중, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
  /rescues:
    post:
      summary: 불편 경험에서 Rescue를 시작한다
      tags: [Rescue]
      operationId: createRescue
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initialText]
              properties:
                sourceExperienceId: { type: [integer, 'null'] }
                initialText: { type: string, minLength: 1, maxLength: 3000 }
      responses:
        '201': { description: 같은 AI UI에서 Rescue 모드 시작, content: { application/json: { schema: { $ref: '#/components/schemas/Rescue' } } } }
  /rescues/{rescueId}/messages:
    post:
      summary: Rescue 대화에 메시지를 보낸다
      tags: [Rescue]
      operationId: createRescueMessage
      parameters:
        - { $ref: '#/components/parameters/RescueId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string, minLength: 1, maxLength: 3000 } } } } } }
      responses:
        '202': { description: 메시지 저장·답변 생성 중, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
  /rescues/{rescueId}/apply:
    post:
      summary: 승인한 Rescue 루틴을 적용한다
      tags: [Rescue]
      operationId: applyRescue
      parameters:
        - { $ref: '#/components/parameters/RescueId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, expectedCurrentRoutineId]
              properties:
                planId: { type: integer }
                expectedCurrentRoutineId: { type: integer }
      responses:
        '201': { description: 새 독립 루틴 적용, content: { application/json: { schema: { $ref: '#/components/schemas/Routine' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /ai-jobs/{jobId}:
    get:
      summary: AI 작업 상태를 조회한다
      tags: [Jobs]
      operationId: getAiJob
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses:
        '200': { description: 작업 상태, content: { application/json: { schema: { $ref: '#/components/schemas/AiJob' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
    ProductVersionId: { name: productVersionId, in: path, required: true, schema: { type: integer } }
    MyProductId: { name: myProductId, in: path, required: true, schema: { type: integer } }
    RoutineId: { name: routineId, in: path, required: true, schema: { type: integer } }
    ExperienceId: { name: experienceId, in: path, required: true, schema: { type: integer } }
    PatternId: { name: patternId, in: path, required: true, schema: { type: integer } }
    RescueId: { name: rescueId, in: path, required: true, schema: { type: integer } }
    JobId: { name: jobId, in: path, required: true, schema: { type: integer } }
  responses:
    Unauthorized: { description: 인증 필요, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: 없거나 접근 권한 없음, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: 현재 상태와 충돌, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Validation: { description: 입력 검증 실패, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, minLength: 8 } }
    AuthSession:
      type: object
      required: [accessToken, user]
      properties: { accessToken: { type: string }, user: { $ref: '#/components/schemas/Profile' } }
    Profile:
      type: object
      required: [id, email, timezone]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        timezone: { type: string, example: Asia/Seoul }
        currentRoutineId: { type: [integer, 'null'] }
        comparisonBaselineRoutineId: { type: [integer, 'null'] }
    ProductSummary:
      type: object
      required: [productVersionId, brand, name, verificationStatus]
      properties:
        productVersionId: { type: integer }
        brand: { type: string }
        name: { type: string }
        category: { type: string, enum: [SKINCARE, CLEANSING, SUNCARE] }
        volumeOption: { type: [string, 'null'] }
        verificationStatus: { type: string, enum: [UNVERIFIED, VERIFIED, CONFLICTED] }
    ProductFact:
      type: object
      required: [type, text, snapshotId]
      properties:
        type: { type: string, enum: [DIRECTIONS, CLAIM, TEXTURE, CAUTION] }
        text: { type: string }
        snapshotId: { type: integer }
        sourceUrl: { type: string, format: uri }
        checkedAt: { type: string, format: date-time }
    ProductDetail:
      allOf:
        - { $ref: '#/components/schemas/ProductSummary' }
        - type: object
          required: [facts]
          properties: { facts: { type: array, items: { $ref: '#/components/schemas/ProductFact' } } }
    MyProduct:
      type: object
      required: [id, registeredAt, experienceCount, inCurrentRoutine]
      properties:
        id: { type: integer }
        product: { anyOf: [ { $ref: '#/components/schemas/ProductSummary' }, { type: 'null' } ] }
        enteredName: { type: [string, 'null'] }
        registeredAt: { type: string, format: date-time }
        experienceCount: { type: integer, minimum: 0 }
        inCurrentRoutine: { type: boolean }
    MyProductDetail:
      allOf:
        - { $ref: '#/components/schemas/MyProduct' }
        - type: object
          required: [recentExperiences]
          properties: { recentExperiences: { type: array, items: { $ref: '#/components/schemas/ExperienceRecord' } } }
    RoutineFrequency:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [DAILY, DAYS_PER_WEEK, AS_NEEDED, CUSTOM] }
        daysPerWeek: { type: [integer, 'null'], minimum: 1, maximum: 6 }
        displayText: { type: [string, 'null'], maxLength: 100 }
    RoutineItem:
      type: object
      required: [myProductId, period, position, frequency]
      properties:
        myProductId: { type: integer }
        period: { type: string, enum: [MORNING, EVENING] }
        position: { type: integer, minimum: 1 }
        frequency: { $ref: '#/components/schemas/RoutineFrequency' }
    RoutineWrite:
      type: object
      required: [items]
      properties:
        expectedCurrentRoutineId: { type: [integer, 'null'] }
        sourceType: { type: string, enum: [USER_EDIT, RESCUE_PLAN], default: USER_EDIT }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RoutineItem' } }
    Routine:
      type: object
      required: [id, versionNo, status, startedLocalDate, dayNumber, items]
      properties:
        id: { type: integer }
        versionNo: { type: integer, minimum: 1 }
        status: { type: string, enum: [ACTIVE, SUPERSEDED, CANCELLED] }
        startedLocalDate: { type: string, format: date }
        dayNumber: { type: integer, minimum: 1 }
        reviewDueAt: { type: [string, 'null'], format: date-time }
        isComparisonBaseline: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/RoutineItem' } }
    ExperienceWrite:
      type: object
      required: [sourceType, sentiment, discomfort, adherence]
      anyOf:
        - { required: [routineId] }
        - { required: [myProductId] }
      properties:
        routineId: { type: [integer, 'null'] }
        myProductId: { type: [integer, 'null'] }
        reviewScheduleId: { type: [integer, 'null'] }
        sourceType: { type: string, enum: [IN_USE, DAY_7_REVIEW, PRODUCT_NOTE, RESCUE] }
        sentiment: { type: string, enum: [LIKED, DISAPPOINTED, UNSURE] }
        discomfort: { type: string, enum: [NONE_REPORTED, REPORTED, UNKNOWN] }
        adherence: { type: string, enum: [MATCHED, PARTIAL, MISMATCHED, UNKNOWN] }
        originalText: { type: [string, 'null'], maxLength: 3000 }
        observationTags: { type: array, maxItems: 10, items: { type: string, maxLength: 50 } }
        confirmAsComparisonBaseline: { type: boolean, default: false }
    ExperienceObservation:
      type: object
      required: [key, text, sourceSpan, polarity]
      properties:
        key: { type: string }
        text: { type: string }
        sourceSpan: { type: string }
        polarity: { type: string, enum: [POSITIVE, NEGATIVE, NEUTRAL, UNKNOWN] }
    ExperienceRecord:
      allOf:
        - { $ref: '#/components/schemas/ExperienceWrite' }
        - type: object
          required: [id, recordedAt, observations, aiStatus]
          properties:
            id: { type: integer }
            recordedAt: { type: string, format: date-time }
            observations: { type: array, items: { $ref: '#/components/schemas/ExperienceObservation' } }
            aiStatus: { type: string, enum: [NOT_REQUESTED, QUEUED, RUNNING, SUCCEEDED, FAILED] }
    ExperiencePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExperienceRecord' } }
        nextCursor: { type: [string, 'null'] }
    ExperienceReviewState:
      type: object
      required: [scheduleId, routine, dueAt, due]
      properties:
        scheduleId: { type: integer }
        routine: { $ref: '#/components/schemas/Routine' }
        dueAt: { type: string, format: date-time }
        due: { type: boolean }
        completedExperienceId: { type: [integer, 'null'] }
    PatternEvidence:
      type: object
      required: [experienceId, relation, excerpt, recordedAt]
      properties:
        experienceId: { type: integer }
        relation: { type: string, enum: [SUPPORT, OPPOSE, UNCERTAIN] }
        excerpt: { type: string }
        productName: { type: [string, 'null'] }
        recordedAt: { type: string, format: date-time }
    PersonalPattern:
      type: object
      required: [id, revisionNo, status, statement, supportingCount, opposingCount]
      properties:
        id: { type: integer }
        revisionNo: { type: integer, minimum: 1 }
        status: { type: string, enum: [CANDIDATE, ACTIVE, SUPERSEDED, REJECTED] }
        statement: { type: string }
        uncertainty: { type: [string, 'null'] }
        supportingCount: { type: integer, minimum: 0 }
        opposingCount: { type: integer, minimum: 0 }
    PersonalPatternDetail:
      allOf:
        - { $ref: '#/components/schemas/PersonalPattern' }
        - type: object
          required: [evidence]
          properties: { evidence: { type: array, minItems: 2, items: { $ref: '#/components/schemas/PatternEvidence' } } }
    ExplorationWrite:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        productVersionId: { type: [integer, 'null'] }
    Exploration:
      type: object
      required: [id, summary, similarities, differences, watchPoints, uncertainties, evidence, conversationId, disclaimer]
      properties:
        id: { type: integer }
        summary: { type: string }
        similarities: { type: array, items: { type: string } }
        differences: { type: array, items: { type: string } }
        watchPoints: { type: array, items: { type: string } }
        uncertainties: { type: array, items: { type: string } }
        evidence: { type: array, items: { $ref: '#/components/schemas/PatternEvidence' } }
        conversationId: { type: integer }
        disclaimer: { type: string }
    ConversationWrite:
      type: object
      required: [kind, initialText]
      properties:
        kind: { type: string, enum: [GENERAL, PRODUCT_EXPLORATION, PATTERN, RESCUE] }
        initialText: { type: string, minLength: 1, maxLength: 3000 }
        subjectType: { type: [string, 'null'], enum: [PRODUCT, EXPERIENCE, PATTERN, ROUTINE, null] }
        subjectId: { type: [integer, 'null'] }
    ConversationMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: integer }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        suggestedReplies: { type: array, maxItems: 3, items: { type: string } }
        createdAt: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, kind, messages]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [GENERAL, PRODUCT_EXPLORATION, PATTERN, RESCUE] }
        messages: { type: array, items: { $ref: '#/components/schemas/ConversationMessage' } }
    RescuePlan:
      type: object
      required: [id, versionNo, status, baseRoutineId, ranking, proposedRoutine]
      properties:
        id: { type: integer }
        versionNo: { type: integer, minimum: 1 }
        status: { type: string, enum: [GENERATED, VALIDATED, CONFIRMED, APPLIED, STALE, REJECTED] }
        baseRoutineId: { type: integer }
        ranking:
          type: array
          maxItems: 3
          items:
            type: object
            required: [rank, label, support, opposition, uncertainty]
            properties:
              rank: { type: integer, minimum: 1, maximum: 3 }
              label: { type: string }
              support: { type: array, items: { type: string } }
              opposition: { type: array, items: { type: string } }
              uncertainty: { type: array, items: { type: string } }
        proposedRoutine: { $ref: '#/components/schemas/RoutineWrite' }
    Rescue:
      type: object
      required: [id, status, conversationId, safetyBoundaryReached]
      properties:
        id: { type: integer }
        status: { type: string, enum: [CONVERSATION, ANALYZING, READY, CLOSED] }
        conversationId: { type: integer }
        sourceExperienceId: { type: [integer, 'null'] }
        safetyBoundaryReached: { type: boolean }
        plan: { anyOf: [ { $ref: '#/components/schemas/RescuePlan' }, { type: 'null' } ] }
    Home:
      type: object
      required: [currentExperience, newPatterns, quickActions]
      properties:
        currentExperience: { anyOf: [ { $ref: '#/components/schemas/Routine' }, { type: 'null' } ] }
        newPatterns: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/PersonalPattern' } }
        quickActions: { type: array, items: { type: string, enum: [RECORD_EXPERIENCE, EXPLORE_PRODUCT, START_ROUTINE] } }
    JobAccepted:
      type: object
      required: [jobId, status]
      properties: { jobId: { type: integer }, status: { type: string, const: QUEUED } }
    AiJob:
      type: object
      required: [id, type, status]
      properties:
        id: { type: integer }
        type: { type: string, enum: [EXPERIENCE_EXTRACTION, PATTERN_DISCOVERY, PRODUCT_EXPLORATION, RESCUE, ACCOUNT_DELETE] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        errorCode: { type: [string, 'null'] }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: [string, 'null'] }
