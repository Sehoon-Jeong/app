openapi: 3.1.0
info:
  title: SkinCause API
  version: 3.0.0
  description: |
    제품 카탈로그, 내 화장품, 제품 의견·추천, 버전 루틴, 7일 결과와 AI Rescue 계약이다.
    AI 결과는 제안이며 서버가 실제 제품·사용자 기록·상태 전이를 검증한다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: Auth, description: 계정과 세션 }
  - { name: Profile, description: 온보딩과 AI 기억 }
  - { name: Catalog, description: 국내 제품 카탈로그 }
  - { name: MyProducts, description: 내 화장품과 찜 }
  - { name: Receipts, description: 영수증 OCR 등록 }
  - { name: Decisions, description: 제품 의견과 추천 }
  - { name: Routines, description: 현재·안정 루틴과 버전 }
  - { name: Assessments, description: 7일·조기 결과 }
  - { name: Rescue, description: 불편 대화와 다음 루틴 }
  - { name: Jobs, description: 비동기 AI 작업 }
  - { name: Notifications, description: 앱 안 알림 }

paths:
  /auth/sign-up:
    post:
      tags: [Auth]
      summary: 가입한다
      operationId: signUp
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '201': { description: 가입됨, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인한다
      operationId: login
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '200': { description: 로그인됨, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: [Profile]
      summary: 내 계정과 온보딩 상태를 본다
      operationId: getMe
      responses:
        '200': { description: 내 계정, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: 시간대와 온보딩 답을 고친다
      operationId: updateMe
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } } }
      responses:
        '200': { description: 수정됨, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Profile]
      summary: 계정과 연결 데이터를 영구 삭제한다
      operationId: deleteMe
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties: { confirmation: { type: string, const: DELETE } }
      responses:
        '202': { description: 삭제 시작, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/ai-memories:
    get:
      tags: [Profile]
      summary: AI가 기억하는 자연어 맥락을 본다
      operationId: listAiMemories
      responses:
        '200': { description: 기억 목록, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AiMemory' } } } } }
    post:
      tags: [Profile]
      summary: AI 기억을 직접 추가한다
      operationId: createAiMemory
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AiMemoryWrite' } } } }
      responses:
        '201': { description: 추가됨, content: { application/json: { schema: { $ref: '#/components/schemas/AiMemory' } } } }
  /me/ai-memories/{memoryId}:
    parameters: [ { $ref: '#/components/parameters/MemoryId' } ]
    patch:
      tags: [Profile]
      summary: AI 기억을 고친다
      operationId: updateAiMemory
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AiMemoryWrite' } } } }
      responses:
        '200': { description: 수정됨, content: { application/json: { schema: { $ref: '#/components/schemas/AiMemory' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Profile]
      summary: AI 기억을 삭제한다
      operationId: deleteAiMemory
      responses:
        '204': { description: 삭제됨 }
        '404': { $ref: '#/components/responses/NotFound' }

  /products:
    get:
      tags: [Catalog]
      summary: 국내 제품 버전을 제목으로 검색한다
      operationId: searchProducts
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        '200': { description: 검색 결과, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } } } } }
  /products/{productVersionId}:
    get:
      tags: [Catalog]
      summary: 제품 버전과 확인된 사실을 본다
      operationId: getProduct
      parameters: [ { $ref: '#/components/parameters/ProductVersionId' } ]
      responses:
        '200': { description: 제품 상세, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productVersionId}/similar:
    get:
      tags: [Catalog]
      summary: 비슷한 제품을 최대 5개 본다
      operationId: listSimilarProducts
      parameters: [ { $ref: '#/components/parameters/ProductVersionId' } ]
      responses:
        '200': { description: 비슷한 제품, content: { application/json: { schema: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/SimilarProduct' } } } } }
  /catalog-review-requests:
    post:
      tags: [Catalog]
      summary: 검색되지 않거나 버전이 불확실한 제품 검수를 요청한다
      operationId: requestCatalogReview
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [query], properties: { query: { type: string }, purchaseDate: { type: string, format: date }, volumeOption: { type: string }, packageImageObjectKey: { type: string } } } } }
      responses:
        '202':
          description: 접수됨
          content:
            application/json:
              schema:
                type: object
                required: [requestId, status]
                properties:
                  requestId: { type: integer }
                  status: { type: string, const: RECEIVED }

  /me/products:
    get:
      tags: [MyProducts]
      summary: 미사용·현재 루틴·안정 루틴 기준 내 화장품을 본다
      operationId: listMyProducts
      responses:
        '200': { description: 내 화장품, content: { application/json: { schema: { $ref: '#/components/schemas/MyProductGroups' } } } }
    post:
      tags: [MyProducts]
      summary: 제품을 미사용 화장품으로 추가한다
      operationId: createMyProduct
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { productVersionId: { type: integer }, enteredName: { type: string } }, anyOf: [ { required: [productVersionId] }, { required: [enteredName] } ] } } }
      responses:
        '201': { description: 추가됨, content: { application/json: { schema: { $ref: '#/components/schemas/MyProduct' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/products/{myProductId}:
    parameters: [ { $ref: '#/components/parameters/MyProductId' } ]
    get:
      tags: [MyProducts]
      summary: 제품별 정보·메모·연결 루틴을 본다
      operationId: getMyProduct
      responses:
        '200': { description: 내 제품 상세, content: { application/json: { schema: { $ref: '#/components/schemas/MyProductDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [MyProducts]
      summary: 내 화장품에서 제품을 삭제한다
      operationId: deleteMyProduct
      responses:
        '204': { description: 삭제됨 }
        '409': { description: 현재 루틴에 있어 먼저 루틴 편집 필요, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /me/products/{myProductId}/memo:
    put:
      tags: [MyProducts]
      summary: 제품 메모를 저장한다
      operationId: putProductMemo
      parameters: [ { $ref: '#/components/parameters/MyProductId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 1000 } } } } } }
      responses:
        '200': { description: 저장됨, content: { application/json: { schema: { type: object, required: [text, updatedAt], properties: { text: { type: string }, updatedAt: { type: string, format: date-time } } } } } }
  /me/wishlist:
    get:
      tags: [MyProducts]
      summary: 찜한 제품을 본다
      operationId: listWishlist
      responses:
        '200': { description: 찜 목록, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } } } } }
    post:
      tags: [MyProducts]
      summary: 제품을 찜한다
      operationId: addWishlist
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [productVersionId], properties: { productVersionId: { type: integer } } } } } }
      responses:
        '201': { description: 찜함 }
        '409': { $ref: '#/components/responses/Conflict' }

  /receipts:
    post:
      tags: [Receipts]
      summary: 영수증 원본을 올리고 OCR을 시작한다
      operationId: createReceipt
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties: { image: { type: string, format: binary } }
      responses:
        '202': { description: OCR 시작, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/JobAccepted' }, { type: object, required: [receiptId], properties: { receiptId: { type: integer } } } ] } } } }
  /receipts/{receiptId}:
    get:
      tags: [Receipts]
      summary: OCR 후보와 확인 상태를 본다
      operationId: getReceipt
      parameters: [ { $ref: '#/components/parameters/ReceiptId' } ]
      responses:
        '200': { description: OCR 결과, content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /receipts/{receiptId}/confirm:
    post:
      tags: [Receipts]
      summary: 확인한 영수증 제품을 모두 미사용 화장품으로 넣는다
      operationId: confirmReceipt
      parameters: [ { $ref: '#/components/parameters/ReceiptId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, required: [receiptItemId, include], properties: { receiptItemId: { type: integer }, include: { type: boolean }, productVersionId: { type: integer } } } } } } } } }
      responses:
        '201': { description: 등록됨, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MyProduct' } } } } }

  /product-opinions:
    post:
      tags: [Decisions]
      summary: 한 제품의 구매 의견 조사를 시작한다
      operationId: createProductOpinion
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [productVersionId], properties: { productVersionId: { type: integer }, goalText: { type: string }, includeMemo: { type: boolean, default: false } } } } } }
      responses:
        '202': { description: 조사 시작, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
  /product-opinions/{opinionId}:
    get:
      tags: [Decisions]
      summary: 제품 의견과 근거를 본다
      operationId: getProductOpinion
      parameters: [ { name: opinionId, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: 제품 의견, content: { application/json: { schema: { $ref: '#/components/schemas/ProductOpinion' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /recommendations:
    post:
      tags: [Decisions]
      summary: 자연어 조건으로 제품 추천 조사를 시작한다
      operationId: createRecommendation
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [requestText], properties: { requestText: { type: string, minLength: 2 }, confirmedContext: { type: array, items: { type: string } } } } } } }
      responses:
        '202': { description: 조사 또는 추가 질문 시작, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
  /recommendations/{recommendationId}:
    get:
      tags: [Decisions]
      summary: 추가 질문 또는 최대 5개 추천 결과를 본다
      operationId: getRecommendation
      parameters: [ { name: recommendationId, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: 추천, content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
  /conversations/{conversationId}/messages:
    post:
      tags: [Decisions]
      summary: 제품 의견·추천의 후속 질문을 이어간다
      operationId: createConversationMessage
      parameters: [ { name: conversationId, in: path, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string }, remember: { type: boolean, default: false } } } } } }
      responses:
        '202': { description: 답변 생성 중, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }

  /me/routines/current:
    get:
      tags: [Routines]
      summary: 현재 루틴과 7일 상태를 본다
      operationId: getCurrentRoutine
      responses:
        '200': { description: 현재 루틴, content: { application/json: { schema: { $ref: '#/components/schemas/Routine' } } } }
        '404': { description: 아직 루틴 없음, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /me/routines:
    post:
      tags: [Routines]
      summary: 새 현재 루틴 버전과 7일 일정을 만든다
      operationId: createRoutine
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoutineWrite' } } } }
      responses:
        '202': { description: 루틴 저장·AI 분석 시작, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/JobAccepted' }, { type: object, required: [routineId], properties: { routineId: { type: integer } } } ] } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /me/routines/history:
    get:
      tags: [Routines]
      summary: 루틴 버전 이력을 본다
      operationId: listRoutineHistory
      responses:
        '200': { description: 루틴 이력, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoutineSummary' } } } } }
  /me/routines/{routineId}:
    get:
      tags: [Routines]
      summary: 과거 루틴 버전과 결과를 본다
      operationId: getRoutine
      parameters: [ { $ref: '#/components/parameters/RoutineId' } ]
      responses:
        '200': { description: 루틴 상세, content: { application/json: { schema: { $ref: '#/components/schemas/Routine' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/routines/compare:
    get:
      tags: [Routines]
      summary: 두 루틴 버전의 제품·순서·빈도를 비교한다
      operationId: compareRoutines
      parameters:
        - { name: from, in: query, required: true, schema: { type: integer } }
        - { name: to, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: 변경 목록, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoutineChange' } } } } }
  /routine-order-proposals:
    post:
      tags: [Routines]
      summary: 편집 중인 루틴의 AI 순서·빈도 제안을 시작한다
      operationId: createRoutineOrderProposal
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoutineWrite' } } } }
      responses:
        '202': { description: 제안 생성 중, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }

  /me/routines/{routineId}/assessment:
    get:
      tags: [Assessments]
      summary: 7일 결과 질문 상태를 본다
      operationId: getRoutineAssessment
      parameters: [ { $ref: '#/components/parameters/RoutineId' } ]
      responses:
        '200': { description: 결과 질문 상태, content: { application/json: { schema: { $ref: '#/components/schemas/Assessment' } } } }
    post:
      tags: [Assessments]
      summary: 7일 또는 조기 결과를 남긴다
      operationId: createRoutineAssessment
      parameters: [ { $ref: '#/components/parameters/RoutineId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentWrite' } } } }
      responses:
        '201': { description: 저장됨, content: { application/json: { schema: { $ref: '#/components/schemas/Assessment' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /rescues:
    post:
      tags: [Rescue]
      summary: 현재 기록을 연결해 Rescue 대화를 시작한다
      operationId: createRescue
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string, minLength: 1 }, routineId: { type: integer } } } } } }
      responses:
        '201': { description: 대화 시작, content: { application/json: { schema: { $ref: '#/components/schemas/Rescue' } } } }
  /rescues/{rescueId}:
    get:
      tags: [Rescue]
      summary: 전체 Rescue 대화와 현재 제안을 본다
      operationId: getRescue
      parameters: [ { $ref: '#/components/parameters/RescueId' } ]
      responses:
        '200': { description: Rescue, content: { application/json: { schema: { $ref: '#/components/schemas/Rescue' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rescues/{rescueId}/messages:
    post:
      tags: [Rescue]
      summary: Rescue 대화를 아래로 이어간다
      operationId: createRescueMessage
      parameters: [ { $ref: '#/components/parameters/RescueId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string }, structuredAnswer: { type: object, additionalProperties: true } } } } } }
      responses:
        '202': { description: 답변·분석 생성 중, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
  /rescues/{rescueId}/apply:
    post:
      tags: [Rescue]
      summary: 제안 루틴을 적용하거나 기록만 남긴다
      operationId: applyRescue
      parameters: [ { $ref: '#/components/parameters/RescueId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [CREATE_ROUTINE, RECORD_ONLY] }
                editedRoutine: { $ref: '#/components/schemas/RoutineWrite' }
      responses:
        '201': { description: 적용됨, content: { application/json: { schema: { $ref: '#/components/schemas/RescueApplyResult' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /ai-jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: 비동기 AI 작업 상태와 결과 참조를 본다
      operationId: getAiJob
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses:
        '200': { description: 작업 상태, content: { application/json: { schema: { $ref: '#/components/schemas/AiJob' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-jobs/{jobId}/retry:
    post:
      tags: [Jobs]
      summary: 실패한 AI 작업을 같은 입력으로 다시 실행한다
      operationId: retryAiJob
      parameters: [ { $ref: '#/components/parameters/JobId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { description: 재시도 시작, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /notifications:
    get:
      tags: [Notifications]
      summary: 앱 안 알림을 본다
      operationId: listNotifications
      responses:
        '200': { description: 알림, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } }
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: 알림을 읽음 처리한다
      operationId: readNotification
      parameters: [ { name: notificationId, in: path, required: true, schema: { type: integer } } ]
      responses:
        '204': { description: 읽음 }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
    MemoryId: { name: memoryId, in: path, required: true, schema: { type: integer } }
    ProductVersionId: { name: productVersionId, in: path, required: true, schema: { type: integer } }
    MyProductId: { name: myProductId, in: path, required: true, schema: { type: integer } }
    ReceiptId: { name: receiptId, in: path, required: true, schema: { type: integer } }
    RoutineId: { name: routineId, in: path, required: true, schema: { type: integer } }
    RescueId: { name: rescueId, in: path, required: true, schema: { type: integer } }
    JobId: { name: jobId, in: path, required: true, schema: { type: integer } }
  responses:
    Unauthorized: { description: 인증 필요, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: 없거나 접근 권한 없음, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: 현재 상태와 충돌, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Validation: { description: 입력 검증 실패, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, minLength: 8 } }
    AuthSession:
      type: object
      required: [accessToken, user]
      properties: { accessToken: { type: string }, user: { $ref: '#/components/schemas/Profile' } }
    Profile:
      type: object
      required: [id, email, timezone, onboardingComplete]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        timezone: { type: string, example: Asia/Seoul }
        onboardingComplete: { type: boolean }
        currentRoutineId: { type: [integer, 'null'] }
        stableRoutineId: { type: [integer, 'null'] }
    ProfileUpdate:
      type: object
      properties:
        timezone: { type: string }
        onboardingAnswers: { type: object, additionalProperties: { type: string } }
        onboardingComplete: { type: boolean }
    AiMemory:
      allOf:
        - { $ref: '#/components/schemas/AiMemoryWrite' }
        - { type: object, required: [id, source, updatedAt], properties: { id: { type: integer }, source: { type: string, enum: [ONBOARDING, CONVERSATION, USER_EDIT] }, updatedAt: { type: string, format: date-time } } }
    AiMemoryWrite:
      type: object
      required: [text]
      properties: { text: { type: string, minLength: 1, maxLength: 1000 } }
    ProductSummary:
      type: object
      required: [productVersionId, brand, name, category, versionStatus]
      properties:
        productVersionId: { type: integer }
        brand: { type: string }
        name: { type: string }
        category: { type: string, enum: [SKINCARE, CLEANSING, SUNCARE] }
        volumeOption: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'], format: uri }
        versionStatus: { type: string, enum: [VERIFIED, UNCERTAIN, RETIRED] }
    Source:
      type: object
      required: [type, title, organization, url, checkedAt]
      properties:
        type: { type: string, enum: [BRAND, REGULATOR, OFFICIAL_DB, PAPER, PERSONAL_RECORD] }
        title: { type: string }
        organization: { type: string }
        publishedAt: { type: [string, 'null'], format: date }
        url: { type: [string, 'null'], format: uri }
        checkedAt: { type: string, format: date-time }
    ProductDetail:
      allOf:
        - { $ref: '#/components/schemas/ProductSummary' }
        - type: object
          required: [facts, ingredientLabel, sources, referenceOffers]
          properties:
            facts: { type: array, items: { type: object, required: [type, text, sourceIndex], properties: { type: { type: string, enum: [DIRECTIONS, CLAIM, TEXTURE, CAUTION] }, text: { type: string }, sourceIndex: { type: integer } } } }
            ingredientLabel: { type: array, items: { type: string } }
            sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
            referenceOffers: { type: array, items: { type: object, required: [retailer, priceKrw, checkedAt], properties: { retailer: { type: string }, priceKrw: { type: integer }, url: { type: string, format: uri }, checkedAt: { type: string, format: date-time }, usedForDecision: { type: boolean, const: false } } } }
    SimilarProduct:
      allOf:
        - { $ref: '#/components/schemas/ProductSummary' }
        - { type: object, required: [reason, owned], properties: { reason: { type: string }, owned: { type: boolean } } }
    MyProduct:
      type: object
      required: [id, state, versionStatus, registeredAt]
      properties:
        id: { type: integer }
        product: { anyOf: [ { $ref: '#/components/schemas/ProductSummary' }, { type: 'null' } ] }
        enteredName: { type: [string, 'null'] }
        state: { type: string, enum: [UNUSED, IN_CURRENT_ROUTINE, ONLY_IN_STABLE_ROUTINE] }
        versionStatus: { type: string, enum: [VERIFIED, UNCERTAIN] }
        registeredAt: { type: string, format: date-time }
    MyProductDetail:
      allOf:
        - { $ref: '#/components/schemas/MyProduct' }
        - { type: object, properties: { memo: { type: [string, 'null'] }, routineHistory: { type: array, items: { $ref: '#/components/schemas/RoutineSummary' } }, latestAnalysisId: { type: [integer, 'null'] } } }
    MyProductGroups:
      type: object
      required: [unused, currentRoutine, lastStableRoutine]
      properties:
        unused: { type: array, items: { $ref: '#/components/schemas/MyProduct' } }
        currentRoutine: { type: array, items: { $ref: '#/components/schemas/MyProduct' } }
        lastStableRoutine: { type: array, items: { $ref: '#/components/schemas/MyProduct' } }
    Receipt:
      type: object
      required: [id, status, originalRetained, items]
      properties:
        id: { type: integer }
        status: { type: string, enum: [QUEUED, RUNNING, NEEDS_CONFIRMATION, CONFIRMED, FAILED] }
        originalRetained: { type: boolean, const: true }
        items: { type: array, items: { type: object, required: [id, rawText, candidates], properties: { id: { type: integer }, rawText: { type: string }, candidates: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } } } } }
    EvidenceItem:
      type: object
      required: [relation, statement, source]
      properties:
        relation: { type: string, enum: [SUPPORT, OPPOSE, UNCERTAIN] }
        statement: { type: string }
        source: { $ref: '#/components/schemas/Source' }
    ProductOpinion:
      type: object
      required: [id, product, conclusion, conclusionLabel, evidence, uncertainties, conversationId, disclaimer]
      properties:
        id: { type: integer }
        product: { $ref: '#/components/schemas/ProductSummary' }
        conclusion: { type: string, enum: [CONSIDER, OVERLAP, LOW_RELEVANCE, INSUFFICIENT] }
        conclusionLabel: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceItem' } }
        uncertainties: { type: array, items: { type: string } }
        routineChange: { type: [string, 'null'] }
        conversationId: { type: integer }
        disclaimer: { type: string }
    Recommendation:
      type: object
      required: [id, state, candidates]
      properties:
        id: { type: integer }
        state: { type: string, enum: [NEEDS_CONTEXT, READY] }
        question: { type: [string, 'null'] }
        candidates: { type: array, maxItems: 5, items: { type: object, required: [rank, product, reason, evidence], properties: { rank: { type: integer }, product: { $ref: '#/components/schemas/ProductSummary' }, reason: { type: string }, hesitation: { type: [string, 'null'] }, evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceItem' } } } } }
    RoutineItem:
      type: object
      required: [myProductId, period, position]
      properties:
        myProductId: { type: integer }
        period: { type: string, enum: [MORNING, EVENING] }
        position: { type: integer, minimum: 1 }
        frequencyText: { type: [string, 'null'], maxLength: 100 }
        aiNote: { type: [string, 'null'] }
    RoutineWrite:
      type: object
      required: [items]
      properties:
        expectedCurrentRoutineId: { type: [integer, 'null'] }
        sourceType: { type: string, enum: [USER_EDIT, RESCUE_PLAN], default: USER_EDIT }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RoutineItem' } }
    RoutineSummary:
      type: object
      required: [id, versionNo, sourceType, startedLocalDate, assessmentDueAt, isCurrent]
      properties:
        id: { type: integer }
        versionNo: { type: integer }
        sourceType: { type: string, enum: [USER_EDIT, RESCUE_PLAN] }
        startedLocalDate: { type: string, format: date }
        assessmentDueAt: { type: string, format: date-time }
        isCurrent: { type: boolean }
        isStable: { type: boolean }
        outcome: { type: [string, 'null'], enum: [NO_DISCOMFORT, DISCOMFORT, NEED_MORE_TIME, UNKNOWN, null] }
    Routine:
      allOf:
        - { $ref: '#/components/schemas/RoutineSummary' }
        - { type: object, required: [items, dayNumber, aiAnalysisStatus], properties: { items: { type: array, items: { $ref: '#/components/schemas/RoutineItem' } }, dayNumber: { type: integer, minimum: 1 }, aiAnalysisStatus: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }, rescueRecordWithoutChange: { type: boolean } } }
    RoutineChange:
      type: object
      required: [type, description]
      properties: { type: { type: string, enum: [PRODUCT_ADDED, PRODUCT_REMOVED, ORDER_CHANGED, FREQUENCY_CHANGED, PERIOD_CHANGED] }, myProductId: { type: [integer, 'null'] }, description: { type: string } }
    AssessmentWrite:
      type: object
      required: [kind, outcome]
      properties:
        kind: { type: string, enum: [FINAL, EARLY] }
        actualUseMatched: { type: [boolean, 'null'] }
        outcome: { type: string, enum: [NO_DISCOMFORT, DISCOMFORT, NEED_MORE_TIME, UNKNOWN] }
        responseText: { type: [string, 'null'] }
        extendDays: { type: [integer, 'null'], const: 7 }
    Assessment:
      allOf:
        - { $ref: '#/components/schemas/AssessmentWrite' }
        - { type: object, required: [id, routineId, assessedAt, promotedToStable], properties: { id: { type: integer }, routineId: { type: integer }, assessedAt: { type: string, format: date-time }, promotedToStable: { type: boolean }, nextDueAt: { type: [string, 'null'], format: date-time } } }
    RescueMessage:
      type: object
      required: [id, role, content, createdAt]
      properties: { id: { type: integer }, role: { type: string, enum: [USER, ASSISTANT] }, content: { type: string }, choices: { type: array, items: { type: object, required: [value, label], properties: { value: { type: string }, label: { type: string } } } }, createdAt: { type: string, format: date-time } }
    RescuePlan:
      type: object
      required: [ranking, routine, basisStrength]
      properties:
        ranking: { type: array, items: { type: object, required: [rank, label, support, opposition, uncertainty], properties: { rank: { type: integer }, myProductId: { type: [integer, 'null'] }, label: { type: string }, support: { type: array, items: { $ref: '#/components/schemas/EvidenceItem' } }, opposition: { type: array, items: { $ref: '#/components/schemas/EvidenceItem' } }, uncertainty: { type: array, items: { type: string } } } } }
        routine: { $ref: '#/components/schemas/RoutineWrite' }
        basisStrength: { type: string, enum: [NORMAL, WEAK_NO_STABLE_ROUTINE, NONE_NO_ROUTINE] }
    Rescue:
      type: object
      required: [id, status, messages, changes, safetyBoundaryReached]
      properties:
        id: { type: integer }
        status: { type: string, enum: [CONVERSATION, ANALYZING, READY, CLOSED] }
        startRoutineId: { type: [integer, 'null'] }
        stableRoutineId: { type: [integer, 'null'] }
        messages: { type: array, items: { $ref: '#/components/schemas/RescueMessage' } }
        changes: { type: array, items: { $ref: '#/components/schemas/RoutineChange' } }
        plan: { anyOf: [ { $ref: '#/components/schemas/RescuePlan' }, { type: 'null' } ] }
        safetyBoundaryReached: { type: boolean }
    RescueApplyResult:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [CREATE_ROUTINE, RECORD_ONLY] }
        routineId: { type: [integer, 'null'] }
        assessmentDueAt: { type: [string, 'null'], format: date-time }
        rescueRecordWithoutChange: { type: boolean }
    JobAccepted:
      type: object
      required: [jobId, status]
      properties: { jobId: { type: integer }, status: { type: string, enum: [QUEUED, RUNNING] } }
    AiJob:
      type: object
      required: [id, type, status, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [RECEIPT_OCR, PRODUCT_OPINION, RECOMMENDATION, PRODUCT_RESEARCH, ROUTINE_ANALYSIS, ROUTINE_ORDER, RESCUE] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        resultType: { type: [string, 'null'] }
        resultId: { type: [integer, 'null'] }
        errorCode: { type: [string, 'null'] }
        retryable: { type: boolean }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    Notification:
      type: object
      required: [id, type, title, targetType, targetId, dueAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [ASSESSMENT_DUE, EXTENDED_ASSESSMENT_DUE, AI_JOB_SUCCEEDED, AI_JOB_FAILED] }
        title: { type: string }
        body: { type: string }
        targetType: { type: string }
        targetId: { type: integer }
        dueAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string, examples: [ROUTINE_VERSION_CONFLICT] }
        detail: { type: string }
        fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
