openapi: 3.1.0
info:
  title: SkinCause MVP API
  version: 1.0.0
  summary: 안정 루틴을 기준으로 한 제품 추천·실험·관찰 API
  description: |
    SkinCause P0·P1 웹과 Spring Boot 서버 사이의 계약이다.
    서버의 일반 규칙이 제품 자격·하드 제약·루틴 차이·실험 상태와 Rescue 분류를 결정한다.
    추천에서는 AI가 서버가 허용한 실제 productVersionId 집합 안에서 목적·개인 이력에 따른 순위와 설명 초안을 제안하고, 서버가 검증하며 실패 시 규칙 기반 결과로 대체한다.
    그 밖의 AI 작업은 이미지·자유 입력 구조화와 계산된 사실 설명이며, 제품 ID·Rescue 분류·권한·상태를 만들거나 바꾸지 않는다.
    모든 개인 리소스는 JWT의 사용자 소유권을 확인한다. 다른 사용자의 리소스는 존재 여부를 감추기 위해 404로 응답한다.
  contact:
    name: SkinCause team
    url: https://github.com/sksksksksksss/service
  license:
    name: Unlicensed
    identifier: LicenseRef-Unlicensed
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /api/v1
    description: 현재 호스트의 API
tags:
  - name: Auth
    description: 이메일·비밀번호 인증과 JWT 세션
  - name: Profile
    description: 내 프로필, 피부 고민과 계정 삭제
  - name: Routines
    description: 사용자가 확인하는 안정 루틴과 불변 버전
  - name: Products
    description: 카탈로그 검색과 개인 제품
  - name: Imports
    description: 전성분·구매 이미지와 AI 구조화 초안
  - name: Recommendations
    description: 현재 안정 루틴과 목적에 따른 실제 제품 후보
  - name: Candidates
    description: 추천·검색에서 보관한 실험 후보와 비교
  - name: Experiments
    description: 한 제품 실험 계획과 상태 전이
  - name: Observations
    description: 필요한 시점의 퀘스트와 실제 관찰
  - name: Rescue
    description: 불편 발생 시 변경점 복원과 규칙 기반 분류
  - name: Archive
    description: 원본 실험 이력과 개인 근거 조회
  - name: Lab
    description: 실험 완료에 연결된 진행도·연구 기록·보상
  - name: Notifications
    description: 선택적인 브라우저 푸시 구독
security:
  - bearerAuth: []
paths:
  /auth/sign-up:
    post:
      security: []
      tags: [Auth]
      summary: 이메일과 비밀번호로 가입
      description: 계정을 만들고 바로 사용할 JWT를 발급한다. 이메일 존재 여부는 다른 인증 오류와 구분해 노출하지 않는다.
      operationId: signUp
      x-priority: P0
      x-github-issue: 45
      x-requirements: [FR-AUTH-001, NFR-SEC-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            examples:
              default:
                $ref: '#/components/examples/SignUpRequest'
      responses:
        '201':
          description: 가입과 인증 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                default:
                  $ref: '#/components/examples/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      security: []
      tags: [Auth]
      summary: 이메일과 비밀번호로 로그인
      description: 자격 증명을 확인하고 JWT를 발급한다. 실패 응답은 이메일 존재 여부를 드러내지 않는다.
      operationId: login
      x-priority: P0
      x-github-issue: 45
      x-requirements: [FR-AUTH-001, NFR-SEC-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: user@example.com
                  password: correct-horse-battery-staple
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                default:
                  $ref: '#/components/examples/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      security:
        - refreshCookie: []
      tags: [Auth]
      summary: 로그인 연장
      description: >-
        HttpOnly refresh cookie를 한 번만 사용해 새 access JWT와 refresh cookie를 발급한다.
        기존 refresh token은 즉시 폐기하며, 허용한 프론트엔드 Origin이 아닌 요청은 거부한다.
      operationId: refreshSession
      x-priority: P0
      x-github-issue: 45
      x-requirements: [FR-AUTH-001, NFR-SEC-001]
      responses:
        '200':
          description: 세션 연장과 refresh token 교체 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                default:
                  $ref: '#/components/examples/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      security:
        - bearerAuth: []
        - refreshCookie: []
      tags: [Auth]
      summary: 현재 로그인 종료
      description: >-
        access JWT 또는 refresh cookie가 가리키는 서버 세션을 폐기하고 refresh cookie를 지운다.
        같은 요청을 반복해도 완료로 처리하며 허용한 프론트엔드 Origin만 받는다.
      operationId: logout
      x-priority: P0
      x-github-issue: 45
      x-requirements: [FR-AUTH-001, NFR-SEC-001]
      responses:
        '204':
          description: 로그아웃 완료
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags: [Profile]
      summary: 내 프로필 조회
      description: JWT의 사용자 프로필과 초기 진입에 필요한 현재 안정 루틴·열린 실험 여부를 반환한다.
      operationId: getMyProfile
      x-priority: P0
      x-github-issue: 45
      x-requirements: [FR-AUTH-001, FR-AUTH-002, NFR-SEC-001]
      responses:
        '200':
          description: 내 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      summary: 내 시간대 수정
      description: 앞으로 생성할 퀘스트 표시와 계획 계산에 사용할 IANA 시간대를 바꾼다. 이미 확정된 절대 시각은 변경하지 않는다.
      operationId: updateMyProfile
      x-priority: P0
      x-github-issue: 45
      x-requirements: [FR-AUTH-002, FR-OBS-005, NFR-SEC-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 수정된 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Profile]
      summary: 계정과 SkinCause 기록 삭제 시작
      description: 현재 사용자만 대상으로 쓰기를 잠그고 파일·알림·개인 도메인·인증 정보 삭제를 시작한다. 공용 카탈로그는 삭제하지 않는다.
      operationId: deleteMyAccount
      x-priority: P0
      x-github-issue: 46
      x-requirements: [FR-AUTH-003, NFR-PRV-003, NFR-SEC-001]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '202':
          description: 삭제 작업 시작. 이 응답 뒤 현재 JWT는 사용할 수 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/concerns:
    get:
      tags: [Profile]
      summary: 내 피부 고민 조회
      description: 사용자가 직접 고른 통제 코드와 잘 모르겠음 상태를 조회한다. 질환이나 피부 타입 판정 결과가 아니다.
      operationId: getMyConcerns
      x-priority: P0
      x-github-issue: 7
      x-requirements: [FR-REC-001, NFR-SEC-001]
      responses:
        '200':
          description: 피부 고민 선택
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserConcerns'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Profile]
      summary: 내 피부 고민 저장
      description: 선택한 고민 코드 또는 잘 모르겠음을 저장한다. 두 상태는 동시에 저장할 수 없다.
      operationId: replaceMyConcerns
      x-priority: P0
      x-github-issue: 7
      x-requirements: [FR-REC-001, NFR-SEC-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceConcernsRequest'
      responses:
        '200':
          description: 저장된 피부 고민
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserConcerns'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /routines/current:
    get:
      tags: [Routines]
      summary: 현재 안정 루틴과 초안 조회
      description: 사용자가 직접 확정한 현재 안정 버전과 작성 중 초안을 함께 반환한다. 안정 버전이 없으면 null로 반환한다.
      operationId: getCurrentRoutine
      x-priority: P0
      x-github-issue: 7
      x-requirements: [FR-RTN-001, FR-RTN-002, FR-RTN-003, NFR-SEC-001]
      responses:
        '200':
          description: 현재 루틴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentRoutine'
              examples:
                default:
                  $ref: '#/components/examples/CurrentRoutine'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /routines/draft:
    put:
      tags: [Routines]
      summary: 안정 루틴 초안 저장
      description: 아침·저녁 제품과 순서를 초안으로 저장한다. 이 작업만으로 안정 루틴이 되거나 추천 기준으로 쓰이지 않는다.
      operationId: saveRoutineDraft
      x-priority: P0
      x-github-issue: 7
      x-requirements: [FR-RTN-001, FR-RTN-004, NFR-REL-001, NFR-SEC-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRoutineDraftRequest'
            examples:
              default:
                $ref: '#/components/examples/SaveRoutineDraftRequest'
      responses:
        '200':
          description: 저장된 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /routines/draft/confirm:
    post:
      tags: [Routines]
      summary: 초안을 현재 안정 루틴으로 확정
      description: 사용자의 명시적 확인을 기록하고 불변 루틴 버전을 현재 기준점으로 만든다. AI는 안정 여부를 판단하지 않는다.
      operationId: confirmRoutineDraft
      x-priority: P0
      x-github-issue: 7
      x-requirements: [FR-RTN-002, FR-RTN-003, FR-RTN-004, NFR-SEC-001]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRoutineRequest'
      responses:
        '201':
          description: 새로 확정된 안정 루틴 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /routine-versions/{routineVersionId}:
    get:
      tags: [Routines]
      summary: 특정 루틴 버전 조회
      description: 과거 실험·Rescue가 참조한 불변 루틴 버전을 조회한다. 다른 사용자의 버전은 404로 응답한다.
      operationId: getRoutineVersion
      x-priority: P0
      x-github-issue: 7
      x-requirements: [FR-RTN-003, NFR-SEC-001]
      parameters:
        - $ref: '#/components/parameters/RoutineVersionId'
      responses:
        '200':
          description: 루틴 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /products:
    get:
      tags: [Products]
      summary: 제품명·브랜드명으로 제품 검색
      description: 공용 카탈로그와 현재 사용자의 개인 제품을 부분 일치 검색한다. 다른 사용자의 개인 제품은 절대 반환하지 않는다.
      operationId: searchProducts
      x-priority: P0
      x-github-issue: 33
      x-requirements: [FR-PRD-001, FR-PRD-006, NFR-SEC-001]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: 제품명 또는 브랜드명
        - name: categoryCode
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 안정적으로 정렬된 제품 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products/by-barcode/{barcode}:
    get:
      tags: [Products]
      summary: 바코드 정확 일치 제품 찾기
      description: 운영 확인된 바코드와 정확히 일치하는 제품 하나만 반환한다. 유사값을 추측하지 않고, 미일치나 중복 데이터는 제품을 반환하지 않는다.
      operationId: findProductByBarcode
      x-priority: P1
      x-github-issue: 49
      x-requirements: [FR-PRD-004, FR-PRD-006, NFR-REL-001]
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
            minLength: 6
            maxLength: 32
      responses:
        '200':
          description: 정확히 일치하는 제품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /product-versions/{productVersionId}:
    get:
      tags: [Products]
      summary: 제품 버전 상세 조회
      description: 당시 이름·종류·성분·기능·출처와 확인 상태를 조회한다. 개인 제품은 소유자만 볼 수 있다.
      operationId: getProductVersion
      x-priority: P0
      x-github-issue: 33
      x-requirements: [FR-PRD-006, NFR-SEC-001]
      parameters:
        - $ref: '#/components/parameters/ProductVersionId'
      responses:
        '200':
          description: 제품 버전 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVersionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /personal-products:
    post:
      tags: [Products]
      summary: 개인 제품 초안 만들기
      description: 카탈로그에 없는 제품을 본인 전용 초안으로 만든다. 운영 확인 전 공용 검색과 자동 추천에는 쓰지 않는다.
      operationId: createPersonalProduct
      x-priority: P1
      x-github-issue: 10
      x-requirements: [FR-PRD-002, FR-PRD-006, NFR-REL-001, NFR-SEC-001]
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonalProductRequest'
      responses:
        '201':
          description: 생성된 개인 제품과 첫 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /personal-products/{productId}:
    patch:
      tags: [Products]
      summary: 개인 제품 초안 정보 수정
      description: 소유한 개인 제품에 새 제품 버전을 만들고 최신 포인터를 갱신한다. 과거 루틴과 실험이 참조한 버전은 바꾸지 않는다.
      operationId: updatePersonalProduct
      x-priority: P1
      x-github-issue: 10
      x-requirements: [FR-PRD-002, FR-PRD-006, NFR-REL-001, NFR-SEC-001]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonalProductRequest'
      responses:
        '200':
