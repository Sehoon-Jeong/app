components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 로그인 응답으로 받은 Spring Security JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: >-
        로그인 유지에만 쓰는 회전형 HttpOnly·Secure cookie. 원문은 서버에 저장하지 않고
        cookie 인증 엔드포인트는 허용한 Origin만 받는다.
  headers:
    SetRefreshCookie:
      description: >-
        회전형 refresh token. HttpOnly, Secure, Path=/api/v1/auth, SameSite=None 속성을 사용한다.
      schema:
        type: string
        example: refresh_token=opaque-token; Path=/api/v1/auth; Max-Age=604800; HttpOnly; Secure; SameSite=None
    ClearRefreshCookie:
      description: refresh cookie를 즉시 만료한다.
      schema:
        type: string
        example: refresh_token=; Path=/api/v1/auth; Max-Age=0; HttpOnly; Secure; SameSite=None
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 사용자 안에서 한 작업을 유일하게 식별하는 UUID. 같은 키·같은 요청은 최초 응답을 재사용한다.
      schema:
        type: string
        format: uuid
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 중복 클릭 방지용 UUID. 전달한 경우 동일 키에 동일 의미를 적용한다.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 nextCursor. 내부 정렬 키로 해석하지 않는다.
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductVersionId:
      name: productVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoutineVersionId:
      name: routineVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadAssetId:
      name: uploadAssetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AiJobId:
      name: aiJobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestId:
      name: questId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ObservationId:
      name: observationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RescueCaseId:
      name: rescueCaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 요청 JSON, 쿼리 또는 헤더 형식이 잘못됨
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/BadRequestProblem'
    Unauthorized:
      description: access JWT 또는 필요한 refresh session이 없거나 만료·폐기됨
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              value:
                type: https://skincause.app/problems/authentication-required
                title: 로그인이 필요합니다.
                status: 401
                code: AUTHENTICATION_REQUIRED
                detail: 다시 로그인한 뒤 이어서 진행해 주세요.
                fieldErrors: []
                traceId: 01J5QY8M7C
    NotFound:
      description: 리소스가 없거나 현재 사용자 소유가 아님. 소유권 실패도 같은 응답을 사용한다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              value:
                type: https://skincause.app/problems/resource-not-found
                title: 기록을 찾을 수 없습니다.
                status: 404
                code: RESOURCE_NOT_FOUND
                detail: 삭제됐거나 접근할 수 없는 기록입니다.
                fieldErrors: []
                traceId: 01J5QY8M7C
    Conflict:
      description: 현재 도메인 상태 또는 중복 요청과 충돌함
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            activeExperiment:
              value:
                type: https://skincause.app/problems/active-experiment-exists
                title: 진행 중인 실험이 있습니다.
                status: 409
                code: ACTIVE_EXPERIMENT_EXISTS
                detail: 진행 중인 실험을 먼저 완료하거나 취소해 주세요.
                fieldErrors: []
                traceId: 01J5QY8M7C
            idempotencyConflict:
              value:
                type: https://skincause.app/problems/idempotency-key-reused
                title: 요청 식별자가 이미 사용됐습니다.
                status: 409
                code: IDEMPOTENCY_KEY_REUSED
                detail: 새 작업이라면 새로운 Idempotency-Key로 다시 요청해 주세요.
                fieldErrors: []
                traceId: 01J5QY8M7C
    ValidationFailed:
      description: 필수값·열거형·도메인 조합 검증 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              value:
                type: https://skincause.app/problems/validation-failed
                title: 입력을 다시 확인해 주세요.
                status: 422
                code: VALIDATION_FAILED
                detail: 수정할 항목이 있습니다.
                fieldErrors:
                  - field: durationDays
                    code: DURATION_OUT_OF_RANGE
                    message: 실험 기간은 7일에서 28일 사이여야 합니다.
                traceId: 01J5QY8M7C
    Locked:
      description: 계정 삭제가 시작되어 새 쓰기가 잠김
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              value:
                type: https://skincause.app/problems/account-write-locked
                title: 계정 삭제가 진행 중입니다.
                status: 423
                code: ACCOUNT_WRITE_LOCKED
                detail: 새로운 기록을 저장할 수 없습니다.
                fieldErrors: []
                traceId: 01J5QY8M7C
    PayloadTooLarge:
      description: 허용한 이미지 크기를 초과함
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              value:
                type: https://skincause.app/problems/payload-too-large
                title: 이미지가 너무 큽니다.
                status: 413
                code: IMAGE_TOO_LARGE
                detail: 10MB 이하 JPG, PNG 또는 WEBP 이미지를 사용해 주세요.
                fieldErrors: []
                traceId: 01J5QY8M7C
