<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SKN — 나의 스킨케어 경험을 연결하다</title>
<style>
:root{
  --bg:#edf0ed;--paper:#fff;--soft:#f5f6f3;--soft2:#ecefe9;--ink:#151714;--sub:#62685f;--muted:#92988f;
  --line:#e3e6e0;--dark:#20251f;--green:#55705b;--green2:#dce7dc;--lime:#dbe9a8;--amber:#f1e2b9;
  --red:#a7514d;--red2:#f5e4e1;--blue:#526b82;--blue2:#e4ebf1;--radius:22px;--radius2:14px;
  --shadow:0 12px 36px rgba(25,32,23,.08);--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.48;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}h1,h2,h3,p{margin:0}.hide{display:none!important}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:26px;background:radial-gradient(circle at 18% 10%,#f8faf4 0,transparent 34%),var(--bg)}
.guide{width:310px;max-height:90vh;overflow:auto}.brand{display:flex;align-items:center;gap:12px}.mark{width:43px;height:43px;border-radius:15px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:850;letter-spacing:-.08em}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}.guide>p{font-size:14px;color:var(--sub);margin:17px 0 20px}.guide h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:18px 0 8px}.jump{display:flex;flex-wrap:wrap;gap:7px}.jump button{padding:7px 10px;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:10px;font-size:11.5px}.jump button:hover{border-color:var(--green);color:var(--green)}
.phone{width:390px;height:820px;max-height:calc(100vh - 32px);padding:10px;border-radius:48px;background:#0f110f;box-shadow:0 35px 80px rgba(23,29,22,.28);flex:none}.screen{height:100%;border-radius:40px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column;position:relative}.status{height:43px;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 25px;font-size:12px;font-weight:750;flex:none}.app{flex:1;min-height:0;display:flex;flex-direction:column}.bar{height:55px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;gap:10px;flex:none}.bar-title{flex:1}.bar-title b{font-size:16px;letter-spacing:-.03em}.bar-title small{display:block;color:var(--muted);font-size:10.5px}.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}.iconbtn:active{background:var(--soft2)}.logo{font-size:20px;font-weight:900;letter-spacing:-.09em}
.body{flex:1;overflow:auto;min-height:0;padding:16px 16px 28px;scrollbar-width:none}.body::-webkit-scrollbar{display:none}.body.chatbody{padding:0}.bottom{height:70px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px 9px;flex:none}.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--muted);border-radius:13px}.tab svg{width:21px;height:21px}.tab.on{color:var(--ink);font-weight:750}.tab.ai-tab svg{background:var(--dark);color:#fff;padding:5px;width:31px;height:31px;border-radius:11px}.tab.ai-tab{margin-top:-5px}
.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--muted);text-transform:uppercase}.hero{padding:7px 3px 17px}.hero h1{font-size:27px;line-height:1.25;letter-spacing:-.055em}.hero p{color:var(--sub);font-size:13px;margin-top:8px}.section{display:flex;align-items:center;margin:23px 2px 10px}.section h2{font-size:14px;letter-spacing:-.025em}.section button,.section span{margin-left:auto;color:var(--sub);font-size:11.5px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 5px rgba(20,25,19,.02)}.pad{padding:16px}.tap:active{transform:scale(.985)}.stack{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}.muted{color:var(--muted)}.sub{color:var(--sub)}.tiny{font-size:11.5px}.mt{margin-top:12px}.mt2{margin-top:20px}.divider{height:1px;background:var(--line);margin:14px 0}
.lab-card{background:var(--dark);color:#fff;padding:18px;border-radius:27px;position:relative;overflow:hidden}.lab-card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;border:1px solid rgba(255,255,255,.1);right:-65px;top:-75px;box-shadow:0 0 0 28px rgba(255,255,255,.035)}.lab-top{display:flex;justify-content:space-between;position:relative;z-index:1}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:10.5px;font-weight:750;background:var(--soft2);color:var(--sub)}.pill.light{background:rgba(255,255,255,.12);color:#fff}.pill.green{background:var(--green2);color:#405747}.pill.red{background:var(--red2);color:var(--red)}.pill.amber{background:var(--amber);color:#66521e}.lab-card h2{font-size:22px;line-height:1.25;letter-spacing:-.04em;margin:18px 0 7px;position:relative;z-index:1}.lab-card p{font-size:12px;color:rgba(255,255,255,.7);position:relative;z-index:1}.progress{height:5px;background:rgba(255,255,255,.13);border-radius:99px;margin:18px 0 10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--lime);border-radius:99px;width:57%}.lab-actions{display:flex;gap:8px;position:relative;z-index:1}.lab-actions button{flex:1;padding:11px 9px;border-radius:13px;background:#fff;color:var(--ink);font-weight:750;font-size:12px}.lab-actions button.secondary{background:rgba(255,255,255,.1);color:#fff}
.pattern{padding:16px;background:linear-gradient(150deg,#f8faf4,var(--paper))}.pattern .quote{font-size:17px;font-weight:760;line-height:1.45;letter-spacing:-.035em;margin:11px 0}.evidence{display:flex;gap:6px;flex-wrap:wrap}.evidence span{font-size:10.5px;color:var(--sub);background:var(--soft2);border-radius:8px;padding:5px 8px}.pattern-foot{display:flex;align-items:center;margin-top:13px;font-size:11px;color:var(--muted)}.pattern-foot b{color:var(--green);margin-left:auto}
.quick-record{display:flex;gap:10px;align-items:center;padding:14px 15px}.qicon{width:42px;height:42px;border-radius:15px;background:var(--green2);display:grid;place-items:center;color:var(--green)}.quick-record b{font-size:13.5px}.quick-record small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.search{display:flex;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0 13px;box-shadow:var(--shadow)}.search input{border:0;outline:0;background:none;flex:1;padding:14px 9px;font-size:14px}.search button{background:var(--dark);color:#fff;padding:8px 11px;border-radius:10px;font-size:11px;font-weight:700}.promptbox{background:var(--dark);color:#fff;border-radius:26px;padding:19px}.promptbox h1{font-size:23px;line-height:1.25;letter-spacing:-.045em}.promptbox p{font-size:12px;color:rgba(255,255,255,.67);margin:8px 0 17px}.promptbox .search{box-shadow:none;border:0}.discover-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.discovery{padding:14px;min-height:150px}.bottle{width:54px;height:65px;border-radius:14px 14px 18px 18px;background:linear-gradient(155deg,#f4f5ee,#dce4db);border:1px solid #d9ded6;display:grid;place-items:center;font-size:9px;color:var(--green);font-weight:800}.discovery b{display:block;font-size:13px;line-height:1.35;margin-top:10px}.discovery small{font-size:10.5px;color:var(--muted)}
.product-head{text-align:center;padding:7px 12px 21px}.product-head .bottle{width:82px;height:105px;margin:4px auto 14px}.product-head h1{font-size:22px;letter-spacing:-.045em}.product-head p{font-size:12px;color:var(--muted);margin-top:3px}.verdict{padding:17px}.verdict h2{font-size:18px;letter-spacing:-.03em;margin:10px 0 7px}.verdict p{font-size:12.5px;color:var(--sub)}.reason{display:flex;gap:11px;padding:13px 0;border-top:1px solid var(--line)}.reason:first-child{border-top:0}.num{width:25px;height:25px;border-radius:9px;background:var(--soft2);display:grid;place-items:center;font-size:10px;font-weight:800}.reason b{font-size:12.5px}.reason p{font-size:11px;color:var(--muted);margin-top:2px}.source{padding:12px 14px;background:var(--soft);border-radius:13px;font-size:10.5px;color:var(--sub)}
.btn{width:100%;height:49px;border-radius:15px;background:var(--dark);color:#fff;font-weight:750;font-size:14px;display:flex;justify-content:center;align-items:center;gap:7px}.btn.secondary{background:var(--green2);color:#38503e}.btn.ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}.btn.small{height:39px;font-size:12px;width:auto;padding:0 14px}.btnrow{display:flex;gap:8px}.btnrow .btn{flex:1}
.btn[disabled]{opacity:.38;pointer-events:none}
.product-row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--paper);border:1px solid var(--line);border-radius:16px}.thumb{width:42px;height:48px;border-radius:10px 10px 13px 13px;background:linear-gradient(145deg,#f3f3ed,#dfe4dc);display:grid;place-items:center;font-size:7px;color:var(--green);font-weight:850;flex:none}.product-row b{display:block;font-size:13px}.product-row small{display:block;color:var(--muted);font-size:10.5px}.product-row .tail{margin-left:auto}.groups{display:flex;gap:7px;overflow:auto;margin:0 -16px;padding:0 16px 2px}.groups::-webkit-scrollbar{display:none}.chip{white-space:nowrap;padding:7px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:11px}.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.routine{padding:15px}.routine-head{display:flex;justify-content:space-between;align-items:start}.routine h3{font-size:15px}.steps{margin-top:13px}.step{display:flex;gap:10px;position:relative;padding-bottom:12px}.step:not(:last-child):before{content:"";position:absolute;left:12px;top:25px;bottom:0;width:1px;background:var(--line)}.step i{width:25px;height:25px;border-radius:9px;background:var(--soft2);display:grid;place-items:center;font-size:9px;font-style:normal;font-weight:800;z-index:1}.step b{font-size:12px}.step small{display:block;font-size:10px;color:var(--muted)}
.record-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mood{padding:15px 7px;background:var(--paper);border:1px solid var(--line);border-radius:18px;text-align:center}.mood span{font-size:26px;display:block}.mood b{font-size:11.5px;display:block;margin-top:6px}.mood.on{background:var(--green2);border-color:var(--green)}.mood.bad.on{background:var(--red2);border-color:var(--red)}
.field label{display:block;font-size:12px;font-weight:750;margin:0 2px 7px}.textarea{width:100%;min-height:100px;resize:none;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;outline:none}.textarea:focus{border-color:var(--green)}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:7px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:11px}.tag.on{background:var(--green2);border-color:var(--green)}
.saved{text-align:center;padding:28px 20px}.check{width:62px;height:62px;border-radius:24px;background:var(--green2);color:var(--green);display:grid;place-items:center;margin:auto}.saved h1{font-size:23px;letter-spacing:-.04em;margin:17px 0 8px}.saved p{font-size:12.5px;color:var(--sub)}
.timeline{border-left:1px solid var(--line);margin-left:7px;padding-left:17px}.event{position:relative;padding-bottom:19px}.event:before{content:"";width:9px;height:9px;border:3px solid var(--soft);background:var(--green);border-radius:50%;position:absolute;left:-23px;top:3px}.event time{font-size:10px;color:var(--muted)}.event b{display:block;font-size:13px;margin:2px 0}.event p{font-size:11.5px;color:var(--sub)}
.chat{height:100%;display:flex;flex-direction:column;background:var(--paper)}.messages{flex:1;overflow:auto;padding:17px 14px 12px;scrollbar-width:none}.messages::-webkit-scrollbar{display:none}.msg{display:flex;margin:10px 0;gap:8px;align-items:flex-end}.msg.user{justify-content:flex-end}.avatar{width:30px;height:30px;border-radius:11px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:850;flex:none}.bubble{max-width:83%;padding:11px 13px;border-radius:17px 17px 17px 5px;background:var(--soft);font-size:12.5px;line-height:1.55}.user .bubble{background:var(--dark);color:#fff;border-radius:17px 17px 5px 17px}.bubble b{font-size:13px}.bubble .cite{display:block;margin-top:8px;color:var(--muted);font-size:10px}.chat-card{margin:8px 0 10px 38px;padding:14px;background:#f7f8f5;border:1px solid var(--line);border-radius:16px}.chat-card h3{font-size:13px}.chat-card p{font-size:11px;color:var(--sub);margin-top:4px}.rank{display:flex;gap:8px;margin-top:10px}.rank strong{width:24px;height:24px;border-radius:8px;background:var(--amber);display:grid;place-items:center;font-size:10px}.suggestions{display:flex;gap:6px;overflow:auto;padding:8px 12px 4px;background:var(--paper)}.suggestions::-webkit-scrollbar{display:none}.suggestions button{white-space:nowrap;padding:7px 10px;background:var(--soft);border:1px solid var(--line);border-radius:999px;font-size:10.5px}.composer{display:flex;gap:8px;padding:8px 12px 13px;background:var(--paper)}.composer textarea{height:44px;max-height:88px;resize:none;flex:1;border:1px solid var(--line);border-radius:15px;padding:11px 12px;outline:none}.send{width:44px;height:44px;border-radius:15px;background:var(--dark);color:#fff;display:grid;place-items:center}
.empty{padding:35px 20px;text-align:center}.empty h2{font-size:18px}.empty p{font-size:12px;color:var(--muted);margin:7px 0 16px}.toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,20px);background:#171a17;color:#fff;border-radius:12px;padding:10px 14px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none;position:absolute;inset:0;background:rgba(12,15,12,.38);z-index:20;align-items:flex-end}.scrim.on{display:flex}.sheet{width:100%;background:var(--paper);border-radius:27px 27px 0 0;padding:19px 16px 20px;max-height:76%;overflow:auto}.sheet h2{font-size:18px}.sheet>p{font-size:12px;color:var(--sub);margin:5px 0 16px}.menu{display:flex;flex-direction:column;gap:8px}.menu button{display:flex;align-items:center;text-align:left;padding:14px;background:var(--soft);border-radius:14px}.menu button b{font-size:12.5px}.menu button small{display:block;color:var(--muted);font-size:10.5px}.menu button span:last-child{margin-left:auto}.close{margin-top:12px}
@media(max-width:860px){.stage{padding:0}.guide{display:none}.phone{width:100%;height:100dvh;max-height:none;padding:0;border-radius:0}.screen{border-radius:0}}
</style>
</head>
<body>
<main class="stage">
  <aside class="guide">
    <div class="brand"><div class="mark">SKN</div><div><b>SKN</b><small>나의 스킨케어 경험을 연결하다</small></div></div>
    <p>코덕이 써본 제품의 사용감·조합·변화·피부 반응을 남기고, 흩어진 경험에서 자기만의 패턴을 발견하는 프로토타입입니다.</p>
    <h3>주요 화면</h3><div class="jump" id="jump"></div>
    <h3>상황 확인</h3><div class="jump" id="scenarios"></div>
  </aside>
  <div class="phone"><div class="screen">
    <div class="status"><span>9:41</span><span>••• 84%</span></div>
    <div id="app" class="app"></div><div class="toast" id="toast"></div>
    <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
  </div></div>
</main>
<script>
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={home:'<path d="M3 11 12 4l9 7v9H5v-9"/><path d="M9 20v-6h6v6"/>',search:'<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>',lab:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 15h8"/>',chat:'<path d="M4 5h16v11H9l-5 4V5Z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',back:'<path d="m15 18-6-6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="m9 18 6-6-6-6"/>',send:'<path d="m4 4 17 8-17 8 3-8-3-8Z"/><path d="M7 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',spark:'<path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3Z"/>'};
function I(n){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[n]||icons.spark}</svg>`}
const products={aqua:{name:'아쿠아 하이드라 세럼',brand:'뉴트리랩',type:'세럼'},pan:{name:'판테놀 리페어 세럼',brand:'바이옴',type:'세럼'},cream:{name:'세라마이드 배리어 크림',brand:'더마리브',type:'크림'},sun:{name:'에어리 데일리 선크림',brand:'솔라핏',type:'선케어'},toner:{name:'H2 하이드라 토너',brand:'어퀴즈',type:'토너'},clean:{name:'마일드 젤클렌저',brand:'뉴트리랩',type:'클렌징'},ample:{name:'모이스처 부스트 앰플',brand:'데이지코',type:'앰플'},cica:{name:'시카 카밍 수딩젤',brand:'더마리브',type:'젤'}};
const state={route:'home',stack:[],day:4,reviewStep:0,mood:null,tags:[],recordText:'',saved:false,changed:false,chatMode:'general',chat:[],rescueStep:0,patterns:3,experienceOpen:true};
const tabs=[['home','home','홈'],['discover','search','탐색'],['lab','lab','경험'],['ai','chat','AI'],['me','user','나']];
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),1700)}
function nav(r,push=true){const top=['home','discover','lab','ai','me'];if(top.includes(r))state.stack=[];else if(push&&state.route!==r)state.stack.push(state.route);state.route=r;render()}
function back(){state.route=state.stack.pop()||'home';render()}
function chrome(title,sub,body,tab){return `<div class="bar">${state.stack.length?`<button class="iconbtn" data-act="back">${I('back')}</button>`:`<span class="logo">SKN</span>`}<div class="bar-title"><b>${title||''}</b>${sub?`<small>${sub}</small>`:''}</div>${tab==='home'?`<button class="iconbtn" data-act="quick">${I('plus')}</button>`:''}</div><div class="body ${tab==='ai'?'chatbody':''}">${body}</div>${bottom(tab)}`}
function bottom(active){return `<nav class="bottom">${tabs.map(([r,ic,l])=>`<button class="tab ${active===r?'on':''} ${r==='ai'?'ai-tab':''}" data-nav="${r}">${I(ic)}<span>${l}</span></button>`).join('')}</nav>`}
function home(){return chrome('','','<div class="hero"><div class="eyebrow">MY SKINCARE, CONNECTED</div><h1>써본 만큼,<br>나를 더 잘 알게 돼요.</h1><p>지금의 경험을 남기면 지난 기록과 연결해드려요.</p></div>'+currentExperience()+`<div class="section"><h2>새로 발견한 내 패턴</h2><button data-nav="patterns">모두 보기</button></div>${patternCard()}<div class="section"><h2>바로 기록하기</h2></div><button class="card quick-record tap" data-act="quick"><span class="qicon">${I('plus')}</span><span class="grow"><b>지금 떠오른 사용 경험</b><small>제품 하나만 골라도 바로 남길 수 있어요</small></span>${I('arrow')}</button><div class="section"><h2>다음 탐색</h2></div><button class="card quick-record tap" data-act="askProduct"><span class="qicon" style="background:var(--blue2);color:var(--blue)">${I('spark')}</span><span class="grow"><b>궁금한 제품, 내 기록과 비교하기</b><small>이미 써본 제품·사용감·조합을 함께 봐요</small></span>${I('arrow')}</button>`,'home')}

function patternCard(){return `<button class="card pattern tap" data-nav="pattern"><div class="row"><span class="pill green">AI가 연결한 패턴</span><span class="tiny muted" style="margin-left:auto">근거 4개</span></div><div class="quote">“가벼운 수분 세럼을 아침에 썼을 때 만족도가 높았어요.”</div><div class="evidence"><span>밀림 없음 2회</span><span>산뜻함 3회</span><span>재사용 2회</span></div><div class="pattern-foot"><span>서로 다른 제품 3개에서 반복</span><b>근거 보기 ›</b></div></button>`}
function discover(){return chrome('탐색','내 기록에서 시작하는 제품 탐색',`<div class="promptbox"><div class="eyebrow" style="color:rgba(255,255,255,.52)">ASK SKN</div><h1>궁금한 화장품을<br>가져오세요.</h1><p>좋다·나쁘다를 단정하지 않고, 내 과거 경험과 비교해 볼 점을 찾아요.</p><div class="search"><input id="productQuery" placeholder="브랜드나 제품명"><button data-act="searchProduct">비교</button></div></div><div class="section"><h2>내 기록으로 다시 볼 제품</h2></div><div class="discover-grid"><button class="card discovery tap" data-nav="product"><div class="bottle">AQUA</div><b>아쿠아 하이드라 세럼</b><small>가벼운 세럼 기록과 비교</small></button><button class="card discovery tap" data-act="recommend"><div class="bottle" style="background:linear-gradient(145deg,#f5eee5,#e8d9c8)">NEW</div><b>내 패턴에서 다음 제품 찾기</b><small>새 후보 3개</small></button></div><div class="section"><h2>요즘 내가 자주 보는 기준</h2></div><div class="groups"><button class="chip on">밀림 없는 조합</button><button class="chip">가벼운 보습</button><button class="chip">향이 약한 제품</button><button class="chip">저녁 레이어링</button></div>`,'discover')}
function product(){return chrome('제품 살펴보기','확인된 제품 정보 + 내 경험',`<div class="product-head"><div class="bottle">AQUA</div><h1>아쿠아 하이드라 세럼</h1><p>뉴트리랩 · 세럼 · 30ml · 2026.03 버전</p></div><section class="card verdict"><div class="row"><span class="pill green">내 경험과 비교</span><span class="tiny muted" style="margin-left:auto">AI 정리</span></div><h2>지금은 비교해볼 이유가 있어요</h2><p>내가 만족했던 가벼운 수분 세럼 경험과 닮았어요. 다만 지금 쓰는 판테놀 세럼과 역할이 일부 겹치고, 이 제품을 직접 써본 기록은 없어요.</p><div class="divider"></div><div class="reason"><span class="num">1</span><div><b>닮은 경험</b><p>워터리 세럼 3개에서 산뜻함을 좋게 기록했어요.</p></div></div><div class="reason"><span class="num">2</span><div><b>지금 조합에서 볼 점</b><p>저녁 세럼 단계가 두 개에서 세 개로 늘어나요.</p></div></div><div class="reason"><span class="num">?</span><div><b>아직 모르는 점</b><p>직접 경험과 향 관련 공식 정보가 없어요.</p></div></div><div class="source">제품 사실 3개 · 내 경험 기록 4개 · 불확실성 2개를 연결한 설명</div></section><div class="btnrow mt"><button class="btn" data-act="addProduct">내 화장품에 추가</button><button class="btn secondary" data-act="askAbout">AI에게 더 묻기</button></div>`,'discover')}
function lab(){return chrome('사용 경험','제품을 써본 조건과 결과',`${currentExperience()}<div class="section"><h2>현재 루틴</h2><button data-act="editRoutine">편집</button></div>${routineCard('아침',['clean','toner','pan','cream','sun'])}<div class="mt">${routineCard('저녁',['clean','aqua','ample','pan','cream'])}</div><div class="section"><h2>비교 기준</h2></div><button class="card quick-record tap" data-nav="baseline"><span class="qicon">${I('lab')}</span><span class="grow"><b>마지막으로 문제없던 루틴</b><small>7월 22일 · 아침 5개 · 저녁 4개</small></span>${I('arrow')}</button><div class="section"><h2>지난 경험</h2><button data-nav="history">전체 보기</button></div><div class="timeline"><div class="event"><time>7월 31일</time><b>세럼 2개를 함께 추가</b><p>현재 사용 중 · DAY ${state.day}</p></div><div class="event"><time>7월 22일</time><b>루틴 전체가 무난했음</b><p>비교 기준으로 저장</p></div></div>`,'lab')}
function routineCard(label,keys){return `<section class="card routine"><div class="routine-head"><div><span class="eyebrow">${label}</span><h3>${keys.length}개 제품</h3></div><span class="pill">순서 저장됨</span></div><div class="steps">${keys.map((k,i)=>`<div class="step"><i>${i+1}</i><div><b>${products[k].name}</b><small>${products[k].type} · ${i===0?'매일':'실제 빈도 저장'}</small></div></div>`).join('')}</div></section>`}
function review(){if(state.saved)return savedReview();if(state.reviewStep===0)return chrome('경험 돌아보기','평가가 아니라 기억을 남기는 시간',`<div class="hero"><div class="eyebrow">DAY ${state.day} REFLECTION</div><h1>이번 루틴은<br>전반적으로 어땠나요?</h1><p>문제가 없었는지만 묻지 않아요. 좋았던 점과 아쉬웠던 점 모두 다음 탐색의 근거가 됩니다.</p></div><div class="record-choice"><button class="mood ${state.mood==='good'?'on':''}" data-mood="good"><span>◡</span><b>마음에 들었어요</b></button><button class="mood bad ${state.mood==='bad'?'on':''}" data-mood="bad"><span>△</span><b>아쉬웠어요</b></button><button class="mood ${state.mood==='unsure'?'on':''}" data-mood="unsure"><span>· ·</span><b>아직 모르겠어요</b></button></div><button class="btn mt2" data-act="reviewNext" ${state.mood?'':'disabled'}>다음</button>`,'lab');return chrome('경험 돌아보기','내 말이 원본으로 저장돼요',`<div class="hero"><div class="eyebrow">ONE MORE THING</div><h1>무엇이 가장<br>기억에 남았나요?</h1><p>정답처럼 쓰지 않아도 돼요. AI는 내가 말한 범위에서만 경험을 정리합니다.</p></div><div class="field"><label>빠르게 고르기 · 여러 개 가능</label><div class="tags">${['촉촉했음','흡수가 빨랐음','화장이 안 밀림','조금 답답했음','따가움·붉어짐','향이 아쉬움'].map(t=>`<button class="tag ${state.tags.includes(t)?'on':''}" data-tag="${t}">${t}</button>`).join('')}</div></div><div class="field mt2"><label>내 말로 남기기</label><textarea class="textarea" id="recordText" placeholder="예: 아침엔 가볍고 좋았는데 저녁에 세럼을 겹치면 조금 답답했어요.">${esc(state.recordText)}</textarea></div><div class="source mt">선택한 제품·당시 루틴·사용 시점과 함께 저장합니다. 피부 원인이나 제품 적합성으로 자동 확정하지 않아요.</div><button class="btn mt2" data-act="saveReview">경험 저장</button>`,'lab')}
function savedReview(){const discomfort=state.tags.includes('따가움·붉어짐');return chrome('기록 완료','이 경험은 다음 탐색에서 다시 쓰여요',`<div class="card saved"><div class="check">${I('check')}</div><h1>한 번의 경험이<br>내 기록에 연결됐어요.</h1><p>${state.mood==='good'?'마음에 들었던 이유':state.mood==='bad'?'아쉬웠던 이유':'아직 판단하기 어려운 점'}를 원문과 함께 저장했습니다.</p></div><div class="section"><h2>AI가 정리한 기록</h2></div><div class="card pad"><div class="row"><span class="pill green">사용 경험</span><span class="tiny muted" style="margin-left:auto">확인 전 요약</span></div><p class="mt tiny">${state.recordText||state.tags.join(' · ')||'전반적인 인상만 기록됨'}</p><div class="divider"></div><p class="tiny sub">이 기록은 아쿠아 세럼·모이스처 앰플, 저녁 루틴 v4와 연결됐어요.</p></div>${discomfort?`<button class="btn mt2" data-act="startRescue">불편함, AI와 이어서 정리하기</button>`:`<button class="btn mt2" data-nav="pattern">연결된 내 패턴 보기</button>`}<button class="btn ghost mt" data-act="finishReview">홈으로</button>`,'lab')}
function pattern(){return chrome('내 패턴','원본 기록으로 다시 확인할 수 있어요',`<div class="card pattern"><div class="row"><span class="pill green">반복된 경험 4개</span><span class="tiny muted" style="margin-left:auto">AI 연결</span></div><div class="quote">가벼운 수분 세럼을 아침에 썼을 때 만족도가 높았어요.</div><p class="tiny sub">이건 피부 타입이나 영구적인 취향 판정이 아니에요. 지금까지 남긴 기록에서 반복된 표현을 연결한 것입니다.</p></div><div class="section"><h2>이렇게 연결했어요</h2></div><div class="timeline"><div class="event"><time>7월 22일 · 판테놀 세럼</time><b>“화장 전에 밀리지 않아서 좋았음”</b><p>아침 · 선크림과 함께 사용</p></div><div class="event"><time>6월 18일 · 워터 젤 세럼</time><b>“흡수가 빠르고 산뜻함”</b><p>아침 · 만족</p></div><div class="event"><time>5월 03일 · 히알 세럼</time><b>“여름에 부담 없이 다시 쓸 듯”</b><p>아침 · 재사용 의향</p></div><div class="event"><time>4월 12일 · 리치 앰플</time><b>“화장 전에 조금 밀림”</b><p>반대 기록 · 아침</p></div></div><button class="btn secondary mt" data-act="askPattern">이 패턴에 대해 AI에게 묻기</button>`,'me')}
function patterns(){return chrome('내 패턴','반복된 경험에서 발견한 기준',`${patternCard()}<div class="card pattern mt"><div class="row"><span class="pill amber">아직 약한 패턴</span><span class="tiny muted" style="margin-left:auto">근거 2개</span></div><div class="quote">“세럼을 세 단계 겹치면 저녁에 답답하다고 느낄 수 있어요.”</div><div class="evidence"><span>답답함 2회</span><span>서로 다른 조합 2개</span></div></div><div class="card pattern mt"><div class="row"><span class="pill">관찰 중</span><span class="tiny muted" style="margin-left:auto">근거 1개</span></div><div class="quote">“향이 강한 제품은 손이 덜 갈 수 있어요.”</div><div class="evidence"><span>직접 표현 1회</span><span>더 많은 기록 필요</span></div></div>`,'me')}
function history(){return chrome('경험 기록','제품과 루틴을 함께 기억해요',`<div class="hero"><div class="eyebrow">12 CONNECTED RECORDS</div><h1>써본 제품보다<br>남은 경험을 봐요.</h1><p>각 기록은 당시 제품·조합·시간대와 연결돼 있습니다.</p></div><div class="timeline"><div class="event"><time>오늘</time><b>세럼 2개를 더한 저녁 루틴</b><p>사용 중 · DAY ${state.day}</p></div><div class="event"><time>7월 22일</time><b>판테놀 세럼 루틴 · 마음에 들었음</b><p>화장 전 밀림 없음 · 가벼움</p></div><div class="event"><time>6월 18일</time><b>워터 젤 세럼 · 마음에 들었음</b><p>흡수가 빠름 · 여름 아침</p></div><div class="event"><time>5월 03일</time><b>시카 수딩젤 · 아쉬웠음</b><p>따가움 기록 · AI로 변경점 확인</p></div></div>`,'me')}
function baseline(){return chrome('비교 기준 루틴','마지막으로 문제없다고 남긴 조합',`${routineCard('아침',['clean','toner','pan','cream','sun'])}<div class="mt">${routineCard('저녁',['clean','toner','pan','cream'])}</div><div class="source mt2">이 루틴은 Rescue에서 변경 전후를 비교하는 기준입니다. ‘완벽한 루틴’이나 각 제품의 적합 판정은 아닙니다.</div>`,'lab')}
function shelf(){return chrome('내 화장품','보유 제품과 연결된 경험',`<div class="hero"><div class="eyebrow">MY COLLECTION</div><h1>화장품 8개,<br>연결된 경험 12개</h1><p>제품을 모으는 데서 끝내지 않고 언제 어떻게 썼는지 함께 봅니다.</p></div><div class="groups"><button class="chip on">전체 8</button><button class="chip">현재 루틴 6</button><button class="chip">아직 안 써봄 2</button></div><div class="stack mt2">${['aqua','pan','cream','sun','ample','cica'].map(k=>`<button class="product-row tap" data-nav="product"><span class="thumb">SKN</span><span class="grow"><b>${products[k].name}</b><small>${products[k].brand} · ${products[k].type}</small></span><span class="tail pill">${k==='aqua'?'사용 중':k==='cica'?'경험 1':'경험 2'}</span></button>`).join('')}</div>`,'me')}
function me(){return chrome('나의 SKN','내 경험이 쌓이는 곳',`<div class="hero"><div class="eyebrow">MY SKINCARE DATA</div><h1>제품 8개를 쓰며<br>경험 12개를 남겼어요.</h1><p>AI가 발견한 패턴은 3개예요. 모든 판단은 원본 기록으로 돌아가 확인할 수 있습니다.</p></div><div class="stack"><button class="card quick-record tap" data-nav="shelf"><span class="qicon">${I('lab')}</span><span class="grow"><b>내 화장품</b><small>8개 · 현재 루틴 6개</small></span>${I('arrow')}</button><button class="card quick-record tap" data-nav="history"><span class="qicon">${I('check')}</span><span class="grow"><b>경험 기록</b><small>12개 · 제품과 루틴으로 연결</small></span>${I('arrow')}</button><button class="card quick-record tap" data-nav="patterns"><span class="qicon">${I('spark')}</span><span class="grow"><b>내 패턴</b><small>${state.patterns}개 · 원본 근거 확인 가능</small></span>${I('arrow')}</button></div><div class="source mt2">SKN은 피부를 진단하거나 고정된 피부 타입을 만들지 않습니다. 내가 남긴 경험을 연결하고, 근거와 불확실성을 함께 보여줍니다.</div>`,'me')}
function ai(){const msgs=state.chat.length?state.chat:[{role:'ai',html:'제품, 사용감, 조합, 지난 기록을 편하게 물어보세요. <b>내가 남긴 경험을 먼저 찾아</b> 답할게요.'}];const rescueSuggestions=state.rescueStep===1?['아니요, 심하지 않아요','빠르게 심해지고 있어요','잘 모르겠어요']:state.rescueStep===2?['네, 이게 전부예요','다른 변화도 있었어요','잘 모르겠어요']:state.rescueStep===3?['이 루틴으로 바꿀게요','다른 방법도 볼래요','기록만 남길게요']:['처음부터 다시 말할게요'];const suggestions=state.chatMode==='rescue'?rescueSuggestions:state.chatMode==='product'?['지금 세럼과 뭐가 달라?','아침에 쓰기 어때?','비슷하게 좋아했던 제품?']:['예전에 산뜻했던 세럼?','내가 답답해한 조합은?','새 세럼 골라줘'];return chrome('SKN AI',state.chatMode==='rescue'?'불편 기록을 이어서 확인 중':'내 경험을 찾고 연결하는 대화',`<div class="chat"><div class="messages" id="messages">${msgs.map(m=>m.role==='user'?`<div class="msg user"><div class="bubble">${m.html}</div></div>`:`<div class="msg"><div class="avatar">SKN</div><div class="bubble">${m.html}</div></div>${m.card||''}`).join('')}</div><div class="suggestions">${suggestions.slice(0,3).map(s=>`<button data-quick="${s}">${s}</button>`).join('')}</div><div class="composer"><textarea id="chatInput" placeholder="무엇이든 물어보세요"></textarea><button class="send" data-act="send">${I('send')}</button></div></div>`,'ai')}
function addAI(html,card=''){state.chat.push({role:'ai',html,card})}function addUser(t){state.chat.push({role:'user',html:esc(t)})}
function openAI(prompt,mode='general'){state.chatMode=mode;state.chat=[];addUser(prompt);if(mode==='product')addAI('아쿠아 하이드라 세럼을 <b>내가 좋아했던 가벼운 세럼 경험 3개</b>와 현재 저녁 루틴에 연결해 볼게요.',`<div class="chat-card"><h3>먼저 비교할 기록</h3><p>산뜻함 3회 · 밀림 없음 2회 · 세럼 중복 1개</p></div>`);else if(mode==='rescue'){state.rescueStep=1;addAI('불편했던 경험을 저장했어요. 진단하거나 범인을 정하지 않고, <b>문제없던 마지막 루틴 이후 바뀐 것</b>부터 확인할게요. 증상이 심하거나 빠르게 악화되고 있나요?');}else addAI('기록 12개에서 관련된 경험을 찾고 있어요. 질문에 따라 제품 정보가 필요하면 확인된 출처도 함께 볼게요.');nav('ai')}
function sendChat(text){const input=$('#chatInput');const t=(text||input?.value||'').trim();if(!t)return;addUser(t);if(state.chatMode==='rescue')rescueReply(t);else if(state.chatMode==='product')addAI('지금 판테놀 세럼과는 수분감이라는 표현이 겹치지만, 아쿠아 세럼은 더 가볍다고 표시된 제품 정보가 있어요. 다만 <b>직접 써본 내 기록은 아직 없어서</b> 실제 사용감은 확인이 필요해요.<span class="cite">제품 공식 정보 2 · 내 경험 4 · 정보 부족 1</span>');else addAI('내 기록에서 가장 가까운 경험은 <b>7월 22일 판테놀 세럼을 아침에 썼을 때</b>예요. “화장 전에 밀리지 않고 가벼웠다”고 남겼어요.<span class="cite">개인 경험 1건 · 원문 확인 가능</span>');render();setTimeout(()=>{const m=$('#messages');if(m)m.scrollTop=m.scrollHeight},0)}
function rescueReply(t){if(state.rescueStep===1){if(t.includes('심해지고')||t.includes('심해요')){state.rescueStep='safety';addAI('빠르게 심해지고 있다는 말이 있어 제품 확인 순위와 루틴 제안은 여기서 멈출게요. SKN은 응급도나 질환을 판단하지 않습니다. 제품 분석보다 전문가에게 상태를 직접 확인받아 주세요. 남긴 원문과 현재 루틴은 그대로 보존했어요.');return}state.rescueStep=2;addAI('알려줘서 고마워요. 지금 답변 범위에서는 제품 변경 기록을 이어서 볼게요. 마지막 비교 기준 이후 <b>아쿠아 세럼과 모이스처 앰플</b>이 저녁 루틴에 함께 추가됐어요. 다른 변화도 있었나요?',`<div class="chat-card"><h3>확인된 변경</h3><p>7월 31일 · 새 제품 2개 · 저녁 세럼 단계 1개 증가</p></div>`)}else if(state.rescueStep===2){state.rescueStep=3;addAI('현재 기록만 보면 두 제품을 함께 시작해 단독 원인은 구분할 수 없어요. 특정 제품을 범인으로 정하는 대신 <b>변경 시점과 기존 경험을 기준으로 확인 순서를 정리</b>했어요.',`<div class="chat-card"><h3>먼저 확인할 변경</h3><div class="rank"><strong>1</strong><p>모이스처 부스트 앰플<br><span class="muted">직접 경험 없음 · 최근 함께 추가</span></p></div><div class="rank"><strong>2</strong><p>아쿠아 하이드라 세럼<br><span class="muted">비슷한 제형의 문제없던 경험 3회</span></p></div></div>`);addAI('다음에는 <b>마지막 비교 기준 루틴에서 모이스처 앰플만 뺀 조합</b>을 제안해요. 적용할까요?',`<div class="chat-card"><h3>제안 루틴</h3><p>현재 루틴 − 모이스처 부스트 앰플<br>나머지 제품과 순서는 유지</p><button class="btn small mt" data-act="applyRescue">이 루틴으로 바꾸기</button></div>`)}else addAI('지금 말해준 내용도 같은 불편 기록에 추가했어요. 더 바뀐 제품이나 사용 방식이 있다면 이어서 말해주세요.')}
function openSheet(type){const s=$('#sheet');if(type==='quick')s.innerHTML=`<h2>무엇을 남길까요?</h2><p>기록은 짧게 시작하고 필요한 정보만 다음 화면에서 받습니다.</p><div class="menu"><button data-act="quickProduct"><div><b>제품 하나의 사용 경험</b><small>사용감이나 기억나는 점</small></div><span>›</span></button><button data-nav="review"><div><b>현재 루틴 돌아보기</b><small>함께 쓴 조합의 전반적인 경험</small></div><span>›</span></button><button data-act="startRescue"><div><b>불편함을 AI와 정리하기</b><small>최근 변경부터 이어서 확인</small></div><span>›</span></button></div><button class="btn ghost close" data-act="closeSheet">닫기</button>`;else s.innerHTML=`<h2>현재 루틴 편집</h2><p>제품·시간대·순서·빈도를 바꾸면 새 사용 경험으로 저장됩니다.</p><div class="menu"><button data-act="addStep"><div><b>제품 추가</b><small>내 화장품 또는 새 화장품</small></div><span>＋</span></button><button data-act="reorder"><div><b>순서 바꾸기</b><small>끌어서 배치하는 화면</small></div><span>›</span></button><button data-act="removeStep"><div><b>제품 빼기</b><small>과거 경험에서는 지우지 않음</small></div><span>›</span></button></div><button class="btn ghost close" data-act="closeSheet">닫기</button>`;$('#scrim').classList.add('on')}
function closeSheet(){$('#scrim').classList.remove('on')}
function render(){let out=state.route==='home'?home():state.route==='discover'?discover():state.route==='product'?product():state.route==='lab'?lab():state.route==='review'?review():state.route==='pattern'?pattern():state.route==='patterns'?patterns():state.route==='history'?history():state.route==='baseline'?baseline():state.route==='shelf'?shelf():state.route==='me'?me():ai();$('#app').innerHTML=out;const m=$('#messages');if(m)m.scrollTop=m.scrollHeight}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){closeSheet();nav(n.dataset.nav);return}const a=e.target.closest('[data-act]');if(a){const x=a.dataset.act;if(x==='back')back();else if(x==='quick')openSheet('quick');else if(x==='closeSheet')closeSheet();else if(x==='searchProduct')nav('product');else if(x==='askProduct')openAI('아쿠아 하이드라 세럼, 내가 써볼 만한 이유가 있어?','product');else if(x==='askAbout')openAI('아쿠아 하이드라 세럼을 지금 루틴에 더하면 어떤 경험을 비교해볼 수 있어?','product');else if(x==='recommend')openAI('내가 좋아했던 사용감을 바탕으로 다음에 탐색할 세럼을 찾아줘.');else if(x==='addProduct'){toast('내 화장품에 추가했어요');}else if(x==='editRoutine')openSheet('routine');else if(x==='addStep'||x==='reorder'||x==='removeStep'){closeSheet();toast('새 루틴 편집안에 반영했어요');}else if(x==='quickProduct'){closeSheet();state.reviewStep=1;state.mood='unsure';nav('review');}else if(x==='reviewNext'){if(!state.mood)return;state.reviewStep=1;render()}else if(x==='saveReview'){state.recordText=$('#recordText')?.value.trim()||'';state.saved=true;render()}else if(x==='finishReview'){state.experienceOpen=false;state.saved=false;state.reviewStep=0;state.mood=null;state.tags=[];nav('home')}else if(x==='startRescue'){closeSheet();openAI(`이번 루틴에서 ${state.recordText||state.tags.join(', ')||'따가움과 붉어짐'}이 있었어요.`,'rescue')}else if(x==='applyRescue'){state.changed=true;state.experienceOpen=true;state.day=1;addUser('그 루틴으로 바꿀게요.');addAI('새 루틴으로 저장했어요. 이전 경험은 그대로 남고, 오늘부터 이 조합의 경험이 따로 쌓입니다. 불편하면 언제든 여기서 이어서 말해주세요.');render();toast('새 루틴을 시작했어요')}else if(x==='askPattern')openAI('내가 가벼운 세럼을 좋아한다는 패턴의 근거를 보여줘.');else if(x==='send')sendChat();return}const mood=e.target.closest('[data-mood]');if(mood){state.mood=mood.dataset.mood;render();return}const tag=e.target.closest('[data-tag]');if(tag){const t=tag.dataset.tag;state.tags=state.tags.includes(t)?state.tags.filter(x=>x!==t):[...state.tags,t];render();return}const q=e.target.closest('[data-quick]');if(q){sendChat(q.dataset.quick)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatInput'){e.preventDefault();sendChat()}});$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
const jumps=[['home','홈'],['discover','탐색'],['product','제품 비교'],['lab','사용 경험'],['review','경험 돌아보기'],['pattern','패턴 근거'],['ai','AI 채팅'],['me','나의 SKN']];$('#jump').innerHTML=jumps.map(([r,l])=>`<button data-j="${r}">${l}</button>`).join('');$('#jump').onclick=e=>{const b=e.target.closest('[data-j]');if(b){state.stack=[];state.route=b.dataset.j;render()}};
const scenarios=[['day7','DAY 7'],['saved','경험 저장 후'],['rescue','Rescue 시작'],['rescuePlan','Rescue 제안'],['empty','사용 경험 없음']];$('#scenarios').innerHTML=scenarios.map(([s,l])=>`<button data-s="${s}">${l}</button>`).join('');$('#scenarios').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;state.stack=[];if(b.dataset.s==='day7'){state.day=7;state.saved=false;state.reviewStep=0;state.route='home'}else if(b.dataset.s==='saved'){state.day=7;state.reviewStep=1;state.mood='good';state.tags=['흡수가 빨랐음','화장이 안 밀림'];state.recordText='아침에 가볍고 화장 전에 밀리지 않아서 좋았어요.';state.saved=true;state.route='review'}else if(b.dataset.s==='rescue'){openAI('이번 루틴에서 어제부터 볼이 따갑고 빨개졌어요.','rescue');return}else if(b.dataset.s==='rescuePlan'){state.chatMode='rescue';state.rescueStep=2;state.chat=[{role:'user',html:'어제부터 볼이 따갑고 빨개졌어요.'},{role:'ai',html:'마지막 비교 기준 이후 바뀐 것부터 확인할게요.'}];rescueReply('네, 이게 전부예요');state.route='ai'}else{state.experienceOpen=false;state.route='home'}render()};
render();
</script>
</body>
</html>
