<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>SkinCause — 화장품과 루틴 기록</title>
<style>
/* ============================================================
   SkinCause · 인터랙티브 제품 프로토타입
   실제 사용자가 보는 화면 · 모달 · 토스트 · 바텀시트까지
   아이콘은 요청에 따라 X 표시 박스 플레이스홀더로 대체
   ============================================================ */

/* ---------- design tokens ---------- */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eef1f7;
  --ink:#171a21; --ink-2:#54606f; --ink-3:#8a94a3; --ink-4:#aab2bf;
  --line:#e7eaf0; --line-2:#eff2f7;
  --brand:#3b52d6; --brand-2:#5b6ff0; --brand-soft:#eaeefe; --brand-ink:#2536a8;
  --good:#1f9d63; --good-soft:#dcf3e7;
  --warn:#b5811f; --warn-soft:#faefd6;
  --crit:#d1495b; --crit-soft:#fbe2e6;
  --info:#2f7ab5; --info-soft:#e0eefa;
  --ai:#8250c4; --ai-soft:#f1e9fb;
  --gold:#c99a2e; --gold-soft:#faf1d8;
  --radius:18px; --radius-sm:12px; --radius-xs:9px;
  --shadow-1:0 1px 2px rgba(20,25,40,.05), 0 6px 16px rgba(20,25,40,.05);
  --shadow-2:0 8px 30px rgba(20,25,40,.12);
  --shadow-phone:0 40px 80px -24px rgba(20,25,45,.45), 0 16px 32px rgba(20,25,45,.16);
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
h1,h2,h3,h4,p{margin:0; text-wrap:pretty}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- desktop stage ---------- */
.stage{
  height:100%; width:100%; display:flex; align-items:center; justify-content:center;
  gap:44px; padding:28px;
  background:
    radial-gradient(1100px 600px at 15% -10%, color-mix(in srgb,var(--brand) 12%, transparent), transparent 60%),
    radial-gradient(900px 500px at 110% 110%, color-mix(in srgb,var(--ai) 12%, transparent), transparent 55%),
    var(--bg);
}
.stage-aside{max-width:300px; display:flex; flex-direction:column; gap:18px}
.stage-brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.stage-brand .logo{
  width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;
  font-weight:800;font-family:var(--mono);
  background:linear-gradient(140deg,var(--brand-2),var(--brand) 60%,color-mix(in srgb,var(--brand) 55%,#000));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.stage-brand small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.stage-aside p{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.stage-tip{font-size:12.5px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:12px}
.stage-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.stage-controls button{
  font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;box-shadow:var(--shadow-1);
}
.stage-controls button:hover{color:var(--ink)}
.stage-jump{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.stage-jump b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
.stage-jump .jrow{display:flex;flex-wrap:wrap;gap:6px}
.stage-jump .jrow button{
  font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:5px 9px;
}
.stage-jump .jrow button:hover{color:var(--brand);border-color:var(--brand)}
.stage-scenarios{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.stage-scenarios b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
.stage-scenarios .srow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stage-scenarios button{font-size:11.5px;text-align:left;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 9px;box-shadow:var(--shadow-1)}
.stage-scenarios button:hover{color:var(--brand);border-color:var(--brand)}
.stage-scenarios button.on{color:#fff;background:var(--brand);border-color:var(--brand)}
@media (max-width:900px){
  html,body{width:100%;overflow-x:hidden}
  .stage-aside{display:none}
  .stage{padding:0;gap:0;width:100%}
}

/* ---------- phone frame ---------- */
.phone{
  position:relative; width:392px; height:820px; max-height:calc(100vh - 40px);
  border-radius:52px; background:#0a0c10; padding:11px;
  box-shadow:var(--shadow-phone), inset 0 0 0 2px rgba(255,255,255,.06);
  flex:none;
}
@media (max-width:900px){
  .phone{width:100%;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0;width:100%}
}
.screen{
  position:relative; width:100%; height:100%; border-radius:42px; overflow:hidden;
  background:var(--surface-2); display:flex; flex-direction:column;
}
@media (max-width:900px){ .screen{border-radius:0} }

.statusbar{
  position:relative; z-index:6; height:46px; flex:none;
  display:flex; align-items:center; justify-content:space-between; padding:0 26px 0 30px;
  font-size:14px; font-weight:700; color:var(--ink); background:var(--surface);
}
.statusbar .sb-r{display:flex;align-items:center;gap:6px;font-size:12px}
.statusbar .notch{
  position:absolute; left:50%; top:9px; transform:translateX(-50%);
  width:112px; height:26px; background:#0a0c10; border-radius:16px;
}

/* ---------- app chrome ---------- */
.app{position:relative; flex:1; display:flex; flex-direction:column; min-height:0}
.appbar{
  flex:none; z-index:5; display:flex; align-items:center; gap:8px;
  padding:9px 12px 11px; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.appbar.flush{border-bottom:0;background:transparent}
.appbar .ab-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2);
}
.appbar .ab-btn:active{background:var(--surface-3)}
.appbar .ab-title{flex:1;min-width:0}
.appbar .ab-title h1{font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ab-title .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar.center .ab-title{text-align:center}
.appbar .ab-actions{display:flex;gap:2px}

.body{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
.body::-webkit-scrollbar{width:0}
.pad{padding:16px 16px 26px}
.body.grad{background:linear-gradient(180deg, color-mix(in srgb,var(--brand) 8%, var(--surface-2)) 0%, var(--surface-2) 180px)}

/* screen transition */
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes screenInBack{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.app.anim-fwd .body>*{animation:screenIn .26s cubic-bezier(.22,1,.36,1)}
.app.anim-back .body>*{animation:screenInBack .24s ease}

/* ---------- X-box icon placeholder ---------- */
.ic{display:inline-grid;place-items:center;width:1.35em;height:1.35em;flex:none;color:currentColor;vertical-align:-.22em}
.ic svg{width:100%;height:100%;display:block}
.ic.sm{width:1.1em;height:1.1em}
.ic.lg{width:1.7em;height:1.7em}

/* ---------- typography helpers ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.h-sec{font-size:13px;font-weight:800;letter-spacing:.01em;color:var(--ink-2);display:flex;align-items:center;gap:7px;margin:22px 2px 11px}
.h-sec:first-child{margin-top:2px}
.h-sec .more{margin-left:auto;font-size:12px;font-weight:600;color:var(--brand)}
.lead{font-size:14px;color:var(--ink-2);line-height:1.6}
.muted{color:var(--ink-3)}
.tiny{font-size:11.5px}
.hl{color:var(--brand);font-weight:700}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1)}
.card.pad{padding:16px}
.card+.card{margin-top:12px}
.card.tap{cursor:pointer;transition:transform .12s ease}
.card.tap:active{transform:scale(.985)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.sm{gap:9px}
.divider{height:1px;background:var(--line);margin:14px 0;border:0}

/* ---------- product row ---------- */
.prod{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm)}
.prod.tap{cursor:pointer;transition:transform .12s ease}
.prod.tap:active{transform:scale(.985)}
.prod .thumb{width:46px;height:46px;flex:none}
.prod .p-main{flex:1;min-width:0}
.prod .pn{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod .pm{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.prod .p-end{flex:none;display:flex;align-items:center;gap:8px;color:var(--ink-4)}
.thumb{
  border-radius:12px;display:grid;place-items:center;flex:none;color:var(--ink-4);
  background:linear-gradient(135deg,var(--surface-3),var(--surface-2));border:1px solid var(--line-2);
}
.thumb.lg{width:58px;height:58px;border-radius:14px}
.thumb.xl{width:76px;height:76px;border-radius:18px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:52px;padding:0 20px;border-radius:15px;font-size:15px;font-weight:700;letter-spacing:-.01em;
  background:var(--brand);color:#fff;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--brand) 70%,transparent);
  transition:transform .1s ease,filter .1s ease;width:100%;
}
.btn:active{transform:scale(.98);filter:brightness(.96)}
.btn.sec{background:var(--brand-soft);color:var(--brand-ink);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:none;border:1px solid var(--line)}
.btn.line{background:var(--surface);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:var(--crit);box-shadow:0 6px 18px -6px color-mix(in srgb,var(--crit) 70%,transparent)}
.btn.warn{background:var(--warn)}
.btn.sm{height:40px;font-size:13.5px;border-radius:11px;width:auto;padding:0 15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.sticky-cta{
  position:sticky;bottom:0;margin:18px -16px -26px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--surface-2) 34%);
}
.linkbtn{font-size:13px;font-weight:700;color:var(--brand)}

/* ---------- chips / pills / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-3);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff}
.chip.line{background:var(--surface);border-color:var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{height:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;letter-spacing:.01em}
.badge.good{background:var(--good-soft);color:var(--good)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit)} .badge.info{background:var(--info-soft);color:var(--info)}
.badge.brand{background:var(--brand-soft);color:var(--brand-ink)} .badge.ai{background:var(--ai-soft);color:var(--ai)}
.badge.gold{background:var(--gold-soft);color:var(--gold)} .badge.neutral{background:var(--surface-3);color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}
.dot.info{background:var(--info)} .dot.brand{background:var(--brand)} .dot.mute{background:var(--ink-4)}

/* ---------- form ---------- */
.field{margin-bottom:14px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 2px 7px}
.input,.textarea{
  width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;
  padding:14px 15px;font-size:15px;color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease;
}
.textarea{min-height:92px;resize:none;line-height:1.55}
.input::placeholder,.textarea::placeholder{color:var(--ink-4)}
.input:focus,.textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.input-search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:0 14px}
.input-search input{flex:1;border:0;background:none;padding:14px 0;font-size:15px;outline:none}
.input-search .ic{color:var(--ink-4)}
.help{font-size:11.5px;color:var(--ink-3);margin:6px 2px 0}

/* option row (selectable) */
.opt{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt+.opt{margin-top:9px}
.opt .o-body{flex:1;min-width:0}
.opt .o-t{font-size:14px;font-weight:700}
.opt .o-d{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.12s}
.opt .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:transparent;transition:.12s}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.on .radio{border-color:var(--brand)} .opt.on .radio::after{background:var(--brand)}
.opt.check .radio{border-radius:7px}
.opt.check.on .radio::after{width:12px;height:12px;border-radius:3px}

/* segmented */
.seg{display:flex;background:var(--surface-3);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

/* stepper / counter */
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--surface-3);font-size:19px;font-weight:700;color:var(--ink-2);display:grid;place-items:center}
.stepper .val{font-size:16px;font-weight:800;min-width:26px;text-align:center}

/* ---------- verdict banner ---------- */
.verdict{border-radius:16px;padding:16px;display:flex;gap:13px;align-items:flex-start}
.verdict .v-ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center}
.verdict .v-t{font-size:16px;font-weight:800;letter-spacing:-.01em}
.verdict .v-d{font-size:12.5px;margin-top:3px;line-height:1.5;opacity:.92}
.verdict.good{background:var(--good-soft);color:var(--good)} .verdict.good .v-ic{background:color-mix(in srgb,var(--good) 22%,transparent)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)} .verdict.warn .v-ic{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.verdict.crit{background:var(--crit-soft);color:var(--crit)} .verdict.crit .v-ic{background:color-mix(in srgb,var(--crit) 22%,transparent)}
.verdict.info{background:var(--info-soft);color:var(--info)} .verdict.info .v-ic{background:color-mix(in srgb,var(--info) 22%,transparent)}
.verdict .v-t small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}

/* compact product opinion */
.product-brief{display:flex;align-items:center;gap:13px;padding:2px 2px 16px;border-bottom:1px solid var(--line)}
.product-brief .p-main{flex:1;min-width:0}.product-brief .pn{font-size:16px;font-weight:850;letter-spacing:-.02em}.product-brief .pm{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.opinion-hero{padding:20px;border-radius:22px;background:linear-gradient(145deg,#17213f,#3548ad);color:#fff;box-shadow:0 18px 34px -24px #18224f}
.opinion-hero-head{display:flex;align-items:center;gap:10px}.opinion-hero-head .ai-avatar{width:36px;height:36px}
.opinion-hero-kicker{font-size:10.5px;font-weight:800;letter-spacing:.06em;opacity:.72}.opinion-hero-title{font-size:21px;font-weight:850;letter-spacing:-.035em;margin-top:1px}
.opinion-hero p{font-size:12.5px;line-height:1.62;color:rgba(255,255,255,.82);margin-top:13px}
.opinion-basis{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.opinion-basis span{font-size:10.5px;font-weight:750;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.12)}
.signal-list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-1)}
.signal-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:14px}
.signal-row+.signal-row{border-top:1px solid var(--line-2)}.signal-mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:900}
.signal-row.good .signal-mark{background:var(--good-soft);color:var(--good)}.signal-row.warn .signal-mark{background:var(--warn-soft);color:var(--warn)}.signal-row.info .signal-mark{background:var(--info-soft);color:var(--info)}
.signal-copy b{display:block;font-size:13px}.signal-copy small{display:block;font-size:11px;color:var(--ink-3);line-height:1.4;margin-top:2px}.signal-end{font-size:11px;font-weight:800;color:var(--ink-3)}
.ai-consult-card{padding:18px;border-radius:20px;background:linear-gradient(145deg,var(--ai-soft),#eef0ff);border:1px solid color-mix(in srgb,var(--ai) 20%,var(--line))}
.ai-consult-head{display:flex;align-items:center;gap:10px}.ai-consult-head .ai-avatar{width:36px;height:36px}.ai-consult-title{font-size:14px;font-weight:850}.ai-consult-sub{font-size:11px;color:var(--ink-3);margin-top:1px}
.prompt-pills{display:flex;gap:7px;overflow-x:auto;margin:13px -2px 0;padding:0 2px 2px}.prompt-pills::-webkit-scrollbar{height:0}.prompt-pills button{flex:none;padding:8px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink-2)}

/* reason list (opinion) */
.reason{display:flex;gap:11px;padding:13px 0}
.reason+.reason{border-top:1px solid var(--line-2)}
.reason .r-ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center}
.reason .r-t{font-size:13.5px;font-weight:700}
.reason .r-d{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.55}
.reason.good .r-ic{background:var(--good-soft);color:var(--good)}
.reason.warn .r-ic{background:var(--warn-soft);color:var(--warn)}
.reason.crit .r-ic{background:var(--crit-soft);color:var(--crit)}
.reason.info .r-ic{background:var(--info-soft);color:var(--info)}
.reason.brand .r-ic{background:var(--brand-soft);color:var(--brand-ink)}

/* ai note */
.ai-note{background:var(--ai-soft);border-radius:14px;padding:13px 14px;display:flex;gap:11px}
.ai-note .a-ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--ai) 20%,transparent);color:var(--ai)}
.ai-note .a-t{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ai)}
.ai-note .a-d{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.55}

/* structured AI conversation */
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.chat-msg{max-width:88%;padding:12px 14px;border-radius:17px;font-size:13.5px;line-height:1.6;box-shadow:var(--shadow-1)}
.chat-msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.chat-msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.chat-who{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--ai);margin-bottom:5px}
.chat-card{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow-1)}
.chat-card.crit{border-color:color-mix(in srgb,var(--crit) 35%,var(--line));background:var(--crit-soft)}
.chat-card.good{border-color:color-mix(in srgb,var(--good) 35%,var(--line));background:var(--good-soft)}
.chat-actions{display:flex;flex-wrap:wrap;gap:8px;align-self:stretch}
.chat-actions .chip{height:36px;padding:0 14px;background:var(--surface);border-color:var(--line);box-shadow:var(--shadow-1)}
.chat-actions .chip.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.chat-input{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:var(--shadow-1)}
.chat-input .textarea{min-height:82px;border:0;padding:3px 2px;background:transparent;box-shadow:none;resize:none}
.chat-input .btn{height:42px;margin-top:8px;border-radius:12px;font-size:13.5px}
.fact-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.fact-row{display:flex;gap:8px;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.fact-row b{color:var(--ink)}

/* routine check-in — one decision, clear scope */
.checkin-hero{padding:20px;border-radius:22px;background:linear-gradient(145deg,#303fbd,var(--brand-2));color:#fff;box-shadow:0 14px 30px -18px rgba(42,60,185,.8)}
.checkin-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.checkin-top .badge{background:rgba(255,255,255,.16);color:#fff}
.checkin-title{font-size:22px;font-weight:850;letter-spacing:-.035em;line-height:1.32;margin-top:18px}
.checkin-lead{font-size:13px;line-height:1.62;color:rgba(255,255,255,.84);margin-top:8px}
.routine-diff{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow-1)}
.diff-head{display:grid;grid-template-columns:1fr 26px 1fr;align-items:center;gap:6px}
.diff-state{min-width:0;padding:11px;border-radius:13px;background:var(--surface-2)}
.diff-state.current{background:var(--brand-soft);color:var(--brand-ink)}
.diff-label{font-size:10.5px;font-weight:750;color:var(--ink-3)}
.diff-state.current .diff-label{color:var(--brand)}
.diff-value{font-size:14px;font-weight:850;margin-top:2px}
.diff-arrow{text-align:center;color:var(--ink-4);font-size:18px;font-weight:700}
.changed-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.changed-product{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;background:var(--surface-2)}
.changed-product .thumb{width:36px;height:36px;border-radius:10px}
.changed-product .grow{min-width:0}
.changed-product .pn{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.changed-product .pm{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.scope-note{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:12px 13px;border-radius:14px;background:var(--ai-soft);color:var(--ink-2);font-size:12px;line-height:1.55}
.scope-note b{color:var(--ai)}
.checkin-question{font-size:18px;font-weight:850;letter-spacing:-.025em;line-height:1.4;margin:24px 2px 5px}
.checkin-hint{font-size:12px;color:var(--ink-3);margin:0 2px 12px}
.answer-list{display:flex;flex-direction:column;gap:9px}
.answer-card{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow-1);transition:transform .12s ease,border-color .12s ease}
.answer-card:active{transform:scale(.985)}
.answer-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--ink-3);font-size:13px;font-weight:850}
.answer-card.good .answer-mark{background:var(--good-soft);color:var(--good)}
.answer-card.crit .answer-mark{background:var(--crit-soft);color:var(--crit)}
.answer-main{flex:1;min-width:0}
.answer-title{font-size:14px;font-weight:800;color:var(--ink)}
.answer-desc{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.answer-end{color:var(--ink-4);font-size:17px}
.checkin-result{padding:22px 18px;border-radius:20px;text-align:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.result-mark{width:52px;height:52px;margin:0 auto;border-radius:16px;display:grid;place-items:center;background:var(--good-soft);color:var(--good);font-size:17px;font-weight:900}
.checkin-result h2{font-size:20px;letter-spacing:-.03em;margin-top:13px}
.checkin-result p{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:7px}

/* modern guided chatbot */
.ai-chat-page{min-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#f8f9fc 0%,var(--surface-2) 100%)}
.ai-thread{flex:1;padding:20px 16px 12px;display:flex;flex-direction:column;gap:18px}
.ai-row{display:flex;align-items:flex-start;gap:10px}
.ai-avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,var(--ai),var(--brand));color:#fff;font-size:10px;font-weight:900;box-shadow:0 6px 14px -8px var(--ai)}
.ai-message{max-width:calc(100% - 42px);min-width:0}
.ai-name{font-size:10.5px;font-weight:800;color:var(--ink-3);margin:0 0 5px 2px}
.ai-bubble{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:6px 17px 17px 17px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:var(--ink);box-shadow:var(--shadow-1)}
.user-row{display:flex;justify-content:flex-end}
.user-bubble{max-width:82%;padding:11px 14px;border-radius:17px 17px 6px 17px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:650;box-shadow:0 8px 18px -12px var(--brand)}
.ai-rich-card{margin-top:9px;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow-1)}
.ai-rich-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:11px;border-bottom:1px solid var(--line-2)}
.ai-rich-title{font-size:12.5px;font-weight:800}
.ai-rich-meta{font-size:10.5px;color:var(--ink-3)}
.routine-shift{display:flex;align-items:center;gap:8px;padding:12px 0}
.routine-node{flex:1;min-width:0;padding:10px;border-radius:12px;background:var(--surface-2)}
.routine-node.on{background:var(--brand-soft)}
.routine-node small{display:block;font-size:9.5px;color:var(--ink-3);margin-bottom:2px}
.routine-node b{display:block;font-size:12.5px;white-space:nowrap}
.routine-node.on b{color:var(--brand-ink)}
.routine-shift-arrow{color:var(--ink-4);font-weight:800}
.new-product-chips{display:flex;flex-wrap:wrap;gap:6px}
.new-product-chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:7px 9px;border-radius:10px;background:var(--surface-2);font-size:10.5px;color:var(--ink-2)}
.new-product-chip .dot{background:var(--brand)}
.ai-scope{margin-top:9px;padding:9px 10px;border-radius:11px;background:var(--ai-soft);font-size:10.5px;line-height:1.45;color:var(--ai)}
.reply-dock{position:sticky;bottom:0;z-index:3;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(246,248,251,0),var(--surface-2) 16%)}
.reply-label{font-size:10.5px;color:var(--ink-3);text-align:center;margin:0 0 8px}
.reply-options{display:flex;flex-direction:column;gap:7px;padding:9px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 34px rgba(20,25,40,.12);backdrop-filter:blur(14px)}
.reply-option{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:12px;background:var(--surface-2);transition:transform .12s ease,background .12s ease}
.reply-option:active{transform:scale(.985)}
.reply-option:hover{background:var(--brand-soft)}
.reply-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ink-4)}
.reply-option.good .reply-dot{background:var(--good)}
.reply-option.crit .reply-dot{background:var(--crit)}
.reply-copy{flex:1;min-width:0}
.reply-copy b{display:block;font-size:13px}
.reply-copy small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.reply-arrow{color:var(--ink-4);font-size:17px}
.ai-status-card{margin-top:9px;padding:13px;border-radius:15px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.ai-status-card .row-between+.row-between{margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
.safety-card{margin-top:9px;border-radius:16px;padding:13px;background:var(--crit-soft);border:1px solid color-mix(in srgb,var(--crit) 24%,var(--line))}
.safety-card-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:850;color:var(--crit)}
.safety-items{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.safety-item{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.45;color:var(--ink-2)}
.safety-item::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--crit);margin-top:6px;flex:none}
.safety-select-list{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.safety-select{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;line-height:1.4;color:var(--ink-2)}
.safety-select-box{width:20px;height:20px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-size:11px;font-weight:900}
.safety-select.selected{border-color:var(--crit);background:var(--crit-soft);color:var(--ink)}
.safety-select.selected .safety-select-box{border-color:var(--crit);background:var(--crit);color:#fff}
.chat-composer{padding:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 34px rgba(20,25,40,.12);backdrop-filter:blur(14px)}
.chat-composer textarea{width:100%;min-height:74px;max-height:130px;resize:none;border:0;outline:0;background:transparent;padding:4px 4px 8px;font-size:13px;line-height:1.5;color:var(--ink)}
.chat-composer textarea::placeholder{color:var(--ink-4)}
.composer-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line-2);padding-top:9px}
.composer-hint{font-size:10px;color:var(--ink-3)}
.structured-card{margin-top:9px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow-1)}
.structured-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.structured-head b{font-size:12.5px}
.structured-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.structured-cell{padding:10px;border-radius:11px;background:var(--surface-2)}
.structured-cell small{display:block;font-size:9.5px;color:var(--ink-3)}
.structured-cell b{display:block;font-size:12px;margin-top:2px}
.change-timeline{position:relative;display:flex;flex-direction:column;gap:0;margin-top:10px}
.change-line{display:grid;grid-template-columns:54px 16px 1fr;gap:7px;min-height:55px}
.change-date{font-size:9.5px;color:var(--ink-3);padding-top:2px;text-align:right}
.change-rail{position:relative;display:flex;justify-content:center}
.change-rail::after{content:"";position:absolute;top:9px;bottom:-4px;width:1px;background:var(--line)}
.change-line:last-child .change-rail::after{display:none}
.change-rail i{position:relative;z-index:1;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:4px;box-shadow:0 0 0 3px var(--brand-soft)}
.change-copy{padding-bottom:11px;min-width:0}
.change-copy b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.change-copy small{display:block;font-size:9.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.verify-rank{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.verify-rank+.verify-rank{border-top:1px solid var(--line-2)}
.verify-no{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand-ink);font-size:11px;font-weight:900}
.verify-copy{min-width:0;flex:1}
.verify-copy b{display:block;font-size:12px}
.verify-copy small{display:block;font-size:10px;color:var(--ink-3);line-height:1.45;margin-top:2px}
.plan-card{margin-top:9px;border-radius:16px;padding:14px;background:linear-gradient(145deg,var(--brand-soft),#f6f3ff);border:1px solid color-mix(in srgb,var(--brand) 16%,var(--line))}
.plan-title{font-size:12.5px;font-weight:850;color:var(--brand-ink)}
.plan-steps{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.plan-step{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.45;color:var(--ink-2)}
.plan-step b{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--brand);font-size:10px;box-shadow:var(--shadow-1)}
.day-options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.day-option{padding:12px 6px;border-radius:12px;background:var(--surface-2);text-align:center}
.day-option strong{display:block;font-size:15px}
.day-option small{display:block;font-size:9.5px;color:var(--ink-3);margin-top:1px}
.day-option.recommended{background:var(--brand-soft);color:var(--brand-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 28%,transparent)}
.prototype-next{font-size:10px;color:var(--ink-4);text-align:center;margin-top:7px}

/* contextual AI research */
.context-card{padding:15px;border-radius:17px;background:linear-gradient(145deg,#f1f4ff,#f8f6ff);border:1px solid color-mix(in srgb,var(--ai) 16%,var(--line));box-shadow:var(--shadow-1)}
.context-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.context-head b{font-size:12.5px}.context-quote{margin-top:10px;font-size:13.5px;font-weight:720;line-height:1.55;letter-spacing:-.015em;color:var(--ink)}
.context-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.context-meta span{padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.72);font-size:10.5px;color:var(--ink-2)}
.research-strip{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:14px;background:#151a2b;color:#fff}
.research-pulse{width:9px;height:9px;border-radius:50%;background:#87a0ff;box-shadow:0 0 0 5px rgba(135,160,255,.14);flex:none}
.research-strip b{display:block;font-size:11.5px}.research-strip small{display:block;font-size:9.5px;opacity:.62;margin-top:2px}
.source-list{display:flex;flex-direction:column;gap:8px}
.source-row{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:13px;background:var(--surface-2)}
.source-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--ai);font-size:10px;font-weight:900;border:1px solid var(--line)}
.source-copy{min-width:0;flex:1}.source-copy b{display:block;font-size:11.5px}.source-copy small{display:block;font-size:10px;color:var(--ink-3);line-height:1.45;margin-top:2px}.source-link{font-size:10px;font-weight:750;color:var(--brand);white-space:nowrap}
.evidence-snippet{margin-top:8px;padding:10px 11px;border-left:3px solid var(--ai);border-radius:0 10px 10px 0;background:var(--ai-soft);font-size:10.5px;line-height:1.5;color:var(--ink-2)}
.unknown-card{padding:12px 13px;border-radius:14px;background:var(--warn-soft);color:var(--ink-2);font-size:11.5px;line-height:1.55}.unknown-card b{color:var(--warn)}
.research-log{display:grid;grid-template-columns:1fr 1fr;gap:7px}.research-log div{padding:10px;border-radius:11px;background:var(--surface-2)}.research-log small{display:block;font-size:9px;color:var(--ink-3)}.research-log b{display:block;font-size:10.5px;margin-top:2px}
.candidate-card{padding:15px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.candidate-card+.candidate-card{margin-top:10px}.candidate-reason{font-size:12.5px;line-height:1.55;margin-top:10px}.candidate-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2)}
.chat-inline-card{margin-top:9px;padding:13px;border-radius:15px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.chat-inline-card h4{font-size:12px;margin:0 0 7px}.chat-inline-card p{font-size:11px;line-height:1.55;color:var(--ink-2)}
.routine-ai-card{padding:16px;border-radius:18px;background:linear-gradient(145deg,#171d32,#303b68);color:#fff;box-shadow:0 16px 32px -22px rgba(22,28,55,.8)}
.routine-ai-card .ai-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.routine-ai-card .ai-top b{font-size:12px}.routine-ai-card .ai-top span{font-size:9.5px;opacity:.68}
.routine-ai-card h3{font-size:17px;line-height:1.4;letter-spacing:-.025em;margin-top:12px}.routine-ai-card p{font-size:11.5px;line-height:1.55;opacity:.76;margin-top:5px}
.routine-ai-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.routine-ai-actions button{height:38px;border-radius:11px;background:rgba(255,255,255,.12);color:#fff;font-size:11.5px;font-weight:750}.routine-ai-actions button.primary{background:#fff;color:#20294c}
.routine-insight{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.routine-insight+.routine-insight{margin-top:8px}.insight-kicker{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9.5px;font-weight:800;color:var(--ai);letter-spacing:.035em}.insight-title{font-size:13px;font-weight:820;line-height:1.45;margin-top:6px}.insight-copy{font-size:11.5px;color:var(--ink-2);line-height:1.55;margin-top:4px}
.order-flow{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.order-flow::-webkit-scrollbar{display:none}.order-node{min-width:max-content;padding:8px 9px;border-radius:10px;background:var(--surface-2);font-size:10px;font-weight:720}.order-node.focus{background:var(--ai-soft);color:var(--ai)}.order-arrow{color:var(--ink-4);font-size:11px}
.analysis-status{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:13px;background:var(--good-soft);color:var(--good);font-size:11px;font-weight:720}.analysis-status i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 14%,transparent)}

/* routine history */
.history-hero{padding:18px;border-radius:21px;background:linear-gradient(145deg,#18213b,#42539a);color:#fff;box-shadow:0 18px 34px -24px rgba(24,33,59,.9)}
.history-hero small{display:block;font-size:10px;font-weight:780;letter-spacing:.045em;opacity:.65}.history-hero h2{font-size:20px;line-height:1.35;letter-spacing:-.035em;margin-top:8px}.history-hero p{font-size:11.5px;line-height:1.55;opacity:.76;margin-top:5px}
.history-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:15px}.history-stat{padding:9px;border-radius:11px;background:rgba(255,255,255,.1)}.history-stat b{display:block;font-size:15px}.history-stat span{display:block;font-size:9px;opacity:.65;margin-top:1px}
.version-list{position:relative;display:flex;flex-direction:column;gap:11px}.version-list::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--line)}
.version-card{position:relative;padding:15px 14px 14px 48px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);text-align:left;width:100%}.version-card.current{border-color:color-mix(in srgb,var(--brand) 30%,var(--line));background:linear-gradient(145deg,var(--surface),var(--brand-soft))}.version-node{position:absolute;left:12px;top:15px;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-3);font-size:9px;font-weight:900;z-index:1}.version-card.current .version-node{background:var(--brand);color:#fff}.version-card.stable .version-node{background:var(--good);color:#fff}.version-card.rescue .version-node{background:var(--crit);color:#fff}
.version-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.version-title{font-size:14px;font-weight:850}.version-date{font-size:9.5px;color:var(--ink-3);margin-top:2px}.version-change{font-size:11.5px;line-height:1.5;color:var(--ink-2);margin-top:9px}.version-result{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3)}
.routine-mini{display:flex;align-items:center;gap:5px;margin-top:9px}.routine-mini-label{width:25px;font-size:9px;font-weight:800;color:var(--ink-3)}.routine-mini .thumb{width:23px;height:23px;border-radius:7px}.routine-mini-more{font-size:9px;color:var(--ink-3)}
.history-link{padding:12px 13px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;gap:8px}.history-link b{font-size:11.5px}.history-link small{display:block;font-size:9.5px;color:var(--ink-3);margin-top:2px}
.compare-grid{display:grid;grid-template-columns:1fr 26px 1fr;align-items:center;gap:6px}.compare-routine{padding:13px;border-radius:15px;background:var(--surface-2)}.compare-routine.on{background:var(--brand-soft)}.compare-routine small{display:block;font-size:9px;color:var(--ink-3)}.compare-routine b{display:block;font-size:14px;margin-top:2px}.compare-arrow{text-align:center;color:var(--ink-4);font-weight:850}
.change-block{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}.change-block+.change-block{margin-top:8px}.change-block-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.change-block-head b{font-size:12px}.change-item{display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:11.5px;line-height:1.5}.change-symbol{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:900}.change-symbol.add{background:var(--good-soft);color:var(--good)}.change-symbol.move{background:var(--info-soft);color:var(--info)}.change-symbol.remove{background:var(--crit-soft);color:var(--crit)}

/* callout */
.note{border-radius:13px;padding:12px 14px;font-size:12.5px;line-height:1.55;background:var(--surface-3);color:var(--ink-2)}
.note.brand{background:var(--brand-soft);color:var(--brand-ink)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.crit{background:var(--crit-soft);color:var(--crit)}
.note b{color:inherit}

/* ---------- hero / gamestrip ---------- */
.gamestrip{
  display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:16px;cursor:pointer;
  background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--shadow-2);
}
.gamestrip .g-ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.gamestrip .g-body{flex:1;min-width:0}
.gamestrip .g-lv{font-size:10.5px;font-weight:800;letter-spacing:.06em;opacity:.85}
.gamestrip .g-t{font-size:14px;font-weight:800;letter-spacing:-.01em}
.gamestrip .g-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:7px;overflow:hidden}
.gamestrip .g-bar i{display:block;height:100%;border-radius:99px;background:#fff}
.gamestrip .g-pt{font-size:11.5px;font-weight:800;background:rgba(255,255,255,.2);padding:5px 10px;border-radius:99px;flex:none}
.gamestrip.rescue{background:linear-gradient(120deg,var(--crit),color-mix(in srgb,var(--crit) 70%,#7a2230))}

/* seven-day routine quest */
.routine-quest{padding:18px;border-radius:22px;color:#fff;background:linear-gradient(145deg,#2f45bd,var(--brand-2));box-shadow:0 18px 34px -22px rgba(35,55,175,.85)}
.routine-quest .rq-kicker{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:800;letter-spacing:.04em}
.routine-quest .rq-title{font-size:20px;font-weight:850;letter-spacing:-.035em;line-height:1.35;margin-top:13px}
.routine-quest .rq-copy{font-size:12.5px;line-height:1.55;opacity:.86;margin-top:5px}
.routine-quest.explore{background:linear-gradient(145deg,#17213f,#3f54c7)}
.routine-quest.rescue-mode{background:linear-gradient(145deg,#7b2938,var(--crit))}
.primary-search{display:flex;align-items:center;gap:10px;width:100%;height:48px;margin-top:16px;padding:0 14px;border-radius:14px;background:#fff;color:var(--ink);font-size:13.5px;font-weight:750;text-align:left}
.primary-search span:first-child{flex:1}
.primary-search small{font-size:10.5px;color:var(--ink-3);font-weight:650}
.quest-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:17px}
.quest-day{height:7px;border-radius:99px;background:rgba(255,255,255,.22)}
.quest-day.done{background:#fff}.quest-day.today{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.quest-labels{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;opacity:.76;margin-top:7px}
.quest-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.quest-actions button{height:40px;border-radius:12px;font-size:12.5px;font-weight:750;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.15)}
.quest-actions button.primary{color:var(--brand-ink);background:#fff;border-color:#fff}
.quest-mini{padding:14px 15px;border-radius:16px;background:var(--brand-soft);color:var(--brand-ink)}
.quest-mini .qm-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.quest-mini .qm-title{font-size:13.5px;font-weight:800}.quest-mini .qm-copy{font-size:11.5px;margin-top:4px;opacity:.8}
.partial-tag{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:4px 8px;background:var(--warn-soft);color:var(--warn);font-size:10.5px;font-weight:800}

/* routine order and edit controls */
.routine-period{display:flex;align-items:center;gap:9px;margin:22px 2px 11px}
.routine-period h2{font-size:15px;font-weight:850;letter-spacing:-.02em}.routine-period span{font-size:11.5px;color:var(--ink-3)}
.routine-order{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--ink-2);font-size:12px;font-weight:850}
.routine-tools{display:flex;align-items:center;gap:4px;flex:none}
.routine-tools button{width:30px;height:30px;border-radius:9px;background:var(--surface-3);color:var(--ink-3);font-size:12px;font-weight:800}
.routine-tools button:last-child{color:var(--crit);background:var(--crit-soft)}
.routine-add{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:44px;margin-top:9px;border:1px dashed var(--line);border-radius:13px;color:var(--brand);font-size:13px;font-weight:750;background:var(--surface)}

/* cycle ring */
.cycle{display:flex;justify-content:space-between;gap:4px;margin-top:2px}
.cycle .c-step{flex:1;text-align:center}
.cycle .c-dot{width:34px;height:34px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-4);border:2px solid var(--line)}
.cycle .c-dot.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.cycle .c-dot.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.cycle .c-l{font-size:10.5px;font-weight:700;color:var(--ink-3)}
.cycle .c-step.on .c-l{color:var(--brand)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 12px;text-align:center}
.tile .t-v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.tile .t-l{font-size:11px;color:var(--ink-3);margin-top:2px}

/* list item / menu */
.menu{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.menu-item{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer}
.menu-item+.menu-item{border-top:1px solid var(--line-2)}
.menu-item:active{background:var(--surface-3)}
.menu-item .m-ic{color:var(--ink-3)}
.menu-item .m-t{flex:1;font-size:14px;font-weight:600}
.menu-item .m-end{color:var(--ink-4);font-size:13px;display:flex;align-items:center;gap:6px}

/* progress */
.prog{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .4s cubic-bezier(.22,1,.36,1)}
.prog.good i{background:var(--good)} .prog.gold i{background:var(--gold)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item::before{content:"";position:absolute;left:-22px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:2.5px solid var(--brand)}
.tl-item.rescue::before{border-color:var(--crit)} .tl-item.done::before{border-color:var(--good)}
.tl-item .tl-date{font-size:11px;font-weight:700;color:var(--ink-3);font-family:var(--mono)}
.tl-item .tl-t{font-size:13.5px;font-weight:700;margin-top:2px}
.tl-item .tl-d{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.5}

/* empty */
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty .e-ic{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-4)}
.empty .e-t{font-size:15px;font-weight:700;color:var(--ink-2)}
.empty .e-d{font-size:13px;margin-top:6px;line-height:1.55}

/* priority rank */
.rank{display:flex;gap:13px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:15px}
.rank+.rank{margin-top:10px}
.rank .r-no{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:15px;font-weight:800;background:var(--brand);color:#fff}
.rank.r2 .r-no{background:var(--brand-2)} .rank.r3 .r-no{background:var(--ink-4)}
.rank .rk-body{flex:1;min-width:0}

/* ---------- fab ---------- */
.fab{
  position:absolute; right:16px; bottom:calc(72px + 14px); z-index:8;
  width:56px;height:56px;border-radius:19px;background:var(--brand);color:#fff;
  display:grid;place-items:center;box-shadow:0 10px 24px -6px color-mix(in srgb,var(--brand) 65%,transparent);
  transition:transform .12s ease;
}
.fab:active{transform:scale(.94)}

/* ---------- tabbar ---------- */
.tabbar{
  flex:none;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));
}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--ink-4);font-size:10.5px;font-weight:700}
.tabbar .tab .ic{width:23px;height:23px}
.tabbar .tab.on{color:var(--brand)}

/* ---------- overlays (sheet / modal / toast) ---------- */
.scrim{
  position:absolute; inset:0; z-index:40; background:rgba(12,15,22,.44);
  opacity:0; transition:opacity .25s ease; backdrop-filter:blur(1.5px);
}
.scrim.show{opacity:1}
.scrim.modal-scrim{display:flex;align-items:center;justify-content:center;padding:24px}

.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:41;
  background:var(--surface); border-radius:26px 26px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.18);
  transform:translateY(100%); transition:transform .32s cubic-bezier(.22,1,.36,1);
  max-height:88%; display:flex; flex-direction:column;
}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:38px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet .sh-head{padding:8px 20px 12px;flex:none}
.sheet .sh-head h3{font-size:17px;font-weight:800;letter-spacing:-.02em}
.sheet .sh-head p{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.5}
.sheet .sh-body{padding:4px 16px;overflow-y:auto}
.sheet .sh-body::-webkit-scrollbar{width:0}
.sheet .sh-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));flex:none;border-top:1px solid var(--line-2)}

.modal{
  position:relative; z-index:42; width:100%; max-width:330px;
  background:var(--surface); border-radius:24px; padding:22px 20px 18px;
  box-shadow:var(--shadow-2); transform:scale(.9); opacity:0; transition:transform .26s cubic-bezier(.22,1,.36,1),opacity .2s ease;
  text-align:center;
}
.scrim.show .modal{transform:scale(1);opacity:1}
.modal .m-ic{width:56px;height:56px;border-radius:18px;margin:0 auto 15px;display:grid;place-items:center}
.modal h3{font-size:18px;font-weight:800;letter-spacing:-.02em}
.modal p{font-size:13.5px;color:var(--ink-2);margin-top:9px;line-height:1.6}
.modal .m-actions{margin-top:20px;display:flex;flex-direction:column;gap:9px}

/* toast */
.toast-host{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{
  max-width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;
  background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;box-shadow:var(--shadow-2);
  animation:toastIn .3s cubic-bezier(.22,1,.36,1); pointer-events:auto;
}
.toast.out{animation:toastOut .25s ease forwards}
.toast .t-ic{color:var(--good)} .toast.warn .t-ic{color:var(--warn)} .toast.info .t-ic{color:var(--info)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* misc utility */
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1}
.center{text-align:center}
.mt-s{margin-top:8px}.mt{margin-top:14px}.mt-l{margin-top:22px}
.wrap-scroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px}
.wrap-scroll::-webkit-scrollbar{height:0}
.pill-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface-3);padding:6px 11px;border-radius:99px}
</style>
</head>
<body>
<div class="stage">
  <aside class="stage-aside">
    <div class="stage-brand">
      <span class="logo">S</span>
      <span>SkinCause<small>화장품과 루틴 기록</small></span>
    </div>
    <div class="stage-jump">
      <b>바로 가기</b>
      <div class="jrow" id="jump"></div>
    </div>
    <div class="stage-scenarios">
      <b>상황 프리셋</b>
      <div class="srow" id="scenarios">
        <button data-scenario="quest-start">루틴 1일째</button>
        <button data-scenario="quest-six">루틴 6일째</button>
        <button data-scenario="quest-due">7일 완료</button>
        <button data-scenario="quest-more">추가 관찰</button>
        <button data-scenario="stable">안정 루틴 사용</button>
        <button data-scenario="routine-edit">루틴 편집</button>
        <button data-scenario="routine-history">루틴 기록</button>
        <button data-scenario="onboarding">첫 온보딩</button>
        <button data-scenario="analysis-failed">AI 분석 실패</button>
        <button data-scenario="early-check">저장 전 기록</button>
        <button data-scenario="ai-recommend">AI 추천 맥락 확인</button>
        <button data-scenario="ai-ingredient">AI 성분 근거</button>
        <button data-scenario="rescue">Rescue 시작</button>
        <button data-scenario="rescue-research">Rescue 근거 검색</button>
        <button data-scenario="rescue-plan">Rescue 권장 루틴</button>
        <button data-scenario="rescue-no-stable">안정 루틴 없는 Rescue</button>

  <div class="phone">

      </div>
      <div class="app" id="app"><!-- rendered --></div>

      <!-- overlay hosts -->
      <div class="scrim" id="sheetScrim"><div class="sheet" id="sheet"></div></div>
      <div class="scrim modal-scrim" id="modalScrim"><div class="modal" id="modal"></div></div>
      <div class="toast-host" id="toastHost"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SkinCause 인터랙티브 프로토타입 — 애플리케이션 코드
   ============================================================ */

/* ---------- X-box 아이콘 플레이스홀더 ----------
   요청에 따라 모든 아이콘은 대각선 X가 그려진 박스로 대체 */
function IC(cls){
  return `<span class="ic ${cls||''}"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="2.5" y="2.5" width="19" height="19" rx="4.5" stroke="currentColor" stroke-width="1.6"/>
    <path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </svg></span>`;
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 데이터 (프로토타입 시드) ---------- */
const CATALOG = {
  oil:{name:"센서티브 클렌징 오일", brand:"오브리에", cat:"클렌징"},
  cleanser:{name:"데일리 마일드 젤클렌저", brand:"뉴트리랩", cat:"클렌징"},
  toner:{name:"H2 하이드라 토너", brand:"어퀴즈", cat:"토너"},
  serum:{name:"판테놀 리페어 세럼", brand:"바이옴", cat:"세럼"},
  cream:{name:"세라마이드 배리어 크림", brand:"더마리브", cat:"크림"},
  sun:{name:"에어리 데일리 선크림", brand:"솔라핏", cat:"선케어"},
  aqua:{name:"아쿠아 하이드라 세럼", brand:"뉴트리랩", cat:"세럼"},
  ample:{name:"모이스처 부스트 앰플", brand:"데이지코", cat:"앰플"},
  retinal:{name:"리트리 0.1 리페어 앰플", brand:"바이옴", cat:"앰플"},
  cica:{name:"시카 카밍 수딩젤", brand:"더마리브", cat:"젤"},
};
const DEFAULT_ROUTINE = {
  morning:['cleanser','toner','serum','cream','sun'],
  evening:['oil','cleanser','aqua','ample','serum','cream']
};
const STABLE_ROUTINE = {
  morning:['cleanser','toner','serum','cream','sun'],
  evening:['oil','cleanser','toner','serum','cream']
};

/* 상태 라벨 */
const STATUS = {
  sealed:{label:"미개봉", dot:"mute"}, using:{label:"사용 중", dot:"good"},
  sometimes:{label:"가끔 사용", dot:"info"}, paused:{label:"잠시 보류", dot:"warn"},

function activeRoutineChanges(){
  if(!state.hasStableRoutine) return [...new Set([...state.currentRoutine.morning,...state.currentRoutine.evening])];

function routinePlaces(key, routine=state.currentRoutine){
  const places=[];
  ['morning','evening'].forEach(period=>{ const i=routine[period].indexOf(key); if(i>=0) places.push({period,index:i,before:routine[period][i-1],after:routine[period][i+1]}); });
  return places;
}
function routineInsight(key){

  const before=main?.before?CATALOG[main.before].name:'시작';
  const after=main?.after?CATALOG[main.after].name:'마지막';

  const relation=main?`${before} 다음, ${after} 전에 기록되어 있어요. 제품 공식 사용법과 실제 제형 기록을 기준으로 이 순서를 검토했습니다.`:'현재 루틴 밖에 있어 앞뒤 제품 관계는 아직 만들지 않았어요.';

  }else if(g.step===1){
    thread=user(g.text)+ai('제가 이렇게 이해했어요. 피부 상태를 진단한 것이 아니라, <b>제품을 찾기 위한 이번 대화의 맥락</b>만 정리했어요.',`<div class="context-card"><div class="context-head"><b>추천에 사용할 맥락</b><span class="badge ai">확인 전</span></div><div class="context-quote">세안 후 볼 당김이 오래가며, 가벼운 마무리를 원함. 가끔 느끼는 따가움 때문에 관련 불확실성을 특히 확인하고 싶음.</div><div class="context-meta"><span>직접 관찰</span><span>원하는 변화</span><span>사용감 선호</span><span>주의할 경험</span></div></div>`)+ai('이 이해가 맞나요?');

  }else if(g.step===2){
    thread=user('네, 이대로 찾아주세요')+ai('후보를 좁히기 전에 한 가지만 더 확인할게요. 따가움 경험을 말씀하셔서, 향이 강한 제품을 이번 검색에서 어떻게 다룰지 필요해요.');

  }else{
    thread=user(g.constraintLabel||'향이 강한 제품은 빼주세요')+ai('확인된 맥락으로 실제 카탈로그를 좁히고, 후보마다 필요한 근거를 OpenAI 검색으로 새로 확인했어요.',`<div class="research-strip"><span class="research-pulse"></span><div><b>검색 완료 · 후보 5개</b><small>카탈로그 23개 비교 · 공식 페이지 8개 · 성분 근거 11개 · 서버 검증 통과</small></div></div>`)+ai('후보는 “잘 맞을 확률” 순서가 아니에요. <b>지금 상황과 연결되는 근거를 설명하기 쉬운 순서</b>로 보여드릴게요.');
    dock=`<div class="reply-options"><button class="btn" data-nav="recommend">근거와 함께 후보 보기</button><button class="btn ghost" data-action="recommendEditContext">맥락 다시 말하기</button></div>`;

};

/* ===== 6. 루틴 버전 비교 ===== */
SCREENS['routine-compare'] = ()=>{
  const versions=routineHistoryData();
  const from=versions.find(v=>v.version===Number(state.compareVersions.from))||versions[1];
  const to=versions.find(v=>v.version===Number(state.compareVersions.to))||versions[0];
  const fromAll=new Set([...from.morning,...from.evening]); const toAll=new Set([...to.morning,...to.evening]);
  const added=[...toAll].filter(k=>!fromAll.has(k)); const removed=[...fromAll].filter(k=>!toAll.has(k));
  return {title:'루틴 비교',sub:`v${from.version} → v${to.version}`,body:`<div class="pad">
    <div class="compare-grid"><div class="compare-routine"><small>이전</small><b>v${from.version}</b><span class="badge ${from.status==='stable'?'good':'neutral'} mt-s">${from.statusLabel}</span></div><div class="compare-arrow">→</div><div class="compare-routine on"><small>이후</small><b>v${to.version}</b><span class="badge ${to.status==='current'?'brand':to.status==='stable'?'good':'crit'} mt-s">${to.statusLabel}</span></div></div>

    <div class="h-sec">달라진 것만 보기</div>
    <div class="change-block"><div class="change-block-head"><b>제품 구성</b><span class="badge neutral">${added.length+removed.length}개 변경</span></div>${added.map(k=>`<div class="change-item"><span class="change-symbol add">＋</span><span><b>${CATALOG[k].name}</b><br><span class="tiny muted">새 루틴에 추가</span></span></div>`).join('')}${removed.map(k=>`<div class="change-item"><span class="change-symbol remove">−</span><span><b>${CATALOG[k].name}</b><br><span class="tiny muted">새 루틴에서 제외</span></span></div>`).join('')||'<div class="tiny muted mt">제품 구성 변경 없음</div>'}</div>
    <div class="change-block"><div class="change-block-head"><b>순서·빈도</b><span class="badge info">함께 비교</span></div><div class="change-item"><span class="change-symbol move">↔</span><span>저녁에 새 제품이 들어오며 세럼·앰플 단계가 재배치됐어요.</span></div><div class="change-item"><span class="change-symbol move">↔</span><span>모이스처 앰플은 매일이 아니라 <b>주 4회</b>로 기록됐어요.</span></div></div>

    <div class="h-sec">결과의 차이</div><div class="card pad"><div class="row-between"><span class="tiny muted">v${from.version}</span><b class="tiny">${from.result}</b></div><hr class="divider"><div class="row-between"><span class="tiny muted">v${to.version}</span><b class="tiny">${to.result}</b></div></div>
    <div class="note mt-l">이 비교는 제품별 원인을 단정하기 위한 것이 아니라, <b>결과가 달라졌을 때 확인 범위를 줄이기 위한 기록</b>입니다.</div>
    <button class="btn mt-l" data-action="openRoutineVersion" data-version="${to.version}">v${to.version} 전체 보기</button>
  </div>`};
};

SCREENS['routine-saving'] = ()=>{
  const s=state.routineSave||{status:'processing'};
  const processing=s.status==='processing';
  const failed=s.status==='failed';
  return {title:'루틴 저장',sub:`v${state.routineVersion} · AI 분석`,back:false,actions:failed?`<button class="linkbtn" data-action="retryRoutineAnalysis">다시 시도</button>`:'',body:`<div class="pad" style="height:100%;display:flex;flex-direction:column;justify-content:center">

      ${failed?`<button class="btn ghost mt-l" data-action="finishFailedRoutineSave">분석 없이 현재 루틴 보기</button>`:''}
    </div>
  </div>`,onEnter(){
    if(!processing) return;
    setTimeout(()=>{
      if(current()!=='routine-saving'||state.routineSave.status!=='processing') return;
      if(state.routineSave.forceFailure){ state.routineSave.status='failed'; state.routineAI.status='failed'; render('stay'); return; }
      runRoutineAI();
      const target=state.routineSave.target||'home';

      goTab(target);

  }};
};

        ['severe','불편이 많이 심하거나 견디기 어려워요'],

      ].map(([key,label])=>`<button class="safety-select ${r.safetyAnswers?.[key]?'selected':''}" data-action="rescueToggleSafety" data-value="${key}"><span class="safety-select-box">✓</span><span>${label}</span></button>`).join('')}</div></div>`);

  } else if(step==='safety'){
    thread = user(r.safetyReason==='worse'?'전보다 악화됐어요':`해당: ${selectedSafety.join(' · ')||'안전 확인 항목'}`)

      + ai('현재 기록으로 만들 수 있는 가장 보수적인 권장 루틴이에요.',state.hasStableRoutine?routinePreview(state.stableRoutine.morning,state.stableRoutine.evening,`마지막 안정 v${state.stableRoutineVersion} 기반 임시 루틴`):routinePreview(personalMinimum.morning,personalMinimum.evening,'개인 기록 기반 최소 임시 루틴'));
    dock = replies([
      {title:'이 임시 루틴으로 전환',desc:state.hasStableRoutine?'최근 변경을 빼고 새 독립 루틴으로 시작':'개인 기록 기반 최소 루틴으로 시작',action:'rescueApplyStableTemporary',tone:'good'},
      {title:'변경 기록만 먼저 보기',action:'rescueViewFacts'},
      {title:'적용하지 않고 홈으로',action:'rescueSafetyFinish',tone:'crit'},
    ],'AI 권장안은 직접 선택한 뒤에만 적용돼요');
  } else if(step==='facts'){
    thread = ai('마지막 안정 루틴 이후 기록된 변경 사실만 보여드릴게요. 아래 제품이 원인이라는 뜻은 아니에요.',baseTimeline());
    dock = `<div class="reply-options"><button class="btn ghost" data-tab="home">홈으로</button></div>`;
  } else if(step===1){
    thread = (r.editingSymptoms
        ? user('내용을 수정할게요')+ai('수정할 내용을 다시 적어주세요. 새로 정리한 뒤 저장 전에 한 번 더 확인받을게요.')
        : user('모두 해당 없어요')+ai('좋아요. 어떤 불편이 언제부터 있었는지 평소 말하듯 적어주세요. AI가 짧게 정리한 뒤, 저장 전에 다시 확인받을게요.'));
    dock = `<div class="chat-composer"><textarea id="rescueText" placeholder="예: 어제 저녁부터 볼이 따갑고 붉어졌어요">${esc(r.detailText||'')}</textarea><div class="composer-actions"><span class="composer-hint">자유 입력은 이 Rescue 정리에만 사용해요</span><button class="btn sm" data-action="rescueDescribe">보내기</button></div></div>`;
  } else if(step===2){
    thread = user(r.detailText||'어제부터 볼이 따갑고 빨개졌어요.')
      + ai('제가 아래처럼 이해했어요. 미리 정한 증상표에 끼워 맞추지 않고, <b>말씀하신 표현과 시점</b>을 그대로 기준으로 삼을게요.',`<div class="context-card"><div class="context-head"><b>Rescue에서 사용할 맥락</b><span class="badge ai">확인 전</span></div><div class="context-quote">“어제부터 볼이 따갑고 빨개졌어요.”</div><div class="context-meta"><span>직접 표현: 따갑고 빨개짐</span><span>사용자 기억: 어제부터</span></div><div class="ai-scope">AI 해석: 최근 루틴 변경과 시간상 비교가 필요함. 진단명이나 원인은 만들지 않음.</div></div>`);
    dock = replies([
      {title:'네, 맞아요',desc:'루틴 변경 기록과 비교할게요',action:'rescueConfirmSymptoms',tone:'good'},
      {title:'내용을 수정할게요',action:'rescueEditSymptoms'},
    ]);
  } else if(step===3){
    thread = (r.fromChangeEdit
        ? user(r.extraChange||'빠진 변경을 추가했어요')+ai('추가한 내용을 포함해 변경 타임라인을 다시 정리했어요.',baseTimeline())
        : user('정리한 내용이 맞아요')+ai('루틴·내 화장품 기록에서 <b>불편이 시작되기 전까지</b> 달라진 항목을 복원했어요.',baseTimeline()))
      +ai('실제로 바꾼 내용이 이것이 전부인가요? 누락이 있으면 확인 순서를 만들기 전에 추가해야 해요.');
    dock = replies([
      {title:'네, 이게 전부예요',desc:'이 변경 기록을 확정할게요',action:'rescueConfirmChanges',tone:'good'},
      {title:'빠진 변경이 있어요',desc:'다른 화장품 시작·재개·사용법 변경',action:'rescueEditChanges'},
      {title:'잘 기억나지 않아요',desc:'불확실한 상태로 표시할게요',action:'rescueChangesUnknown'},
    ]);
  } else if(step==='editChanges'){
    thread = user('빠진 변경이 있어요')

  } else if(step==='research'){
    thread = user(r.changeAnswerLabel||'네, 이게 전부예요')

    dock = replies([{title:'확인 순서와 다음 행동 보기',desc:'기록·근거·불확실성을 함께 봐요',action:'rescueShowPriority',tone:'good'},{title:'출처 없이 기록만 볼게요',action:'rescueShowPriority'}]);

      dock = replies([

        {title:'지금은 기록만 남기기',action:'rescueFinishWithoutAction'},
      ]);
    }else{
      thread = user('확인 순서와 다음 행동을 볼게요')
        + ai('아래는 <b>원인 확률</b>이 아니라, 실제 변경 기록에 AI 근거 검색을 보태 만든 확인 순서예요.',`<div class="ai-rich-card"><div class="ai-rich-head"><div><div class="ai-rich-title">이번 루틴의 확인 순서</div><div class="ai-rich-meta">실제 사용 · 시점 · 검색 근거 · 불확실성</div></div><span class="badge neutral">기록 저장됨</span></div>${changeKeys.map((k,i)=>`<div class="verify-rank"><span class="verify-no">${i+1}</span><div class="verify-copy"><b>${CATALOG[k].name}</b><small>${i===0?'안정 루틴 이후 새로 추가 · 직접 경험 없음 · 제품 정보 일부 불확실 → 먼저 제외하면 비교가 가장 단순해짐':'같이 추가되어 다음 확인 대상 · 현재는 유지해야 한 번에 한 변화만 비교 가능'}</small></div></div>`).join('')}${r.extraChange?`<div class="verify-rank"><span class="verify-no">${changeKeys.length+1}</span><div class="verify-copy"><b>${esc(r.extraChange)}</b><small>실제 사용·시점 일부가 아직 불확실함</small></div></div>`:''}<div class="ai-scope">성분 근거는 순서를 설명하는 보조 정보일 뿐입니다. 1순위가 범인일 가능성이 높다는 뜻은 아니에요.</div></div>`)
        + ai(`<b>제 판단은 ${firstProduct.name}을 첫 조정 대상으로 삼는 것</b>입니다. 이 제품만 빼고 나머지를 유지해야 다음 결과를 가장 분명하게 비교할 수 있어요.`,routinePreview(state.currentRoutine.morning.filter(k=>k!==firstKey),state.currentRoutine.evening.filter(k=>k!==firstKey),'AI 권장 새 루틴')+`<div class="plan-card"><div class="plan-title">이렇게 책임질게요</div><div class="plan-steps"><div class="plan-step"><b>1</b><span><strong>${firstProduct.name}</strong>만 미사용 화장품으로 이동</span></div><div class="plan-step"><b>2</b><span>위 아침·저녁 제품과 순서를 새 현재 루틴으로 저장</span></div><div class="plan-step"><b>3</b><span>독립적인 7일 관찰을 시작하고 결과를 다시 판단</span></div></div></div>`);
      dock = replies([
        {title:'AI 권장 루틴으로 바로 전환',desc:`${firstProduct.name} 제외 · 위 순서 그대로 적용`,action:'rescueAcceptPlan',tone:'good'},
        {title:'뺄 제품을 직접 정할게요',action:'rescueCustomizePlan'},
        {title:'지금은 기록만 남길게요',action:'rescueFinishWithoutAction'},
      ],'실제 변경은 선택한 뒤에만 반영돼요');

  } else if(step==='customize'){

      ...changeKeys.map((k,i)=>({title:`${CATALOG[k].name}만 보류`,action:'rescueManualPlan',value:k,tone:i===0?'good':''})),

      {title:'이전으로 돌아가기',action:'rescueBackToPlan'},

      + ai('이 Rescue는 여기서 끝나고, 새 루틴은 다른 루틴과 똑같이 7일 동안 관찰해요. 그 전에 불편하면 바로 새로운 Rescue를 시작할 수 있어요.',`<div class="ai-status-card"><div class="row-between"><span class="tiny muted">관찰</span><b class="tiny">DAY 1 / 7부터 새로 시작</b></div><div class="row-between"><span class="tiny muted">불편 발생 시</span><b class="tiny">새 Rescue에서 다시 확인</b></div></div>`);
    dock = `<div class="reply-options"><button class="btn" data-action="rescueStartNewRoutine">새 루틴으로 7일 시작</button></div>`;
  }

  return {title, sub, body:layout(thread,dock), onEnter(){setTimeout(()=>{const b=appEl.querySelector('.body');if(b)b.scrollTop=b.scrollHeight;},0)}};
};

/* ---------- 라우터 / 렌더 ---------- */
const appEl = document.getElementById('app');
let stack = ['login'];
function current(){ return stack[stack.length-1]; }

function tabbar(active){
  const items = [['home','홈'],['discover','제품 찾기'],['shelf','내 화장품']];
  return `<nav class="tabbar">${items.map(([r,l])=>
    `<button class="tab ${r===active?'on':''}" data-tab="${r}">${IC()}<span>${l}</span></button>`).join('')}</nav>`;
}

function render(dir='fwd'){
  const route = current();
  const sc = SCREENS[route];
  if(!sc){ appEl.innerHTML = `<div class="pad">알 수 없는 화면: ${route}</div>`; return; }
  const cfg = typeof sc === 'function' ? sc() : sc;
  const showBack = cfg.back!==false && stack.length>1;
  const tab = cfg.tab;
  const bar = cfg.bare ? '' : `
    <header class="appbar ${cfg.flush?'flush':''} ${cfg.center?'center':''}">
      ${showBack?`<button class="ab-btn" data-back aria-label="뒤로">${IC()}</button>`:(cfg.title?'<span style="width:38px"></span>':'')}
      <div class="ab-title">${cfg.title?`<h1>${cfg.title}</h1>`:''}${cfg.sub?`<div class="sub">${cfg.sub}</div>`:''}</div>
      <div class="ab-actions">${cfg.actions||(cfg.title?'<span style="width:38px"></span>':'')}</div>
    </header>`;
  appEl.className = `app anim-${dir}`;
  appEl.innerHTML = `${bar}
    <div class="body ${cfg.grad?'grad':''}">${cfg.body}</div>
    ${cfg.fab||''}
    ${tab?tabbar(tab):''}`;
  const body = appEl.querySelector('.body');
  if(body) body.scrollTop = 0;
  if(cfg.onEnter) cfg.onEnter();
  // restart animation
  void appEl.offsetWidth;
}

function nav(route,{replace=false}={}){
  if(replace) stack[stack.length-1]=route; else stack.push(route);
  render('fwd');
}
function back(){
  if(stack.length>1){
    if(current()==='register'&&state.returnToRoutinePeriod) state.returnToRoutinePeriod=null;
    stack.pop(); render('back');
  }
}
function goTab(route){ stack = [route]; render('fwd'); }

/* ---------- 오버레이: 바텀시트 ---------- */
const sheetScrim = document.getElementById('sheetScrim');
const sheetEl = document.getElementById('sheet');
const SHEETS = {};
function openSheet(id, ctx){
  const build = SHEETS[id]; if(!build) return;
  sheetEl.innerHTML = `<div class="grab"></div>${build(ctx)}`;
  sheetScrim.style.display='block';
  void sheetScrim.offsetWidth;
  sheetScrim.classList.add('show'); sheetEl.classList.add('show');
}
function closeSheet(){
  sheetEl.classList.remove('show'); sheetScrim.classList.remove('show');
  setTimeout(()=>{ sheetScrim.style.display='none'; }, 320);
}

/* ---------- 오버레이: 모달 ---------- */
const modalScrim = document.getElementById('modalScrim');
const modalEl = document.getElementById('modal');
const MODALS = {};
function openModal(id, ctx){
  const build = MODALS[id]; if(!build) return;
  modalEl.className = 'modal ' + (MODAL_CLASS[id]||'');
  modalEl.innerHTML = build(ctx);
  modalScrim.style.display='flex';
  void modalScrim.offsetWidth;
  modalScrim.classList.add('show');
}
function closeModal(){
  modalScrim.classList.remove('show');
  setTimeout(()=>{ modalScrim.style.display='none'; }, 260);
}
const MODAL_CLASS = {};

/* ---------- 오버레이: 토스트 ---------- */
const toastHost = document.getElementById('toastHost');
function toast(msg,{type='ok'}={}){
  const el = document.createElement('div');
  el.className = 'toast '+(type==='ok'?'':type);
  el.innerHTML = `<span class="t-ic ic sm"></span><span>${msg}</span>`;
  toastHost.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),260); }, 2200);
}

/* ---------- 전역 이벤트 위임 ---------- */
document.body.addEventListener('click', e=>{
  const t = e.target.closest('[data-nav],[data-back],[data-tab],[data-sheet],[data-modal],[data-toast],[data-close-sheet],[data-close-modal],[data-action],[data-opt]');
  if(!t) return;
  const d = t.dataset;
  if(d.back!==undefined){ back(); return; }
  // 닫기 플래그는 다른 동작과 함께 올 수 있으므로 return 하지 않음
  if(d.closeSheet!==undefined) closeSheet();
  if(d.closeModal!==undefined) closeModal();
  if(d.tab){ goTab(d.tab); return; }
  if(d.sheet){ openSheet(d.sheet, d.ctx); return; }
  if(d.modal){ openModal(d.modal, d.ctx); return; }
  if(d.toast!==undefined && d.toast!==''){ toast(d.toast, {type:d.toastType||'ok'}); return; }
  if(d.opt!==undefined){ handleOpt(t); return; }
  if(d.nav){ nav(d.nav); return; }
  if(d.action){ ACTIONS[d.action] && ACTIONS[d.action](t, e); return; }
  if(d.closeSheet!==undefined || d.closeModal!==undefined) return;
});
// scrim tap closes
sheetScrim.addEventListener('click', e=>{ if(e.target===sheetScrim) closeSheet(); });
modalScrim.addEventListener('click', e=>{ if(e.target===modalScrim) closeModal(); });

/* 옵션(라디오/체크) 토글 */
function handleOpt(el){
  const group = el.dataset.group;
  const multi = el.dataset.multi!==undefined;
  const box = el.closest('.opt-group')||document;
  if(!multi && group){ box.querySelectorAll(`.opt[data-group="${group}"]`).forEach(o=>o.classList.remove('on')); }
  el.classList.toggle('on', multi ? !el.classList.contains('on') : true);
  if(el.dataset.onpick && ACTIONS[el.dataset.onpick]) ACTIONS[el.dataset.onpick](el);
}

/* AI 대화는 현재 스레드를 보존하고 다음 응답만 아래에 붙인다. */
function captureChatThread(){
  const currentThread=appEl.querySelector('.ai-thread');
  if(currentThread){
    const snapshot=currentThread.cloneNode(true);
    snapshot.querySelectorAll('button').forEach(el=>{ el.disabled=true; el.removeAttribute('data-action'); });
    return snapshot.innerHTML;
  }
  return '';
}
function checkinAdvance(nextStep){
  state.checkin.threadHistory=captureChatThread();
  state.checkin.step=nextStep;
  render('stay');
}
function earlyCheckinAdvance(nextStep){
  state.earlyCheckin.threadHistory=captureChatThread();
  state.earlyCheckin.step=nextStep;
  render('stay');
}
function rescueAdvance(nextStep){
  state.rescue.threadHistory=captureChatThread();
  state.rescue.step=nextStep;
  render('stay');
}

function appendOpinionChat(kind,question){
  const answer=opinionAIAnswer(kind);
  state.opinionChat.messages.push({role:'user',text:question||answer.question},{role:'assistant',html:answer.html,extra:answer.extra});
  render('stay');
}

  if(prompt) setTimeout(()=>appendOpinionChat(prompt),0);
};

ACTIONS.sendOpinionAI = ()=>{

function applyRescueRoutine(mode='aqua'){
  let morning=[...state.currentRoutine.morning];
  let evening=[...state.currentRoutine.evening];
  let paused=[];
  if(mode==='minimum'){
    morning=morning.filter(k=>['cleanser','cream','sun'].includes(k));
    evening=evening.filter(k=>['cleanser','cream'].includes(k));
    paused=[...new Set([...state.currentRoutine.morning,...state.currentRoutine.evening])].filter(k=>![...morning,...evening].includes(k));
  }else if(mode==='both'){
    morning=[...state.stableRoutine.morning];
    evening=[...state.stableRoutine.evening];
    paused=activeRoutineChanges();
  }else{
    const key=mode;
    morning=morning.filter(k=>k!==key);
    evening=evening.filter(k=>k!==key);
    paused=[key];
  }
  state.currentRoutine={morning,evening};
  state.rescueRecordedNoChange=false;
  state.unusedProducts=[...new Set([...state.unusedProducts,...paused])];
  state.routineVersion+=1;
  runRoutineAI();
  state.questDay=1;
  state.questRound=1;
  state.homeMode='observing';
  state.observationContext='rescue-routine';
  state.rescue.appliedMode=mode;
}
ACTIONS.rescueAcceptPlan = ()=>{
  const key=activeRoutineChanges()[0]||'aqua';
  state.rescue.planLabel='1순위만 빼고 새 루틴을 시작할게요';
  state.rescue.pausedLabel=CATALOG[key].name;
  applyRescueRoutine(key);
  state.rescue.routineResultLabel=`v${state.routineVersion} · ${CATALOG[key].name} 제외`;
  rescueAdvance(5);
};
ACTIONS.rescueCustomizePlan = ()=>{ rescueAdvance('customize'); };
ACTIONS.rescueBackToPlan = ()=>{ rescueAdvance(4); };
ACTIONS.rescueManualPlan = (el)=>{
  const mode=el.dataset.value||'both';
  const keys=mode==='both'?activeRoutineChanges():[mode];
  const pausedLabel=keys.map(k=>CATALOG[k]?.name||k).join(' · ');
  const planLabel=mode==='both'?'현재 변경 제품을 모두 보류할게요':`${pausedLabel}만 보류할게요`;
  applyRescueRoutine(mode);
  const routineResultLabel=mode==='both'?`v${state.routineVersion} · 안정 v${state.stableRoutineVersion} 복사`:`v${state.routineVersion} · 선택 제품 제외`;
  Object.assign(state.rescue,{planLabel,pausedLabel,routineResultLabel}); rescueAdvance(5);
};
ACTIONS.rescueFinishWithoutAction = ()=>{ state.rescueRecordedNoChange=true; toast('변경 기록만 저장했어요 · 7일 확인은 계속돼요', {type:'info'}); goTab('home'); };
ACTIONS.rescueStartNewRoutine = ()=>{
  toast(`현재 루틴 v${state.routineVersion}의 7일 관찰을 시작했어요`);
  goTab('home');
};
