const JUMP = [['login','로그인'],['onboarding','온보딩'],['home','홈'],['discover','제품 찾기'],['opinion','제품 의견'],['similar-products','비슷한 제품'],['opinion-chat','제품 AI 대화'],['goal','AI 추천 대화'],['recommend','추천 결과'],['product','제품별 AI 정보'],['product-routine-ai','루틴 속 제품 AI'],['ingredient-research','성분 근거 AI'],['register','새 화장품'],['shelf','내 화장품'],['routine','현재 루틴'],['routine-history','루틴 기록'],['routine-version','루틴 버전 상세'],['routine-compare','루틴 비교'],['routine-analysis','루틴 AI 분석'],['routine-order-ai','AI 순서·빈도 추천'],['routine-edit','루틴 편집'],['routine-saving','루틴 저장·AI 분석'],['early-checkin','조기 기록'],['quest','7일 결과'],['rescue','AI Rescue'],['ai-memory','AI 기억'],['me','내 정보']];
document.getElementById('jump').innerHTML = JUMP.map(([r,l])=>`<button data-jump="${r}">${l}</button>`).join('');
document.getElementById('jump').addEventListener('click', e=>{
  const b = e.target.closest('[data-jump]'); if(!b) return;
  location.hash = b.dataset.jump;
  goTab(b.dataset.jump);
});

/* 왼쪽 상황 프리셋 — 한 화면의 주요 상태를 빠르게 비교 */
function resetObservationDemo(){
  state.hasStableRoutine=true;
  state.rescueRecordedNoChange=false;
  state.currentRoutine={morning:[...DEFAULT_ROUTINE.morning],evening:[...DEFAULT_ROUTINE.evening]};
  state.stableRoutine={morning:[...STABLE_ROUTINE.morning],evening:[...STABLE_ROUTINE.evening]};
  state.routineVersion=4;
  state.stableRoutineVersion=3;
  state.unusedProducts=['cica'];
  state.routineAI={status:'ready',analyzedVersion:4,lastRun:'방금',sourceCount:9,applied:false};
}
document.getElementById('scenarios').addEventListener('click', e=>{
  const b=e.target.closest('[data-scenario]'); if(!b) return;
  document.querySelectorAll('#scenarios button').forEach(x=>x.classList.toggle('on',x===b));
  const scenario=b.dataset.scenario;
  if(scenario==='quest-start'){
    resetObservationDemo();
    state.questDay=1; state.questRound=1; state.homeMode='observing'; state.observationContext='routine'; goTab('home');
  }else if(scenario==='quest-six'){
    resetObservationDemo();
    state.questDay=6; state.questRound=1; state.homeMode='observing'; state.observationContext='routine'; goTab('home');
  }else if(scenario==='quest-due'){
    resetObservationDemo();
    state.questDay=7; state.questRound=1; state.homeMode='observing'; state.observationContext='routine'; goTab('home');
  }else if(scenario==='quest-more'){
    resetObservationDemo();
    state.questDay=3; state.questRound=2; state.homeMode='observing'; state.observationContext='routine'; goTab('home');
  }else if(scenario==='stable'){
    resetObservationDemo();
    state.currentRoutine={morning:[...DEFAULT_ROUTINE.morning],evening:[...DEFAULT_ROUTINE.evening]};
    state.stableRoutine={morning:[...DEFAULT_ROUTINE.morning],evening:[...DEFAULT_ROUTINE.evening]};
    state.routineVersion=4; state.stableRoutineVersion=4; state.homeMode='stable'; state.observationContext='routine'; goTab('home');
  }else if(scenario==='routine-edit'){
    state.routineDraft={morning:[...state.currentRoutine.morning],evening:[...state.currentRoutine.evening]};
    goTab('routine-edit');
  }else if(scenario==='routine-history'){
    resetObservationDemo();
    goTab('routine-history');
  }else if(scenario==='onboarding'){
    goTab('onboarding');
  }else if(scenario==='analysis-failed'){
    resetObservationDemo();
    state.routineSave={status:'failed',target:'routine',forceFailure:false};
    state.routineAI.status='failed';
    goTab('routine-saving');
  }else if(scenario==='early-check'){
    resetObservationDemo();
    state.questDay=6;
    state.pendingRoutineChange='save';
    state.earlyCheckin={step:0,threadHistory:'',result:null};
    goTab('early-checkin');
  }else if(scenario==='ai-recommend'){
    state.recommendChat={step:1,threadHistory:'',text:'요즘 세안하고 나면 볼이 오래 당겨요. 무거운 마무리감은 싫고, 가끔 따가울 때도 있어서 그 부분은 조심하고 싶어요.'};
    goTab('goal');
  }else if(scenario==='ai-ingredient'){
    state.ingredientChat={messages:[]};
    goTab('ingredient-research');
  }else if(scenario==='rescue'){
    resetObservationDemo();
    state.questDay=6; state.questRound=1; state.homeMode='observing'; state.observationContext='routine';
    state.rescue={step:0,source:'home',detailText:'어제부터 볼이 따갑고 빨개졌어요.',extraChange:null,changeRecorded:false,threadHistory:''};
    goTab('rescue');
  }else if(scenario==='rescue-research'){
    resetObservationDemo();
    state.rescue={step:'research',source:'home',detailText:'어제부터 볼이 따갑고 빨개졌어요.',extraChange:null,changeRecorded:true,changeAnswerLabel:'네, 이게 전부예요',threadHistory:''};
    goTab('rescue');
  }else if(scenario==='rescue-plan'){
    resetObservationDemo();
    state.rescue={step:4,source:'home',detailText:'어제부터 볼이 따갑고 빨개졌어요.',extraChange:null,changeRecorded:true,changeAnswerLabel:'네, 이게 전부예요',threadHistory:''};
    goTab('rescue');
  }else if(scenario==='rescue-no-stable'){
    resetObservationDemo();
    state.hasStableRoutine=false;
    state.rescue={step:'safety',source:'home',safetyReason:'initial',safetyAnswers:{severe:true,spreadingOrWorsening:false,needsHelp:false},detailText:'오늘 볼이 많이 따갑고 빨개졌어요.',extraChange:null,changeRecorded:false,threadHistory:''};
    goTab('rescue');
  }else if(scenario==='rescue-new'){
    resetObservationDemo();
    state.currentRoutine={morning:[...DEFAULT_ROUTINE.morning],evening:DEFAULT_ROUTINE.evening.filter(k=>k!=='aqua')};
    state.unusedProducts=[...new Set([...state.unusedProducts,'aqua'])];
    state.routineVersion=5; state.stableRoutineVersion=3; state.questDay=1; state.questRound=1; state.homeMode='observing'; state.observationContext='rescue-routine';
    goTab('home');
  }
});

/* 해시 딥링크 (#home, #rescue …) */
function bootFromHash(){
  const h = location.hash.replace('#','');
  if(h && SCREENS[h]){ stack=[h]; }
  render('fwd');
}
window.addEventListener('hashchange', ()=>{ const h=location.hash.replace('#',''); if(h&&SCREENS[h]&&h!==current()){ goTab(h); } });
bootFromHash();
</script>
